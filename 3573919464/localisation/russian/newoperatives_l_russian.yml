branch_spyrecruitment:0 "Набор Шпионов"

upgrade_spy1:0 "Инициатива Безопасности Гарнизонов"
upgrade_spy1_desc:0 "§LСоздав доктрину для защиты наших гарнизонов, мы можем безопасно убедиться, что новые земли не будут захвачены сопротивлением.§"

upgrade_spyresistancetraining:0 "Обучение Шпионов Сопротивлению"
upgrade_spyresistancetraining_desc:0 "§LСделав наших шпионов более подготовленными к военным действиям, мы можем гарантировать, что операции по поддержке местного сопротивления будут проходить успешнее, с шпионами на передовой, сражающимися вместе с местным сопротивлением.§"

upgrade_spy_begin:0 "Набор Шпионов"

upgrade_spy_rec1:0 "Увеличение Финансирования Оперативников"
upgrade_spy_rec1_desc:0 "§LЧтобы поддерживать программу шпионажа, у нас должно быть несколько оперативников, которые следят за каждым шагом врага. Единственный способ сделать это — нанять больше оперативников, что потребует дополнительных средств.§"

upgrade_spy_rec2:0 "Расширение Набора"
upgrade_spy_rec2_desc:0 "§LС уже одобренным увеличением финансирования для найма оперативников, мы столкнулись с нехваткой кадров на местах. Необходимо увеличить финансирование ещё больше.§"

spy_begintt:0 "Разблокирует §YОпции финансирования оперативников§!."

upgrade_spy_rec3:0 "Программа Найма Иностранных Шпионов"
upgrade_spy_rec3_desc:0 "§LОбращаясь к потенциально заинтересованным иностранным агентам, мы можем использовать граждан страны против неё самой, при этом агент сможет легче маскироваться и сливаться с окружением. Это будет крайне полезно, если мы начнем программу набора иностранных оперативников.§"
