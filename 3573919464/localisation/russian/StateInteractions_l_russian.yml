l_russian:
 SI_stateview_button:0 "Переключить меню §YВзаимодействий с Регионами§!\n--------------------\nАктивные правила:\n- Передача регионов (§Y[SiStateTransferGameRule]§!)\n- Поведение ИИ (§Y[SiAiBehaviourRule]§!)\n- Поведение Отказа ИИ (§Y[SiAiRejectionRule]§!)"

 SI_state_demand_button:0 "Запросить §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_demand_state_pp_required] £GFX_pol_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.owner.GetName]§! §RНЕ§! в войне с вами, вашим субъектом или союзником\n- §Y[FROM.owner.GetName]§! §RНЕ§! вы, ваши субъект или союзник\n- §Y[FROM.GetName]§! имеет границу с вами или вашим субъектом\n- §Y[FROM.GetName]§! §RНЕ§! субъект запросов\n- Вы §RНЕ§! субъект другой страны\n--------------------\nПерерыв: §Y[?global.si_demand_state_cooldown_days]§! дней (§gКрупное взаимодействие§!)"

 SI_state_vsl_button:0 "Запросить вассализацию §Y[FROM.owner.GetAdjective]§![FROM.owner.GetFlag] ([?global.si_demand_vassalisation_pp_required] £GFX_pol_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.owner.GetName]§! §RНЕ§! в состоянии войны\n- §Y[FROM.owner.GetName]§! §RНЕ§! вы, ваш субъект или союзник\n- §Y[FROM.owner.GetName]§! §RНЕ§! субъект запрсоов\n- §Y[FROM.owner.GetName]§! имеет границу с вами или вашим субъектом\n- Вы §RНЕ§! субъект другой страны\n--------------------\nПерерыв: §Y[?global.si_demand_vassalisation_cooldown_days]§! дней (§gКрупное взаимодействие§!)"

 SI_state_int_button:0 "Запросить интеграцию §Y[FROM.owner.GetAdjective]§![FROM.owner.GetFlag]"

 SI_state_claim_button:0 "Заявить о правах на §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_claim_state_cp_required] £GFX_command_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.owner.GetName]§! §RНЕ§! вы, ваш субъект или союзник\n- §Y[FROM.owner.GetName]§! имеет границу с вами или вашим субъектом\n- §Y[FROM.GetName]§! §RНЕ§! заявлено о ваших правах и §RНЕ§! является национальной\n--------------------\nПерерыв: §Y[?global.si_claim_state_cooldown_days]§! дней (§gМалое взаимодействие§!)"

 SI_state_core_button:0 "национализировать §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_core_state_guns_required] £GFX_infantry_equipment_text_icon [?global.si_core_state_cp_required] £GFX_command_power )\n--------------------\n§YДополнительные требования§!\n- §CПодчинение§! более §Y[?global.si_core_state_compliance_required]%§!\n- §OСопротивление§! ниже §Y[?global.si_core_state_resistance_required]%§!\n- §Y[FROM.GetName]§! принадлежит вам\n- §Y[FROM.GetName]§! §RНЕ§! является национальной\n--------------------\nПерерыв: §Y[?global.si_core_state_cooldown_days]§! дней (§gМалое взаимодействие§!)"

 SI_state_move_cap_button:0 "Переместить столицу в §Y[FROM.GetName]§![FROM.owner.GetFlag] ([?global.si_move_capital_pp_required] £GFX_pol_power )\n--------------------\n§YДополнительные требования§!\n- §Y[FROM.GetName]§! принадлежит вам\n- §Y[FROM.GetName]§! §RНЕ§! ваша столица\n- §Y[FROM.GetName]§! является национальной\n--------------------\nПерерыв: §Y[?global.si_move_capital_cooldown_days]§! дней (§gМДругое взаимодействие§!)"

 SI_state_transfer_menu_button:0 "Переключить меню §YПередачи Регионов§!"

 SI_major_demands_idea:0 "Крупное взаимодействие"
 SI_minor_demands_idea:0 "Малое взаимодействие"
