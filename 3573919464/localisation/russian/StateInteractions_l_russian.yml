 sievent.1.t:0 "TEST EVENT"
 sievent.1.desc:0 "[FROM.GetName] -- [ROOT.GetName]"
 sievent.1.a:0 "Ok"

 sievent.2.t:0 "[FROM.GetNameDefCap] Запрашивает мирную передачу региона [?FROM.requested_state_@ROOT.GetName]!"
 sievent.2.desc:0 "Дипломатические каналы охвачены внезапной, неотложной активностью. Дипломаты из [FROM.GetNameDef] выпустили резкое, официальное коммюнике. Они выдвигают стратегические претензии на [?FROM.requested_state_@ROOT.GetName], который в настоящее время находится под нашим управлением. В документе содержится просьба — или, скорее, настойчивое требование — о мирной и незамедлительной передаче территории под их контроль."
 sievent.2.a:0 "Война будет стоит нам большего."
 sievent.2.b:0 "Только через наш труп!"

 sievent.3.t:0 "[FROM.GetNameDefCap] отвергает мирную передачу региона [?ROOT.requested_state_@FROM.GetName]"
 sievent.3.desc:0 "Наше щедрое предложение по передаче [?ROOT.requested_state_@FROM.GetName] было встречено с презрением и неповиновением. Их правительство отказывается прислушаться к здравому смыслу. Их упрямство не оставляет нам иного выбора, кроме как рассмотреть другие, более «прямые» средства для обеспечения того, что по праву принадлежит нам."
 sievent.3.a:0 "Мы подождем... пока что."
 sievent.3.b:0 "Их неповиновение станет их погибелью."

 sievent.4.t:0 "[FROM.GetNameDefCap] требует нашей вассализации"
 sievent.4.desc:0 "[FROM.GetNameDefCap], воодушевленные своей силой или нашей предполагаемой слабостью, выдвинули унизительный ультиматум. Они требуют не просто территории, а сам наш суверенитет. Мы должны полностью подчиниться, став марионеточным государством под их властью. Принятие этого требования означало бы конец нашей независимой внешней политики."
 sievent.4.a:0 "Лучше сдаться без кровопролития."
 sievent.4.b:0 "Умрём же свободными!"

 sievent.5.t:0 "[FROM.GetNameDefCap] отвергают предложение о вассализации"
 sievent.5.desc:0 "[FROM.GetNameDefCap] осмелились отказаться от нашего великодушного предложения о защите и интеграции в нашу сферу влияния. Их безрассудная гордость ослепляет их, мешая увидеть новый порядок, который строится. Они предпочитают оставаться камнем преткновения на пути к прогрессу."
 sievent.5.a:0 "Войну мы не потянем."
 sievent.5.b:0 "Их сопротивление будет подавлено."

 sievent.6.t:0 "[FROM.GetNameDefCap] Отдают свой регион!"
 sievent.6.desc:0 "Под огромным дипломатическим давлением и надвигающейся угрозой конфликта правительство [FROM.GetNameDef] объявило о безоговорочной передаче одного из своих регионов. Передача прошла тихо, с минимальной церемонией, ознаменовав значительный сдвиг в региональном балансе сил без единого выстрела."
 sievent.6.a:0 "Баланс сил сдвигается."

 sievent.7.t:0 "[FROM.GetNameDefCap] Вассализованы!"
 sievent.7.desc:0 "Столкнувшись с непреодолимым давлением, администрация [FROM.GetNameDef] подписала договор о вассальной зависимости, фактически отказавшись от своего суверенитета. Хотя их флаг может по-прежнему развеваться, политика и армия теперь управляются из иностранной столицы."
 sievent.7.a:0 "Баланс сил сдвигается."

