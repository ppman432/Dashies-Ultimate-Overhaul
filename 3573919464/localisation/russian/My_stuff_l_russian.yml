HEPO_Dish_trait: "Самопровозглашённый Лучший Пони"
HEPO_Dish_trait_desc: "§LПроисходя из загадочного прошлого, эта версия Rainbow Dash (если это вообще она) обладает врожденной способностью всегда быть на высоте. Она утверждает, что это из-за её «крутости», однако у существ есть сомнения.§!\n\n§4Примечание редактора: это крайний случай редкой болезни, известной как marius Suess.§!"

host_hire_dishg: "Нанять Интересного Генерала..."
host_hire_dishg_desc: "Нам, по всей видимости, «Божественное вмешательство» предоставило возможность нанять весьма любопытного генерала. Должны ли мы это сделать?"

construction_speed_open_tt: "Показать Скорость Строительства"
construction_speed_open_tt_d: "§LПоказывает скорость строительства всех зданий в удобном списке.§!"

civilian_train_2: "Совр. Паровые Поезда"
civ_train_equipment_2: "Совр. Паровые Поезда"
civ_train_equipment_2_desc: "Эти локомотивы имеют перегретые котлы, улучшенные поршни и обтекаемую конструкцию. Они обеспечивают большую мощность, скорость и эффективность — идеальны для дальних перевозок и тяжёлых грузов по спорным территориям.\n\n"

civ_train_equipment_3: "Дизельные Поезда"
civ_train_equipment_3_desc: "Дизельные двигатели устраняют необходимость в водяных и угольных станциях, позволяя выполнять длительные непрерывные рейсы. Их высокий крутящий момент и надёжность незаменимы для современной логистики, особенно в отдалённых регионах."

civ_train_equipment_4: "Атомные Поезда"
civ_train_equipment_4_desc: "Используя компактные ядерные реакторы, эти экспериментальные поезда обладают беспрецедентной выносливостью и практически неограниченным диапазоном. Неуязвимы к нехватке топлива и могут непрерывно обеспечивать логистику даже на разрушенных территориях — за счёт высокой сложности и дороговизны."

hvy_train_equipment_1: "Тяжёлые Паровые Поезда"
hvy_train_equipment_1_desc: "Созданы для перевозки массивных грузов через горные перевалы и длинные маршруты, обеспечивая снабжение войск. Их огромные размеры и количество осей позволяют тянуть целые военные колонны.\n\n"

hvy_train_equipment_2: "Ширококолейные Дизельные Поезда"
hvy_train_equipment_2_desc: "Спроектированы для сверхшироких путей, способны перевозить батальоны или достаточное снабжение для войны на недели. Требуют специальной инфраструктуры, но их вместимость и комфорт демонстрируют мощь массового транспорта, пропагандистских туров и быстрых стратегических перебросок."

hvy_train_equipment_3: "Ширококолейные Атомные Поезда"
hvy_train_equipment_3_desc: "Разработаны на базе ширококолейных конструкций, питаются атомной энергией. Позволяют транспортировать большие грузы быстрее, без затрат на топливо. Однако требуют огромного финансирования и высокой сложности эксплуатации."

