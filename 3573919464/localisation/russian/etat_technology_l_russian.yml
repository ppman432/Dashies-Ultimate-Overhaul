aviation_fuel:0 "Авиационный бензин"
aviation_fuel_desc:0 "Развитие нефтепереработки позволяет получать высококачественное топливо, повышающее скорость и манёвренность самолётов."

aviation_fuel2:0 "Авиационный бензин с высоким октановым числом"
aviation_fuel2_desc:0 "Увеличение октанового числа улучшает скорость и манёвренность, но повышает расход топлива."

aviation_fuel3:0 "Добавки в бензин"
aviation_fuel3_desc:0 "Предотвращают засорение топливной системы; при сильном загрязнении могут вызвать остановку двигателя, но повышают мощность."

aviation_fuel4:0 "Улучшенные добавки"
aviation_fuel4_desc:0 "Улучшенные добавки повышают стойкость бензина к детонации, регулируют процесс сгорания и снижают нагрузку на двигатель."

aviation_fuel5:0 "Авиационный керосин"
aviation_fuel5_desc:0 "Идеальное топливо для реактивных двигателей, повышающее скорость и манёвренность авиации."

water_methanol:0 "Система впрыска воды и метанола"
water_methanol_desc:0 "Позволяет подавлять детонацию, увеличивая давление в цилиндрах и эффективность двигателя; иногда приводит к авариям."

synth_construction:0 "Улучшенный дизайн НПЗ"
synth_construction_desc:0 "Новая упрощённая конструкция синтетического завода требует меньше строительных работ при той же производительности."

civilianexports:0 "Гражданский импорт I"
civilianexports_desc:0 "Технологические и бюрократические улучшения позволили дополнить экономику импортом."
civilianexports2:0 "Гражданский импорт II"
