INFANTRY_TITLE_CLOTHING:0 "ОДЕЖДА"
camo:0 "Одноцветная"
camo_desc:0 "Одноцветная форма."
camo1942:0 "Усовершенствованный камуфляж"
camo1942_desc:0 "Новый рисунок камуфляжа, позволяющий войскам быть менее заметными при засадах и проникновении."
camo1948:0 "Полу-модерновый камуфляж"
camo1948_desc:0 "Лёгкий и ещё более подходящий для засад и проникновения камуфляж."
camo1955:0 "Современный камуфляж"
camo1955_desc:0 "Теперь видишь, теперь нет."
winter_clothes_gw:0 "Зимняя одежда"
winter_clothes_gw_desc:0 "Устаревшая зимняя одежда из шерсти. Неэффективная, но лучше, чем ничего."
winter_clothes_1939:0 "Улучшенная зимняя одежда"
winter_clothes_1939_desc:0 "Более подходящая зимняя одежда. Куртка с ватной подкладкой из тёплого хлопка."
winter_clothes_1941:0 "Продвинутая зимняя одежда"
winter_clothes_1941_desc:0 "Продвинутая зимняя одежда из натуральной тёплой шерсти и искусственного меха с ранним водоотталкивающим покрытием, окрашена в белый цвет."
winter_clothes_1944:0 "Современная зимняя одежда"
winter_clothes_1944_desc:0 "Современная двусторонняя зимняя одежда из тёплого синтетического материала с съёмной водоотталкивающей курткой. Цвета: белый, чёрный и коричневый для большей эффективности. Лёгкая, тёплая и защищает от влаги."
jngdst_clothes_gw:0 "Пустынная и джунглевая одежда"
jngdst_clothes_gw_desc:0 "Устаревшая пустынная и джунглевая одежда из хлопка. Неэффективная, но лучше, чем ничего."
jngdst_clothes_1939:0 "Улучшенная пустынная и джунглевая одежда"
jngdst_clothes_1939_desc:0 "Более подходящая одежда для пустыни и джунглей. Из тонкого хлопка. Добавлены очки для защиты от песка."
jngdst_clothes_1941:0 "Продвинутая пустынная и джунглевая одежда"
jngdst_clothes_1941_desc:0 "Продвинутая одежда из натурального тонкого хлопка с особым покрытием, быстро сохнет, помогает в жаркой и влажной среде."
jngdst_clothes_1944:0 "Современная пустынная и джунглевая одежда"
jngdst_clothes_1944_desc:0 "Современная лёгкая ткань с термозащитной курткой. Цвета: песочный, чёрный и коричневый. Лёгкая, сохраняет свежесть и сухость."

