flexible_railnetwork:0 "Гибкая железнодорожная сеть"
flexible_railnetwork_desc:0 "Оптимизация и приведение железных дорог к общим стандартам позволили нам упростить их строительство и снизить стоимость снабжения."

military_railnetwork:0 "Военная железнодорожная сеть"
military_railnetwork_desc:0 "Война требует корректировок всего, включая железные дороги. Дополнительная стандартизация позволила снизить стоимость и ускорить строительство."

modern_military_railnetwork:0 "Современная военная железнодорожная сеть"
modern_military_railnetwork_desc:0 "Современные железные дороги способны перевозить значительно больший объём грузов на большие расстояния при относительно низкой стоимости."

combat_service:0 "Служба в бою"
combat_service_desc:0 "Армии постоянно нужны поставки; формируя непрерывные колонны грузовиков, мы можем более эффективно обеспечивать её потребности."

convoy_highways:0 "Конвойные дороги"
convoy_highways_desc:0 "Дороги, по которым перевозятся поставки, должны иметь высший приоритет перед другими грузами."

camouflage:0 "Маскировка"
camouflage_desc:0 "Развитие ударной авиации заставляет нас массово использовать маскировку для сохранения войск."

camouflage2:0 "Улучшенная маскировка"
camouflage2_desc:0 "Массовое введение маскировки, использование дополнительных маскировочных покровов и улучшение материалов поможет уменьшить потери от авиаударов."

camouflage3:0 "Стандартизированная маскировка"
camouflage3_desc:0 "Введение единого стандарта маскировки для каждого типа местности и сезона ещё больше защитит наши войска от авиаударов."

camouflage4:0 "Магия в маскировке"
camouflage4_desc:0 "Использование простых заклинаний в материалах маскировки создаст эффект искажения, делая форму и контур объекта неузнаваемыми."

pontoon_bridge:0 "Простейшие мобильные понтонные мосты"
pontoon_bridge_desc:0 "Для быстрого преодоления рек и болот нужны лёгкие, прочные и надёжные мосты, которые можно собрать прямо на месте."

pontoon_bridge2:0 "Усовершенствованные мобильные понтонные мосты"
pontoon_bridge2_desc:0 "Из-за продолжающихся боевых действий мы разработали новые способы установки мобильных мостов, более удобные в бою, что облегчит проведение наступательных операций через реки и болота."

flamethrower_squad:0 "Отряд огнемётчиков"
flamethrower_squad_desc:0 "Используя малые ёмкости с горючей жидкостью, инженерные отряды могут продвигаться через леса, города и укреплённые позиции противника."

flamethrower_squad2:0 "Усовершенствованный отряд огнемётчиков"
flamethrower_squad2_desc:0 "Инженерные части с огнемётами представляют серьёзную угрозу для обороняющихся. Любые укрепления и леса можно легко расчистить с помощью команды инженеров с огнемётами."

engineer_added_support_equipment_tooltip:0 "Снаряжение §YИнженерных подразделений§! Огнемёты потребуют §R15§! дополнительных §Yединиц вспомогательного оборудования§!.\n"
engineer_added_support_equipment2_tooltip:0 "Снаряжение §YИнженерных подразделений§! Понтонные мосты потребуют §R15§! дополнительных §Yединиц вспомогательного оборудования§!.\n"

tech_dig_1:0 "Пехотные лопаты I"
tech_dig_1_desc:0 "Даже простые лопаты позволяют солдатам создавать лучшую оборону без строительства блиндажей и укреплений."

tech_dig_2:0 "Пехотные лопаты II"
tech_dig_2_desc:0 "Улучшенные лопаты, более прочные и лёгкие, облегчают солдатам возведение временных укреплений."

tech_dig_3:0 "Пехотные лопаты III"
tech_dig_3_desc:0 "Улучшенные лопаты, более прочные и лёгкие, облегчают солдатам возведение временных укреплений."

tech_dig_4:0 "Пехотные лопаты IV"
tech_dig_4_desc:0 "Улучшенные лопаты, более прочные и лёгкие, облегчают солдатам возведение временных укреплений."

shovel_added_support_equipment_tooltip:0 "Снаряжение §YВся пехота и моторизованные/механизированные§! лопаты потребуют §R5§! §Yединиц вспомогательного оборудования§!.\n"

marines_terrain_training:0 "Подготовка морской пехоты I"
marines_terrain_training_desc:0 "Боевые навыки морской пехоты в необычной местности — ключ к любому амфибийному вторжению или переправе через реки. Необходимо инвестировать ресурсы в подготовку войск."

marines_terrain_training2:0 "Подготовка морской пехоты II"
marines_terrain_training2_desc:0 "Продолжая обучение, мы добьёмся ещё более впечатляющих результатов при боях в различных условиях."

divisional_headquarters:0 "Дивизионное командование"
divisional_headquarters_desc:0 "Дивизионное командование — основной орган управления войсками, направляющий их повседневную и боевую деятельность."

merc_enabled_tt:0 "§RЭтот национальный дух будет утрачен, если мы окажемся в войне!§!"

upgrade_home_guard:0 "Модернизация милиции"
upgrade_home_guard_desc:0 "Формируя народные дружины, мы сможем лучше выявлять вражеских агентов."

recon_radio:0 "Радиоразведка"
recon_radio_desc:0 "Выдача радиостанций разведывательным подразделениям позволит передавать информацию командиру быстрее, чем противник сможет среагировать."

radio_2:0 "Пехотная радиосвязь"
radio_2_desc:0 "Оборудование пехоты радиостанциями позволит им лучше атаковать, защищаться и обеспечивать сосредоточенный огонь."

corps_communications:0 "Дивизионная связь"
corps_communications_desc:0 "Использование радио позволяет штабам лучше контролировать операции. Даже на уровне корпуса возможно прямое тактическое взаимодействие с частями на поле боя."

artillery_radio:0 "Радио артиллерии"
artillery_radio_desc:0 "Оснащение артиллерии радиостанциями ускоряет поддержку наступления и обороны через скоординированный огонь."

vehicle_radio:0 "Радио в грузовиках"
vehicle_radio_desc:0 "Дополнительные радиостанции в грузовиках позволяют командирам быстрее координировать действия и реагировать на движения противника."

army_communications:0 "Радио штаба армии"
army_communications_desc:0 "Прямая радиосвязь с штабом армии позволяет мгновенно корректировать планы на фронте."

artillery_radio_2:0 "Радио артиллерии II"
artillery_radio_2_desc:0 "Лучшее радио позволит артиллерии быстрее поддерживать наступление и оборону через согласованный огонь."

army_communications2:0 "Ветвистая связь"
army_communications2_desc:0 "Поддержка связи с подчинёнными подразделениями важна для операций. Поиск новых способов ускорить связь даёт преимущество над противником."

army_communications3:0 "Радиоцентр"
army_communications3_desc:0 "Создание множества радиоузлов поможет координировать войска и облегчить проведение авиаударов."

artillery_radio_3:0 "Радио артиллерии III"
artillery_radio_3_desc:0 "Наличие современных наблюдательных постов позволяет быстро реагировать на движения противника и наносить серьёзный урон."

recon_radio_added_support_equipment_tooltip:0 "Снаряжение §YРазведывательных подразделений§! радиостанции потребуют §R5§! дополнительных §Yединиц вспомогательного оборудования§!.\n"
radio_2_infantry_equipment:0 "Снаряжение §YВся пехота и моторизованные/механизированные§! радиостанции потребуют §R5§! дополнительных §Yединиц вспомогательного оборудования§!.\n"
radio_artillery1_equipment:0 "Снаряжение §YВся линейная артиллерия§! радиостанции потребуют §R7§! дополнительных §Yединиц вспомогательного оборудования§!.\n"
radio_artillery1_equipment_2:0 "Снаряжение §YВся линейная артиллерия§! дополнительные радиостанции потребуют §R3§! единиц §Yвспомогательного оборудования§!.\n"
radio_truck_equipment:0 "Снаряжение §YВся моторизованная/механизированная пехота§! дополнительные радиостанции потребуют §R3§! единиц §Yвспомогательного оборудования§!.\n"

consumer_electronics:0 "Бытовая электроника"
consumer_electronics_desc:0 "Снижение стоимости электроники улучшает её доступность для граждан и повышает качество жизни."

consumer_tv:0 "Массовое телевидение"
consumer_tv_desc:0 "Развитие промышленности позволит увеличить производство телевизоров для граждан."

EQ_MOD_SLOT_special_type_slot_9_TITLE: "Радиостанция"

super_artillery:0 "Упрощение заряжания"
super_artillery_desc:0 "Увеличение скорострельности позволит нам лучше поддерживать войска."
super_artillery2:0 "Улучшенные снаряды"
super_artillery2_desc:0 "Мы можем увеличить количество взрывчатки в снарядах для повышения их эффективности."

heavy_artillery_equipment:0 "Тяжёлая артиллерия"
heavy_artillery_equipment_desc:0 "Артиллерия большого калибра, предназначенная для пробивания многослойной обороны противника."
heavy_artillery_equipment_1:0 "Тяжёлая артиллерия"
heavy_artillery_equipment_2:0 "Улучшенная тяжёлая артиллерия"

heavy_artillery_brigade:0 "Тяжёлая артиллерия"
heavy_mot_artillery_brigade:0 "Моторизованная тяжёлая артиллерия"
heavy_mot_artillery_brigade_desc:0 "Моторизация облегчает перемещение этих тяжёлых орудий."
mech_heavy_artillery_brigade:0 "Механизированная тяжёлая артиллерия"
mech_heavy_artillery_brigade_desc:0 "Механизация ещё больше облегчает транспортировку тяжёлых орудий."

heavyartillery2:0 "Модернизация конструкции гаубицы"
heavyartillery2_desc:0 "Улучшение стволов также увеличит скорострельность артиллерии."
heavyartillery3:0 "Модернизация снарядов"
heavyartillery3_desc:0 "Использование лучших химических компонентов увеличит поражающую силу орудий."
heavyartillery3_a:0 "Зажигательные снаряды"
heavyartillery3_a_desc:0 "Использование специальных снарядов позволит точнее поражать личный состав противника."

heavyartillery5:0 "Увеличение размеров"
heavyartillery5_desc:0 "Увеличение размера снарядов повысит их убойность, но замедлит скорость передвижения конвоев."

heavyartillery6:0 "Увеличение калибра"
heavyartillery6_desc:0 "Дополнительные усилия по литью стволов увеличили мощность орудий, но увеличили их вес и снизили скорость перемещения."

heavyartillery7:0 "Лучшее позиционирование"
heavyartillery7_desc:0 "Привлечение дополнительного обслуживающего персонала и моторизация/механизация позволит быстро менять позиции артиллерии."

heavyartillery8:0 "Улучшенные колёса"
heavyartillery8_desc:0 "Лучшие колёса облегчат перемещение орудий и сделают контрбатарейную борьбу более эффективной."

heavyartillery9:0 "Концентрация огня"
heavyartillery9_desc:0 "Концентрируя огонь на небольшой площади, мы можем просто уничтожить позиции противника."

heavyartillery10:0 "Компьютеризация системы огня"
