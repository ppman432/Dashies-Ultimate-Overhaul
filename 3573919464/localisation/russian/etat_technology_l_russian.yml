drydocks:0 "Улучшенные доки"
drydocks_desc:0 "Новые технологии соединений позволили проектировать более крупные сухие доки."

divert_navy:0 "Переключение на флот I"
divert_navy_desc:0 "Нужно перенаправить ресурсы на увеличение производства кораблей."

divert_navy2:0 "Переключение на флот II"
divert_navy2_desc:0 "Наши усилия оправданы — враги боятся нашего флота, нельзя останавливаться, всё для флота!"

port_infra0:0 "Стандартизированные верфи"
port_infra0_desc:0 "Переход к единым стандартам ускоряет строительство верфей и кораблей."

port_infra:0 "Верфи"
port_infra_desc:0 "Улучшенные методы и материалы позволяют строить верфи и корабли быстрее."

port_infra1:0 "Верфи I"
port_infra1_desc:0 "Обновление инструментов и оборудования ускоряет строительство верфей и выпуск кораблей."

port_infra2:0 "Верфи II"
port_infra2_desc:0 "Введение современных транспортных средств и опыт ускоряют ремонт и постройку кораблей."

port_infra3:0 "Верфи III"
port_infra3_desc:0 "Высокая механизация и улучшенные процедуры ускоряют строительство верфей."

port_infra4:0 "Верфи IV"
port_infra4_desc:0 "Эффективное строительство требует планирования и стандартизации верфей."

port_infra5:0 "Верфи V"
port_infra5_desc:0 "Постоянная модернизация верфей повышает эффективность строительства и обучение кораблестроителей."

port_infra6:0 "Верфи VI"
port_infra6_desc:0 "Верфи, как и корабли, — произведения искусства, но совершенствованию нет предела!"

tool_maintenance:0 "Обслуживание инструментов"
tool_maintenance_desc:0 "Регулярное обслуживание продлевает срок службы инструментов и увеличивает их ремонтопригодность."

worker_training:0 "Обучение рабочих"
worker_training_desc:0 "Обучение работе с оборудованием повышает надёжность, долговечность и эффективность."

on_spot_training:0 "Обучение на месте"
on_spot_training_desc:0 "Необходимо, чтобы рабочие знали, как пользоваться оборудованием; опыт передаётся новым сотрудникам."

worker_colleges:0 "Колледжи для рабочих"
worker_colleges_desc:0 "Организация колледжей на предприятиях позволяет быстрее вовлекать работников в производство."

housing_work:0 "Строительство жилья"
housing_work_desc:0 "Рост населения требует увеличения объёма жилищного строительства."

housing_work2:0 "Субсидии на строительство"
housing_work2_desc:0 "Выдача дополнительных субсидий увеличит объём нового жилья."

housing_work3:0 "Многоэтажное строительство"
housing_work3_desc:0 "Технологии позволяют строить многоэтажные дома, упрощая расселение населения."

housing_work4:0 "Стандартизированное строительство"
housing_work4_desc:0 "Приведение строительства к единым стандартам ускоряет работы и снижает их стоимость."

housing_work5:0 "Современное строительство"
housing_work5_desc:0 "Современные методы и материалы позволяют быстро создавать новые кварталы. Дом каждому!"

schools_work:0 "Кадетские школы I"
schools_work_desc:0 "Обучение должно стать доступнее и профессиональнее. Только обучая наш народ, включая военные навыки, мы сможем занять своё место под солнцем в этом мире."
schools_work2:0 "Кадетские школы II"
schools_work2_desc:0 "Обучение должно стать доступнее и профессиональнее. Только обучая наш народ, включая военные навыки, мы сможем занять своё место под солнцем в этом мире."
schools_work3:0 "Кадетские школы III"
schools_work3_desc:0 "Обучение должно стать доступнее и профессиональнее. Только обучая наш народ, включая военные навыки, мы сможем занять своё место под солнцем в этом мире."
schools_work4:0 "Кадетские школы IV"
schools_work4_desc:0 "Обучение должно стать доступнее и профессиональнее. Только обучая наш народ, включая военные навыки, мы сможем занять своё место под солнцем в этом мире."
schools_work5:0 "Кадетские школы V"
schools_work5_desc:0 "Обучение должно стать доступнее и профессиональнее. Только обучая наш народ, включая военные навыки, мы сможем занять своё место под солнцем в этом мире."
schools_work6:0 "Кадетские школы VI"
schools_work6_desc:0 "Обучение должно стать доступнее и профессиональнее. Только обучая наш народ, включая военные навыки, мы сможем занять своё место под солнцем в этом мире."

hospital_work:0 "Система здравоохранения"
hospital_work_desc:0 "Современные методы и материалы позволяют строить лучшие больницы и обеспечивать качественную медицинскую помощь как гражданским, так и военным. Наши войска и опытные кадры бесценны, поэтому мы должны сохранять их здоровье."
hospital_work2:0 "Система здравоохранения I"
hospital_work2_desc:0 "Обновление инструментов и оборудования ускоряет строительство больниц и полевых госпиталей."
hospital_work3:0 "Система здравоохранения II"
hospital_work3_desc:0 "Использование современных транспортных средств и опыт медицинских достижений позволяет делать больницы более эффективными."
hospital_work4:0 "Система здравоохранения III"
hospital_work4_desc:0 "Механизация и улучшенные процедуры ускоряют строительство, повышая эффективность работы больниц."
hospital_work5:0 "Система здравоохранения IV"
hospital_work5_desc:0 "Эффективное строительство требует тщательного планирования и стандартизированных решений для максимальной работы больниц."
hospital_work6:0 "Система здравоохранения V"
hospital_work6_desc:0 "Продолжая модернизировать больницы и оборудование, мы сможем спасать больше жизней."
hospital_work7:0 "Система здравоохранения VI"
hospital_work7_desc:0 "Инвестируя больше в больницы и клиники, мы спасаем больше жизней."

naval_refitting:0 "Улучшенное обновление флота"
naval_refitting_desc:0 "Научный и технологический прогресс позволяет исправлять недостатки старых моделей и соответствовать текущим потребностям."
improved_naval_refitting:0 "Улучшенное усовершенствование флота"
improved_naval_refitting_desc:0 "Создание специализированных групп и комиссий для модернизации устаревших модулей позволит поддерживать максимальную эффективность флота."

Breakout_tactics:0 "Тактика прорыва"
Breakout_tactics_desc:0 "Развивая механизированные войска, мы можем улучшить тактику атакующих подразделений и увеличить их эффективность в наступательных операциях, используя новые методы прорыва обороны противника и стремительного продвижения на его территорию."
Standardized_Tactics:0 "Стандартизированная тактика"
Standardized_Tactics_desc:0 "Стандартизация использования механизированных войск улучшает тактику атакующих и организацию боевых операций."
Steel_wave:0 "Стальная волна"
Steel_wave_desc:0 "Концентрация ударов механизированных войск позволяет пробивать любую оборону противника и облегчает логистику снабжения войск."
armor_training:0 "Обучение танков основного боя"
armor_training_desc:0 "Так как основной боевой танк стал стандартом, необходимо скорректировать обучение и структуру, чтобы использовать его эффективно."
armor_training2:0 "Обучение основным боевым танкам II"
armor_training2_desc:0 "Продолжение подготовки войск по стратегическому маневрированию и координации танковых дивизий крайне важно."

rocket_artillery_incendiary:0 "Зажигательные ракеты"
rocket_artillery_incendiary_desc:0 "Использование ракет с пиротехническим составом позволяет поджигать леса и вытеснять врага."
rocket_artillery_spin:0 "Вращение снарядов"
rocket_artillery_spin_desc:0 "Фрезерование сопел для закрутки ракеты повышает точность, но требует сложной работы."
rocket_artillery_fin:0 "Дополнительные боеприпасы"
rocket_artillery_fin_desc:0 "Хвостовая стабилизация проста в технологии и позволяет запускать ракеты большими залпами."
rocket_artillery_reloading:0 "Более быстрая перезарядка"
rocket_artillery_reloading_desc:0 "Оптимизация новых ракет на основе боевого опыта повышает огневую мощь и удобство работы батарей."
rocket_artillery_mobile:0 "Мобильные батареи"
rocket_artillery_mobile_desc:0 "Легкие и дешёвые материалы повышают подвижность пусковых установок без потери боевых качеств."

