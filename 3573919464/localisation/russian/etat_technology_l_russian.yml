l_russian: 
aluminum_production_1:0 "Производство алюминия"
aluminum_production_1_desc:0 "Недавние достижения в технологии помола позволяют увеличить производство алюминия."
aluminum_production_2:0 "Производство алюминия II"
aluminum_production_2_desc:0 "Дальнейшие улучшения в технологии помола позволяют умеренно увеличить производство алюминия."
aluminum_production_3:0 "Производство алюминия III"
aluminum_production_3_desc:0 "Благодаря новым методам обработки мы можем значительно увеличить производство алюминия."

steel_production_1:0 "Производство металла"
steel_production_1_desc:0 "Недавние достижения в технологии помола позволяют увеличить производство стали."
steel_production_2:0 "Производство металла II"
steel_production_2_desc:0 "Дальнейшие улучшения в технологии помола позволяют умеренно увеличить производство металла."
steel_production_3:0 "Производство металла III"
steel_production_3_desc:0 "Наши методы обработки стали позволяют регулярно производить значительные объёмы металла."
steel_production_4:0 "Производство металла IV"
steel_production_4_desc:0 "Наше производство стали настолько развито, что мы можем фактически наводнить рынок, к радости и огорчению других стран. Это также позволяет увеличить производство других металлов."

### Артиллерия
artillery_a:0 "Совершенствование механизмов заряжания"
artillery_a_desc:0 "Улучшенные механизмы загрузки и выброса снарядов позволяют вести непрерывный огонь для лёгких и средних орудий. Даже тяжёлые орудия могут выпускать несколько снарядов в минуту."

artillery_c:0 "Оптимизация координации огня"
artillery_c_desc:0 "Новая терминология и улучшенная радиосвязь между наблюдателем и расчётом уменьшают время между обнаружением цели и открытием огня."

artillery_d:0 "Прицеливание по сетке"
artillery_d_desc:0 "Использование сетки для определения азимута цели снижает ошибки вычислений и позволяет точнее наводить батарею."

artillery_f:0 "Призматические параллелоскопы"
artillery_f_desc:0 "Призменный параллелоскоп улучшает косвенное наведение артиллерии и полезен для ночных обстрелов без использования световых целей."

### Реактивная артиллерия
rocket_artillery_a:0 "Дополнительные направляющие"
rocket_artillery_a_desc:0 "Добавление направляющих и стоек увеличивает общий объём боеприпасов, выпущенных одной установкой."

rocket_artillery_b:0 "Механизмы управления ракетами"
rocket_artillery_b_desc:0 "Самостабилизирующиеся плавники снижают вероятность отклонения ракет и увеличивают точность поражения цели."

rocket_artillery_d:0 "Специализированные ракеты"
rocket_artillery_d_desc:0 "Малые и многочисленные ракеты расширяют площадь поражения, а крупные боеприпасы позволяют точечно поражать цели."

rocket_artillery_e:0 "Высокооктановое топливо"
rocket_artillery_e_desc:0 "Новое высокооктановое топливо улучшает летные характеристики ракет."

### ПВО
antiair_a:0 "Балистические вычислители"
antiair_a_desc:0 "Компьютерные баллистические калькуляторы ускоряют расчёт траектории для поражения быстрых самолётов."

antiair_b:0 "Радар наведения орудий"
antiair_b_desc:0 "Мини-радары для каждой установки повышают точность обнаружения и слежения за самолётами."

antiair_d:0 "Автозагрузчики"
antiair_d_desc:0 "Механические автозагрузчики позволяют поддерживать высокую скорострельность тяжёлых снарядов."

antiair_e:0 "Аналоговые директора"
antiair_e_desc:0 "Электронные помощники для быстрого расчёта прицеливания повышают эффективность тяжёлых зенитных орудий."

### Противотанковая артиллерия
antitank_a:0 "Боеприпасы с пластичной взрывчаткой"
antitank_a_desc:0 "HESH и HEP снаряды обладают высокой разрушительной способностью благодаря улучшенным свойствам разлетающегося металла."

antitank_b:0 "Снаряды с стабилизаторами"
antitank_b_desc:0 "Стабилизаторы плавников уменьшают потерю скорости и увеличивают бронепробиваемость."

antitank_d:0 "Система высокого-низкого давления"
antitank_d_desc:0 "Использование перепада давления снижает вес снарядов при сохранении баллистики."

antitank_e:0 "Интеграция ночного видения"
antitank_e_desc:0 "Ночное видение повышает эффективность ПТ-орудий в условиях низкой освещённости."

### Пехота
infantry_at_a:0 "Пехотное ПТ III"
infantry_at_a_desc:0 "Противотанковые ракеты делают пехоту серьёзной угрозой для бронетехники врага."

infantry_at_b:0 "Пехотное ПТ IV"
infantry_at_b_desc:0 "Усовершенствованные переносные РПГ обеспечивают максимальный калибр снарядов против техники врага."

advanced_infantry_weapons_a:0 "Улучшенное снаряжение пехоты IV"
advanced_infantry_weapons_a_desc:0 "Стандартизация комплектов оружия повышает эффективность стрелкового оружия."

advanced_infantry_weapons_c:0 "Улучшенное снаряжение пехоты V"
advanced_infantry_weapons_c_desc:0 "Лёгкое оружие и современное снаряжение позволяют носить больше боеприпасов и снабжения."

advanced_infantry_weapons_d:0 "Улучшенное снаряжение пехоты VI"
advanced_infantry_weapons_d_desc:0 "Модульные конструкции оружия облегчают обслуживание и увеличивают боеспособность солдата."

### Десант
paratroopers_a:0 "Десантники IV"
paratroopers_a_desc:0 "Модификации транспортных самолётов ускоряют высадку войск."

paratroopers_b:0 "Десантники V"
paratroopers_b_desc:0 "Лёгкое оружие повышает мобильность десанта и позволяет нести больше снаряжения."

paratroopers_c:0 "Десантники VI"
paratroopers_c_desc:0 "Дополнительная подготовка для ночных операций снижает риски миссий."

### Морская пехота
marines_a:0 "Морская пехота IV"
marines_a_desc:0 "Обучение скрытным и ближним боям сохраняет опыт прошлых конфликтов."

marines_b:0 "Морская пехота V"
marines_b_desc:0 "Ночное видение позволяет эффективно действовать в тёмное время суток."

marines_c:0 "Морская пехота VI"
marines_c_desc:0 "Амфибийные операции требуют преодоления множества трудностей, обучение повышает решимость и эффективность морпехов."

### Горная пехота
mountaineers_a:0 "Горная пехота IV"
mountaineers_a_desc:0 "Мы воспитываем в горных солдатах стойкую боевую волю, чтобы даже горы не могли их сломить."
### Горная пехота
mountaineers_b:0 "Горная пехота V"
mountaineers_b_desc:0 "Хотя наши войска обучены выживать и действовать в суровых условиях, их оружие также должно работать при минусовых температурах. Создание специальных вариантов оружия для горной пехоты может быть полезным."

mountaineers_c:0 "Горная пехота VI"
mountaineers_c_desc:0 "Вертолёты, способные работать на больших высотах, и транспортные средства, способные преодолевать опасную горную местность, обеспечивают мобильность и современность наших горных подразделений."

### Вспомогательное оружие
support_weapons_a:0 "Вспомогательное оружие V"
support_weapons_a_desc:0 "Несмотря на некоторые недостатки и этические вопросы, пехотные огнемёты могут быть очень эффективны при правильном применении в соответствующих условиях."

support_weapons_b:0 "Вспомогательное оружие VI"
support_weapons_b_desc:0 "Специализированные гранаты, включая зажигательные, дымовые и слезоточивые, обычно используются только спецподразделениями. Оснащение ими обычной пехоты может дать тактическое преимущество."

support_weapons_c:0 "Вспомогательное оружие VII"
support_weapons_c_desc:0 "Штурмовые винтовки изменили динамику пехотного взвода. Даже если не каждый солдат вооружён ими, выделение одного «специалиста» изменяет тактику всей группы. Специализированные штурмовые и оборонительные взводы повышают боеспособность."

support_weapons_d:0 "Вспомогательное оружие VIII"
support_weapons_d_desc:0 "Пора обновить лёгкие и тяжёлые пулемёты, применив новые технологии для создания более эффективного тяжёлого оружия."

support_weapons_e:0 "Вспомогательное оружие IX"
support_weapons_e_desc:0 "Внутренние улучшения оружия увеличат его срок службы, снижая износ и позволяя дольше вести огонь без замены ствола."

support_weapons_f:0 "Вспомогательное оружие X"
support_weapons_f_desc:0 "Испытания новых противопехотных мин показали их более высокую эффективность, меньшую заметность и увеличенный радиус взрыва по сравнению с текущими моделями."

### Ночное видение
night_vision_a:0 "Ночное видение III"
night_vision_a_desc:0 "Способность видеть врага, когда он нас не видит, крайне важна. Эта новая технология помогает достигнуть этой цели."

### Электроника
future_radar:0 "Таумаптический РЛС"
future_radar_desc:0 "Применение кристаллов в передающих РЛС-массивах значительно улучшает чёткость и фокус сигнала. При правильной калибровке магическая матрица позволяет сигналу проходить через неблагоприятные погодные условия с минимальной потерей и автоматически корректировать отражённый сигнал."

future_radar_2:0 "Бистатическая таумаптическая РЛС"
future_radar_2_desc:0 "Бистатическая РЛС, хотя и сложнее из-за удалённых массивов для передачи и приёма сигналов, показывает большой потенциал. Она может обнаруживать объекты с низкой отражающей способностью, особенно при использовании специализированных кристаллов."

future_radar_3:0 "Радарное изображение и картография"
future_radar_3_desc:0 "Использование интерферометрии позволяет создавать двумерные изображения с помощью РЛС с синтезированной апертурой (SAR), обычно устанавливаемой на самолётах для точного картографирования."

future_radar_4:0 "Воздушное раннее предупреждение"
future_radar_4_desc:0 "Создание специализированных самолётов раннего предупреждения позволяет обнаруживать вражеские корабли и самолёты даже без массивов РЛС, улучшая контроль воздушного пространства."

future_computing_machine:0 "Компьютеры размером с комнату"
future_computing_machine_desc:0 "Для увеличения вычислительной мощности приходится добавлять больше компонентов: таблиц функций, панелей, ламп, счётчиков. Это делает компьютеры громоздкими, но скорость и функциональность перевешивают затраты."

future_computing_machine_2:0 "Ранняя оперативная память"
future_computing_machine_2_desc:0 "Эксперимент с электронно-лучевыми трубками создал быстрый RAM, который значительно ускоряет обработку данных по сравнению с последовательным доступом."

future_computing_machine_3:0 "Магические электронные лампы"
future_computing_machine_3_desc:0 "Использование таумаптических материалов позволяет создать вакуумные лампы с холодной термоэмиссией, устойчивые к высоким токам, увеличивая скорость работы компьютеров."

future_computing_machine_4:0 "Ранние транзисторные компьютеры"
future_computing_machine_4_desc:0 "Биполярные транзисторы открывают новую эпоху электронных компьютеров, полностью на интегральных платах, уменьшая размеры без потери вычислительной мощности."

future_encryption:0 "Магически маркированные шифры"
future_encryption_desc:0 "В сообщениях можно использовать магические кристаллы как уникальные маркировки для защиты информации и запутывания чужой разведки."

future_encryption_2:0 "Нестабильные алгоритмы сортировки"
future_encryption_2_desc:0 "Компьютеры могут случайным образом сортировать списки цифр, усиливая шифрование сообщений, делая их нечитаемыми для посторонних."

future_encryption_3:0 "Постоянное магическое перемешивание"
future_encryption_3_desc:0 "Заклинание автоматически перемешивает сообщения до получения их приёмником с нужным кристаллом, упрощая массовое применение в шифровальных машинах."

future_decryption:0 "Таумаптическое отслеживание и отпечаток"
future_decryption_desc:0 "Магические матрицы позволяют отслеживать радиосигналы и физические сообщения, собирая информацию о местоположении отправителей и получателей."

future_decryption_2:0 "Вычислители грубой силы"
future_decryption_2_desc:0 "Новые мощные компьютеры позволяют взламывать ранее почти неприступные шифры, используя расчёт всех вариантов и выявляя вероятные сообщения."
### Шифрование и дешифрование
future_decryption_3:0 "Ограниченные методы прорицания"
future_decryption_3_desc:0 "После совершенствования таумаптического отпечатка кодированных сигналов мы разработали сложное заклинание прорицания, которое позволяет временно следить за непосредственной зоной машины шифрования, получающей сигнал. Несмотря на вероятность отказа и короткое окно действия для снижения риска обнаружения, успешное прорицание раскрывает рабочее место кодировщика и кладезь информации."

future_encryption_lar:0 "Магически маркированные шифры"
future_encryption_lar_desc:0 "Мы могли бы больше продвинуть немагическое шифрование, но сразу можем применить слой защиты через маркировку. Подобно уникальным идентификационным меткам каждого оружия, в сообщения можно внести транскрибированную матрицу заранее определённого магического кристалла. Для запутывания разведки можно использовать несколько матриц для разграничения критических сообщений и фейковых в контрразведке."

future_encryption_2_lar:0 "Нестабильные алгоритмы сортировки"
future_encryption_2_lar_desc:0 "Специально настроенные компьютеры могут случайным образом сортировать списки цифр. Адаптация шифровальных машин для бинарной сортировки сообщений усиливает шифрование, делая сообщения нечитаемыми для посторонних."

future_encryption_3_lar:0 "Постоянное таумаптическое перемешивание"
future_encryption_3_lar_desc:0 "Разработано самонастраивающееся заклинание, которое автоматически перемешивает сообщения. Магия постоянно перемешивает сигнал до его получения приёмником с подходящим кристаллом. Ранее это было дорого и трудоёмко, но теперь возможно массовое применение в большинстве шифровальных машин."

future_decryption_lar:0 "Таумаптическое отслеживание и отпечаток"
future_decryption_lar_desc:0 "Таумаптическое отслеживание использовалось для определения местоположения отправителей и получателей физических сообщений. Специальные матрицы, настроенные на радиоволны, позволяют отслеживать сообщения и магически накладывать дополнительные заклинания для сбора информации сверх содержания сообщения."

future_decryption_2_lar:0 "Вычислители грубой силы"
future_decryption_2_lar_desc:0 "Новые мощные компьютеры позволяют вскрывать ранее почти неприступные шифры методом перебора. Вычислители, зачарованные для выделения вероятных сообщений среди миллионов бесполезных результатов, экономят время и усилия, хотя окончательная проверка всё ещё требуется."

future_decryption_3_lar:0 "Ограниченные методы прорицания"
future_decryption_3_lar_desc:0 "После совершенствования таумаптического отпечатка кодированных сигналов мы разработали сложное заклинание прорицания, которое позволяет временно следить за зоной машины шифрования. Успешное прорицание раскрывает рабочее место кодировщика и кладезь информации."

### Промышленность
streamlined_line_a:0 "Оптимизированные конвейеры"
streamlined_line_a_desc:0 "Большинство трудоёмких и однообразных задач передаётся машинам. Работники теперь в основном следят за исправной работой автоматических устройств, что повышает производительность, хотя снижает гибкость при смене продукции."

flexible_line_a:0 "Дополнительное обучение рабочих"
flexible_line_a_desc:0 "Обучение рабочих расширяет их навыки за пределы основных рабочих мест, позволяя адаптироваться к неожиданным изменениям в производстве. Они не становятся экспертами, но значительно более универсальны."

streamlined_line_b:0 "Непрерывное производство"
streamlined_line_b_desc:0 "С учётом растущих требований, конвейеры должны быть готовы производить продукцию для нужд армии и гражданских. Непрерывное производство обеспечивает выполнение этих задач."

streamlined_line_c:0 "Бережливое производство"
streamlined_line_c_desc:0 "Точный прогноз потребностей уменьшает потери материалов и издержки на хранение. Работники могут испытывать стресс, но экономия средств оправдывает это."

streamlined_line_d:0 "Промышленные роботы"
streamlined_line_d_desc:0 "Программируемые машины стали более эффективными благодаря транзисторным компьютерам. Их функции пока ограничены, но роль в тяжёлой промышленности будет расти."

concentrated_industry_a:0 "Промышленные города"
concentrated_industry_a_desc:0 "Централизация производств требует нового подхода к планировке комплексов. С учётом логистики и жилых блоков, такие комплексы напоминают целые города."

concentrated_industry_b:0 "Интеграция промышленности"
concentrated_industry_b_desc:0 "Объединение автомобильной, авиационной, военно-морской и оружейной промышленности в едином мегазаводе позволяет расширять и упрощать производство."

concentrated_industry_c:0 "Вертикальная интеграция"
concentrated_industry_c_desc:0 "Использование высотных зданий для производства уменьшает занимаемую площадь и повышает эффективность фабрик."

concentrated_industry_d:0 "Интеграция воздушного транспорта"
concentrated_industry_d_desc:0 "Транспорт самолётами и вертолётами дополняет существующую логистику, увеличивая эффективность перемещения материалов и персонала."

dispersed_industry_a:0 "Изолированные рабочие города"
dispersed_industry_a_desc:0 "Изоляция работников предотвращает утечки информации и контакты с вражескими агентами."

dispersed_industry_b:0 "Укреплённые объекты"
dispersed_industry_b_desc:0 "Подземная бетонная защита увеличивает безопасность критически важных объектов и позволяет расширять их без угрозы секретности."

dispersed_industry_c:0 "Самодостаточные объекты"
dispersed_industry_c_desc:0 "Объекты могут обеспечивать себя материалами и продовольствием, снижая уязвимость транспортной сети."

dispersed_industry_d:0 "Разброс по всей стране"
dispersed_industry_d_desc:0 "Каждый участок земли может использоваться для производства. Даже задние дворы домов могут стать мини-заводами, что создаёт многократное резервирование."

construction_a:0 "Реорганизованные рабочие команды"
construction_a_desc:0 "Лучшее распределение задач и группировка рабочих повышает эффективность при использовании специализированного оборудования."

construction_b:0 "Метод конечных элементов"
construction_b_desc:0 "Метод конечных элементов позволяет безопасно проектировать большие стальные конструкции с сложной геометрией."

construction_c:0 "Сборные здания"
construction_c_desc:0 "Быстрое и дешевое строительство временного жилья или складов, альтернативное капитальным зданиям."

construction_d:0 "Современное высотное строительство"
construction_d_desc:0 "Использование 'трубной' системы и модульной архитектуры позволяет возводить новые мегаструктуры, устойчивые к боковым нагрузкам."

excavation_a:0 "Выемка и заполнение"
excavation_a_desc:0 "Глубокие рудные тела заполняются смесью цемента и породы, что позволяет полностью извлекать экономические ресурсы и поддерживать соседние выработки."

excavation_b:0 "Геохимическая разведка"
excavation_b_desc:0 "Анализ химических свойств образцов почвы, воды, минералов и даже растений для поиска аномалий и новых залежей."

excavation_c:0 "Длинные выработки"
excavation_c_desc:0 "Метод добычи через заранее просверленные отверстия, полностью управляемый дистанционно или с помощью зачарованных машин."

excavation_d:0 "Специализированные погрузочно-доставочные машины (LHD)"
excavation_d_desc:0 "Мощные LHD-погрузчики для сложных горных работ с высокой продуктивностью, безопасностью и манёвренностью."


### Десантные суда
semi_modern_landing_craft:0 "Доки-десантные корабли"
semi_modern_landing_craft_desc:0 "После захвата плацдарма наши войска должны получать снабжение для поддержания амфибийных операций. Ранее использовались малые суда или медленные баржи. Новые специализированные доки-десантные корабли с интегрированными носовыми дверями решают эту проблему, позволяя спускать малые десантные суда и технику и доставлять припасы прямо на берег."

modern_landing_craft:0 "Ранние вертолётоносцы-десантные корабли"
modern_landing_craft_desc:0 "Эксперименты с вертолётами открыли новые возможности для амфибийных операций. Специализированные вертолётоносцы позволяют интегрировать воздушные десанты с береговым высадочным усилием, создавая новые фронты для действий специально обученных командос."

mtg_semi_modern_landing_craft:0 "Доки-десантные корабли"
mtg_semi_modern_landing_craft_desc:0 "После захвата плацдарма наши войска должны получать снабжение для поддержания амфибийных операций. Новые специализированные доки-десантные корабли с интегрированными носовыми дверями позволяют спускать малые десантные суда и технику и доставлять припасы прямо на берег."

mtg_modern_landing_craft:0 "Ранние вертолётоносцы-десантные корабли"
mtg_modern_landing_craft_desc:0 "Специализированные вертолётоносцы позволяют интегрировать воздушные десанты с высадкой на побережье, открывая новые возможности для операций специально обученных командос."

### Ядерное оружие
nuke_naval:0 "Ядерная мощь флота"
nuke_naval_desc:0 "Мы предполагаем, что наши крупнейшие и мощнейшие корабли могут быть оснащены ядерными реакторами. Со временем мы надеемся сделать это реальностью."

nukes_2:0 "Термоядерные эксперименты"
nukes_2_desc:0 "Разработаны бомбы, использующие деление для вызова более мощной термоядерной реакции, что значительно увеличивает выход энергии."

nukes_3:0 "Миниатюрные ядерные боеприпасы"
nukes_3_desc:0 "Дальнейшие разработки позволяют создавать крайне компактные линейные имплозионные устройства, помещающиеся в чемодан. Глубокое понимание производства эффективных делящихся материалов также улучшает эффективность обычных ядерных боеприпасов."

### Ракеты
semi_modern_rocket_engines:0 "Ранние МБР и кристальные ракетные двигатели"
semi_modern_rocket_engines_desc:0 "Прорывы в многофазных ракетных конструкциях и кристальных двигателях привели к созданию баллистической ракеты с беспрецедентной дальностью. Запущенная в стратосферу, она практически неуязвима для перехвата."

guided_missile_equipment_4:0 "Ранние межконтинентальные баллистические ракеты"
guided_missile_equipment_4_desc:0 "Прорывы в кристальных ракетных двигателях и многофазных конструкциях позволили создавать баллистические ракеты с впечатляющей дальностью и малой вероятностью перехвата."

modern_rocket_engines:0 "Настоящие межконтинентальные баллистические ракеты"
modern_rocket_engines_short:0 "Настоящие МБР"
modern_rocket_engines_desc:0 "Дальнейшие исследования МБР и технологий наведения привели к появлению новых массивных и мощных ракет, способных поражать любые цели за считанные минуты, нанося разрушения даже обычными боеголовками. Некоторые конструкции достигают границ атмосферы, что открывает возможность выхода в космос."

guided_missile_equipment_5:0 "Настоящие межконтинентальные баллистические ракеты"
guided_missile_equipment_5_short:0 "Настоящие МБР"
guided_missile_equipment_5_desc:0 "Усовершенствованные кристальные двигатели сделали новые МБР и перехватчики ещё более впечатляющими. Огромные, дорогие, но способные поражать любые цели в минуты, эти ракеты символизируют эпоху титанических ракетных вооружений."

### Вспомогательные подразделения
tech_engineers_a:0 "Инженерная рота V"
tech_engineers_a_desc:0 "Внедрение бронированных инженерных машин значительно расширяет возможности инженерных подразделений на поле боя."

tech_engineers_b:0 "Инженерная рота VI"
tech_engineers_b_desc:0 "Помимо обеспечения снабжения, инженеры могут выполнять контрмобильные операции: разрушение мостов, блокировка дорог и создание аэродромов для дружественной авиации."

tech_engineers_c:0 "Инженерная рота VII"
tech_engineers_c_desc:0 "Боевые инженеры будущего подготовят войска к любым атакам и обеспечат их готовность в любой ситуации."

tech_recon_a:0 "Разведрота V"
tech_recon_a_desc:0 "Лёгкие и мобильные разведывательные машины позволят командам быстрее перемещаться и безопаснее покидать опасные зоны."

tech_recon_b:0 "Разведрота VI"
tech_recon_b_desc:0 "Ночное видение позволит проводить операции под прикрытием темноты, снижая вероятность обнаружения."

tech_recon_c:0 "Разведрота VII"
tech_recon_c_desc:0 "Дальнейшая электронная интеграция улучшит точность и полноту разведданных, облегчая их передачу командованию."

tech_military_police_a:0 "Военная полиция V"
tech_military_police_a_desc:0 "Эффективное уничтожение ячеек сопротивления требует современного вооружения и оборудования для военной полиции."

tech_military_police_b:0 "Военная полиция VI"
tech_military_police_b_desc:0 "Оснащение отрядов ОМОНовской техникой, включая слезоточивый газ, позволяет мирно разгонять протесты и контролировать сопротивление."

tech_military_police_c:0 "Военная полиция VII"
tech_military_police_c_desc:0 "Новые программы подготовки обеспечат психологическую готовность военной полиции к активному и пассивному патрулированию, повышая безопасность в оккупированных зонах и предотвращая действия провокаторов."

tech_maintenance_company_a:0 "Ремонтная рота V"
tech_maintenance_company_a_desc:0 "Обеспечив ремонтные роты легко доступными запасными частями, мы сможем как можно быстрее вернуть технику в строй прямо в полевых условиях."

tech_maintenance_company_b:0 "Ремонтная рота VI"
tech_maintenance_company_b_desc:0 "Проектирование военной техники с учётом удобства ремонта облегчит работу ремонтных рот, сокращая время на сложные ремонтные операции."

tech_maintenance_company_c:0 "Ремонтная рота VII"
tech_maintenance_company_c_desc:0 "Лучшее планирование работы и ротация технического персонала обеспечит свежую и способную команду для обслуживания любой техники в любое время суток."

tech_field_hospital_a:0 "Полевой госпиталь V"
tech_field_hospital_a_desc:0 "Чистота критически важна для предотвращения инфекций и осложнений после боевых ранений. Поддержание стерильности в полевых госпиталях повышает шансы на выживание."

tech_field_hospital_b:0 "Полевой госпиталь VI"
tech_field_hospital_b_desc:0 "Боевая медицина – стрессовое направление. Новая подготовка выносливости для ума и тела позволит хирургам и медикам справляться с любыми ситуациями и выполнять свои обязанности наилучшим образом."

tech_field_hospital_c:0 "Полевой госпиталь VII"
tech_field_hospital_c_desc:0 "Медицинские команды, обученные работе на эвакуационных вертолётах, смогут оказывать помощь даже при самых критических и серьёзных медицинских ситуациях на поле боя."

tech_logistics_company_a:0 "Логистическая рота V"
tech_logistics_company_a_desc:0 "Сотрудничество логистических рот с военными инженерами позволяет планировать и строить дороги и мосты, обеспечивая доставку припасов прямо на передовую."

tech_logistics_company_b:0 "Логистическая рота VI"
tech_logistics_company_b_desc:0 "Дальнейшее совершенствование цепочек снабжения, включая оптимизацию складов и снижение расхода топлива на транспорт, обеспечит бесперебойную работу логистических колонн."

tech_logistics_company_c:0 "Логистическая рота VII"
tech_logistics_company_c_desc:0 "Использование транспортных самолётов и вертолётов для доставки грузов поможет снабжать изолированные подразделения и базы, снижая риски при транспортировке оборудования, пусть и с увеличением затрат."

tech_signal_company_a:0 "Связная рота V"
tech_signal_company_a_desc:0 "Обеспечение возможности шифрования передач позволит быстрее обмениваться информацией без необходимости использования ретрансляторов и ускорит поток приказов от командования."

tech_signal_company_b:0 "Связная рота VI"
tech_signal_company_b_desc:0 "Введение надёжных переносных радиостанций для отдельных подразделений в сочетании с продуманной организационной структурой компании обеспечит быструю и надёжную связь между штабами дивизий и секциями."

tech_signal_company_c:0 "Связная рота VII"
tech_signal_company_c_desc:0 "Новые протоколы и каналы связи улучшат координацию между различными видами войск, оптимизируя запросы на помощь от отдельных НСО и повышая эффективность совместных операций."
