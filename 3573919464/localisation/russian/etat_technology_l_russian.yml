advanced_welding:0 "Современная сварка"
advanced_welding_desc:0 "Сварка — сложный технологический процесс соединения металлов. Использование лучших сплавов делает танки и бронетехнику прочнее."
modern_welding:0 "Модернизированная сварка"
modern_welding_desc:0 "Прочность современных танков зависит от качества металлических конструкций. Улучшение металлов и технологий обработки позволяет создавать более надёжные корпуса."
