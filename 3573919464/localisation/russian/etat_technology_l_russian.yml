ETAX_TITLE_DOCTRINE_X:0 "Отдел Специальных Исследований"

###------> Новая Доктрина   <><> <><> <><> <><> <><>

etax_doctrine:0 "Отдел Специальных Исследований"
etax_doctrine_desc:0 "Мы должны создать подразделение, которое будет концентрировать наши исследовательские усилия и позволять нам сосредоточить военные и промышленные ресурсы на пользу нации."

etax_army_focus:0 "Приоритет армии"
etax_army_focus_desc:0 "Возможности сухопутных войск имеют первостепенное значение и будут приоритетными перед другими видами войск."
etax_navy_focus:0 "Приоритет флота"
etax_navy_focus_desc:0 "Без сильного флота нация обречена. Поэтому мы должны приложить все усилия для расширения и укрепления этого вида войск."
etax_air_focus:0 "Приоритет авиации"
etax_air_focus_desc:0 "Воздушное пространство — будущее, и поэтому мы должны сделать все, чтобы наша авиация была сильнейшей в мире."

etax_army_firepower:0 "Огневая мощь стрелкового оружия"
etax_army_firepower_desc:0 "Акцент на огневой мощи приведет нас к победе. Этот подход дал мощное стрелковое оружие и улучшил его эффективность."
etax_army_firepower_2:0 "Тяжёлая огневая мощь"
etax_army_firepower_2_desc:0 "Наши специальные исследования позволили значительно увеличить поражающую способность тяжёлых орудий."
etax_army_defense:0 "Бронированная армия"
etax_army_defense_desc:0 "Наша армия может выдерживать удары, которые бы сломали кого угодно. Благодаря этому мы легко выдержим любой конфликт."
etax_army_defense_2:0 "Обширные укрепления"
etax_army_defense_2_desc:0 "Противник может использовать все свои ресурсы, но глубина наших оборонительных сооружений изнурит его."

etax_navy_firepower:0 "Прицельная мощь"
etax_navy_firepower_desc:0 "Наши корабли могут поражать почти любую цель на дистанции. Эффект на противника и его мораль будет разрушительным."
etax_navy_firepower_2:0 "Ударная мощь"
etax_navy_firepower_2_desc:0 "Наш флот умеет сосредотачивать огонь и наносить удары, разрушая даже самую уверенную оборону противника."
etax_navy_defense:0 "Толстые корпуса"
etax_navy_defense_desc:0 "С ростом эффективности вражеского оружия и авиаударов мы должны адаптировать наш флот для противодействия этим угрозам."
etax_navy_defense_2:0 "Региональная оборона"
etax_navy_defense_2_desc:0 "Постоянное знание местоположения противника само по себе является самым ценным оружием."

etax_air_firepower:0 "Воздушное превосходство"
etax_air_firepower_desc:0 "Мало кто может соперничать с нашими летательными аппаратами в небе, а скорость перехвата противника у нас непревзойдённая."
etax_air_firepower_2:0 "Бомбардировочная атака"
etax_air_firepower_2_desc:0 "Наши бомбардировщики способны разрушить всё в зоне поражения, оставляя после себя лишь руины."
etax_air_defense:0 "Многоуровневая защита"
etax_air_defense_desc:0 "Каждый участок земли и каждый летательный аппарат защищены тщательно скоординированной обороной."
etax_air_defense_2:0 "Манёвренные самолёты"
etax_air_defense_2_desc:0 "Иногда скорость важнее брони, и в воздушном бою она становится смертоносной."

etax_the_means:0 "Средства"
etax_the_means_desc:0 "Продвигаясь вперёд, мы не должны забывать о наших принципах. Если солдаты гордятся нашей целью, они выдержат любые трудности."
etax_the_ends:0 "Цели"
etax_the_ends_desc:0 "Наше преимущество в том, что мы можем делать то, на что другие не осмеливаются. Расширяя свои границы, мы делаем инструменты наших возможностей безграничными."

etax_business_interests:0 "Деловые интересы"
etax_business_interests_desc:0 "Развивая частный сектор, мы можем увеличить число фабрик, способных производить товары."
etax_cost_plus:0 "Цена с прибылью"
etax_cost_plus_desc:0 "Пока деньги текут, наш бизнес будет продолжать поставки."
etax_production_in_depth:0 "Цепочка поставок"
etax_production_in_depth_desc:0 "Мы можем использовать множество источников для производства товаров и техники, делая прерывание поставок врагом практически невозможным."

etax_unity:0 "Общее дело"
etax_unity_desc:0 "Все сражаются за одну справедливую цель, и это поддерживает наши силы дольше и усерднее, чем можно ожидать."
etax_broad_support:0 "Всеобъемлющее участие"
etax_broad_support_desc:0 "Мы привлекаем людей со всех слоёв общества, никто не остаётся в стороне. Если у тебя есть пульс — ты можешь сражаться."
etax_inclusive_science:0 "Научное сообщество"
etax_inclusive_science_desc:0 "Наши учёные имеют разнообразный опыт, и идеология или предвзятость не мешают нам двигаться вперёд."

etax_desperation:0 "Жертва"
etax_desperation_desc:0 "С некоторыми усилиями мы можем убедить население обходиться меньшим, при этом сражаясь не менее усердно."
etax_no_qa:0 "Ускоренное производство"
etax_no_qa_desc:0 "Немедленные нужды фронта требуют, чтобы мы где-то экономили. Хотя качество может быть ниже, в итоге объём усилий перекроет все недостатки."
etax_expendable_labor:0 "Жертвенный труд"
etax_expendable_labor_desc:0 "Кирпичи в наших стенах оплачены кровью, а цемент выложен костями. Пусть никто не скажет, что мы не заплатили цену за победу."

etax_glory:0 "Слава"
etax_glory_desc:0 "Нет ничего более благородного и истинного, чем искусство сражения. Человек действительно испытывается, лишь бросившись в бой и позволив войне закалить сердце."
etax_purity:0 "Избирательный отбор"
etax_purity_desc:0 "Мы отобрали из войск тех, кто не годен к службе, оставив только самых сильных и преданных."
etax_great_leap:0 "Супернаука"
etax_great_leap_desc:0 "Пока другие довольствуются мелкими шагами, мы не боимся рисковать и ставить на технологии, которые будут формировать мир в будущем."

etax_grand_projects:0 "Специализированная инженерия"
etax_grand_projects_desc:0 "Враг не победится чуть лучшим цементом. Нужно огневая мощь и смерть с небес."
etax_practical_projects:0 "Практическая инженерия"
etax_practical_projects_desc:0 "Наши войска сосредоточены на основах и нашли способы улучшить базовые процессы производства по всей цепочке поставок."

etax_moonshot:0 "Авиация будущего"
etax_moonshot_desc:0 "Наше внимание к господству в воздухе принесло по-настоящему выдающиеся результаты. С этим наше превосходство в небе бесспорно."
etax_super_soldiers:0 "Суперсолдаты"
etax_super_soldiers_desc:0 "Мы разработали препарат, который позволяет солдатам двигаться дальше, быстрее и дольше, чем позволяет их обычная выносливость."
etax_the_bomb:0 "Проект"
etax_the_bomb_desc:0 "Учёные вложили все усилия в страшную, но блестящую идею. В итоге мы не получили того, чего ожидали, но значительно продвинулись во всех областях исследований."

etax_seashot:0 "Флот будущего"
etax_seashot_desc:0 "Наши корабли внушают страх и могут легко пробить любой флот, кроме самых стойких противников."
etax_quality:0 "Качественное производство"
etax_quality_desc:0 "Мы сделали всё возможное, чтобы обеспечить правильное оснащение и строгие проверки, необходимые для долговечного оборудования."
etax_great_works:0 "Великие дела"
etax_great_works_desc:0 "Средства вложены в развитие национальных возможностей до предела и даже дальше. Всё в экономике и производстве создано, чтобы внушать восхищение."

###------> Егеря   <><> <><> <><> <><> <><>
jager:0 "Егери"
jager_desc:0 "Егери — это лёгкая пехота, обученная вести ближний бой за линиями противника."
jungletroop:0 "Специалисты джунглей"
jungletroop_desc:0 "Специалисты джунглей обучены выживать в суровых условиях джунглевой войны и вести бой на условиях противника."

elite_forces_02:0 "Элитные войска II"
elite_forces_02_desc:0 "В спецподразделения попадут только лучшие. Прошедшие подготовку станут сильнее, быстрее и будут сражаться усерднее всех."
elite_forces_03:0 "Элитные войска III"
elite_forces_03_desc:0 "В спецподразделения попадут только лучшие. Прошедшие подготовку станут сильнее, быстрее и будут сражаться усерднее всех."

