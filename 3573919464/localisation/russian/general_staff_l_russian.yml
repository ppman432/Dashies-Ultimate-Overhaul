l_russian:

general_staff:0 "Генеральный штаб"

gf_command_structure:0 "Структура командования"
gf_logistics_system:0 "Логистическая система"
gf_officer_training:0 "Подготовка офицеров"
gf_special_forces_role:0 "Роль спецназа"
gf_marine_role:0 "Роль морской пехоты"
gf_paratrooper_role:0 "Роль десантников"

centralized_hierarchy:0 "Централизованная иерархия"
centralized_hierarchy_desc:0 "Армия будет организована по типичной, нисходящей структуре, где слово высокопоставленного офицера имеет приоритет."
decentralized_democracy:0 "Децентрализованная демократия"
decentralized_democracy_desc:0 "Армия будет организована нетипичным образом, где солдаты и военнослужащие избирают лидеров на всех уровнях иерархии, что приводит к более демократичной организации, напоминающей государственное управление, где важен каждый человек."

push_system:0 "Система «Толчка»"
push_system_desc:0 "Система «Толчка» производит, направляет и распределяет военные материалы на основе прогнозируемого спроса. Этот метод снижает риск нехватки, но вызывает административные перегрузки и ведёт к перерасходу ресурсов."
pull_system:0 "Система «Вытягивания»"
pull_system_desc:0 "Система «Вытягивания» производит, направляет и распределяет военные материалы на основе фактического спроса, а не ожиданий. Этот метод минимизирует неэффективность и избыточное производство, но требует эффективной коммуникации и организации."

advanced_officer_training:0 "Продвинутая подготовка"
advanced_officer_training_desc:0 "Офицеры проходят углублённую, передовую подготовку."
major_officer_training:0 "Основная подготовка"
major_officer_training_desc:0 "Офицеры проходят качественную подготовку."
junior_officer_training:0 "Базовая подготовка"
junior_officer_training_desc:0 "Офицеры проходят минимальную подготовку."
foreign_officer_missions:0 "Зарубежные миссии"
foreign_officer_missions_desc:0 "Офицеры направляются в качестве атташе на зарубежные миссии."

army_support:0 "Поддержка армии"
army_support_desc:0 "Спецназ оказывает поддержку основной армии и обычно интегрирован с ней."
special_operations:0 "Спецоперации"
special_operations_desc:0 "Спецназ выполняет тщательно рассчитанные, высокоценные миссии, полезные для всего фронта, но при этом действует обособленно от высшего командования."
foreign_conflicts:0 "Иностранные конфликты"
foreign_conflicts_desc:0 "Спецназ действует как интервенционные силы в зарубежных конфликтах, поддерживая союзников за границей."

marine_army_command:0 "Командование армии"
marine_army_command_desc:0 "Основная функция морской пехоты — поддержка армии и создание уязвимостей через высадку передовых отрядов."
marine_navy_command:0 "Командование флота"
marine_navy_command_desc:0 "Морская пехота подчиняется командованию флота и находится в его юрисдикции."
marine_spec_ops_command:0 "Командование спецопераций"
marine_spec_ops_command_desc:0 "Морская пехота действует независимо, выполняя ценные специальные миссии."

para_army_command:0 "Командование армии"
para_army_command_desc:0 "Десантники поддерживают армию, создавая возможности и отвлекая противника от основных сил."
para_air_command:0 "Командование ВВС"
para_air_command_desc:0 "Десантники подчиняются командованию ВВС и находятся в его юрисдикции."
para_spec_ops_command:0 "Командование спецопераций"
para_spec_ops_command_desc:0 "Десантники направляются на специальные миссии и действуют подобно силам спецназа."
