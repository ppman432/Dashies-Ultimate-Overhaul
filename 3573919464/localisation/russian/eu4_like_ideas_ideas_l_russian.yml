## Generic
national_ideas_1000_0: "Общие традиции"
national_ideas_1000_0_desc: ""

national_ideas_1000_1: "Промышленное строительство"
national_ideas_1000_1_desc: "Как показала Великая война, любые будущие конфликты будут индустриализированными. Чтобы подготовиться к грядущим войнам или к будущему в целом, необходима сильная, современная промышленная база."

national_ideas_1000_2: "Улучшенные промзоны"
national_ideas_1000_2_desc: "Фабрики — чудо современной инженерии и технологии, но без надлежащей инфраструктуры и организации даже самые впечатляющие фабрики станут памятниками человеческой недальновидности."

national_ideas_1000_3: "Защищённая торговля"
national_ideas_1000_3_desc: "Мы можем не соперничать с великими морскими державами мира, но должны защищать своё среди бесконечных волн морей и океанов! Наша торговля ценна и достойна охраны!"

national_ideas_1000_4: "Оборонительная армия"
national_ideas_1000_4_desc: "Главная задача любой армии — защита народа и страны. Защита интересов за рубежом тоже важна, но у страны не будет интересов, если её больше не существует или она уязвима для вторжения врага."

national_ideas_1000_5: "Военно-воздушные силы"
national_ideas_1000_5_desc: "Война в воздухе — будущее войны! Возможность обнаруживать и атаковать врага далеко за фронтом уникальна для воздушных войск, а возможность разрушать промышленность противника издалека может вынудить к сдаче."

national_ideas_1000_6: "Флот линейных кораблей"
national_ideas_1000_6_desc: "Малый, но правильно организованный флот может противостоять гораздо большему противнику, но организация и тактика имеют предел. Чтобы по-настоящему владеть морями, нужно инвестировать в большие, мощно вооружённые корабли."

national_ideas_1000_7: "Политическая власть"
national_ideas_1000_7_desc: "Любая нация, неспособная управлять внутренними делами, — провальная нация. Улучшение бюрократии и ускорение принятия решений делает государство сильнее."

national_ideas_1000_8: "Общие амбиции"
national_ideas_1000_8_desc: ""

## GER
national_ideas_1_0: "Немецкие традиции"
national_ideas_1_0_desc: ""

national_ideas_1_1: "Небо — наше"
national_ideas_1_1_desc: "Небо — новая граница войны, и каждая великая держава это понимает. Обход ограничений Версаля через подготовку и развитие в России уже успешен. Ранние эксперименты с ракетами дали интересные результаты. Расширение этих усилий и обеспечение превосходства в воздухе позволит сражаться с сильнейшими врагами."

national_ideas_1_2: "Блиц по землям"
national_ideas_1_2_desc: "Танк — одно из самых заметных изобретений Великой войны. Сочетание скорости и мощности с традициями немецкой манёвренной войны открывает новые пути для поражения слабых мест врага. Быстрые и мощные атаки с участием плотных концентраций бронетанковых и моторизованных/механизированных пехотных формирований с поддержкой авиации обеспечат быструю победу."

national_ideas_1_3: "Немецкая трудовая этика"
national_ideas_1_3_desc: "Трудолюбие и честность — врождённые качества немцев. 'Не немцы', отказывающиеся служить общему благу, не будут терпимы. Порядок прост: Борись, Работай или Погибай!"

national_ideas_1_4: "Храним наши секреты"
national_ideas_1_4_desc: "Скрывать наши планы от любопытных глаз необходимо для достижения амбиций. Машина шифрования Enigma уже полезна и, даже с современным оборудованием, неразгадана. Улучшение её сделает наши действия непредсказуемыми."

national_ideas_1_5: "Никакой пощады мерзавцам"
national_ideas_1_5_desc: "Враги Рейха повсюду. Восстания неизбежны, но мы не должны их терпеть. Местные гарнизоны не должны быть ограничены в действиях против повстанцев: рейды, публичные казни, депортации — всё в их распоряжении."

national_ideas_1_6: "Ein Volk, ein Reich, ein Führer"
national_ideas_1_6_desc: "Послушание — высшая добродетель. Разделение ведёт к поражению; мы должны работать вместе. Мы один народ, один Рейх, под одним Фюрером!"

national_ideas_1_7: "Всё ради дела"
national_ideas_1_7_desc: "Враги давят на нас. Наши законные завоевания на западе утрачены, а красные стоят у дверей. Но с нашей технологией и тактикой мы сможем победить врагов. Каждый мужчина обязан сражаться за Германию!"

national_ideas_1_8: "Немецкие амбиции"
national_ideas_1_8_desc: ""

## USA
national_ideas_2_0: "Американские традиции"
national_ideas_2_0_desc: ""

national_ideas_2_1: "Борьба с Великой депрессией"
national_ideas_2_1_desc: "Великая депрессия разрушила экономику. Безработица опасно высока, а засуха почти уничтожила сельское хозяйство. Только масштабные экономические реформы могут дать устойчивое восстановление. Инвестиции в инфраструктуру — начало, но нужно ускоряться."

national_ideas_2_2: "Билль о правах"
national_ideas_2_2_desc: "Каждый человек имеет право жить в безопасности, процветании и мире. Несправедливо лишать кого-то этих прав; долг государства — исправить прошлые несправедливости."

national_ideas_2_3: "Империя свободы"
national_ideas_2_3_desc: "Наша страна основана на идее сияющего города на холме. Мы должны оправдать эту идею, стать маяком свободы для других стран."

national_ideas_2_4: "Американская мечта"
national_ideas_2_4_desc: "Все имеют право на мир, безопасность и процветание. Мы должны обеспечивать эти права, не игнорируя нарушения за пределами континента."

national_ideas_2_5: "Военно-морской флот США"
national_ideas_2_5_desc: "Океаны у обоих берегов требуют защиты. Наш флот впечатляет, но недостаточен для защиты свободы людей по всему миру. Для этого необходимо расширять влияние и флот."

national_ideas_2_6: "ВМС SEAL"
national_ideas_2_6_desc: "Контроль над морями позволяет атаковать везде, но нужен специализированный амфибийный корпус, готовый к любым трудностям."

national_ideas_2_7: "Специальные силы"
national_ideas_2_7_desc: "Защитники слабых должны быть готовы сражаться в любых условиях. Специализированные подразделения для особых ситуаций — сравнительно лёгкая задача."

national_ideas_2_8: "Американские амбиции"
national_ideas_2_8_desc: ""

## ENG
national_ideas_3_0: "Британские традиции"
national_ideas_3_0_desc: ""

national_ideas_3_1: "Морская нация"
national_ideas_3_1_desc: "Исторически мы — морская держава. Технологии развиваются быстро, нужно идти в ногу, чтобы сохранить позиции."

national_ideas_3_2: "Нация изобретателей"
national_ideas_3_2_desc: "Мы постоянно лидируем в науке и инновациях. Приём беженцев и талантов из Европы усиливает нас. Нужно использовать эту возможность."

national_ideas_3_3: "Родина промышленной революции"
national_ideas_3_3_desc: "Мы родина современной промышленности и промышленной революции. Мы первопроходцы, кто сможет возглавить вторую промышленную революцию?"

national_ideas_3_4: "Королевские ВВС"
national_ideas_3_4_desc: "Рост авиационной мощи угрожает народу. Ни один флот не защитит нас. Необходимо расширять ВВС."

national_ideas_3_5: "Королевский флот"
national_ideas_3_5_desc: "Флот — гордость нации. В нынешние тяжёлые времена защита от иностранных захватчиков — первоочередная задача."

national_ideas_3_6: "Британские острова"
national_ideas_3_6_desc: "Наши острова идеальны для подготовки к освобождению Европы от тирании. Мы будем готовы к решающей высадке."

national_ideas_3_7: "Национальная разведка"
national_ideas_3_7_desc: "Знание планов врага — сильнейшее оружие. Bletchley Park уже работает над разгадкой Enigma. Это вопрос времени, когда мы будем знать всё о противнике."

national_ideas_3_8: "Британские амбиции"
national_ideas_3_8_desc: ""

## ITA
national_ideas_4_0: "Итальянские традиции"
national_ideas_4_0_desc: ""

national_ideas_4_1: "Родина фашизма"
national_ideas_4_1_desc: "Идеология растёт во многих странах. Рим — родина великих свершений. Мы должны вести мир к будущей славе под нашим руководством."

national_ideas_4_2: "Осторожные пилоты"
national_ideas_4_2_desc: "Самолёты дороги, а потеря самолёта — потеря пилота. Строительство боевой машины и обучение пилота нельзя тратить впустую."

national_ideas_4_3: "Итальянский флот"
national_ideas_4_3_desc: "Мы в центре Средиземного моря. Контроль морских и прибрежных территорий обязателен."

national_ideas_4_4: "Триумф в Африке"
national_ideas_4_4_desc: "Амбиции объединяют народ. Эфиопия — начало славной кампании для расширения империи."

national_ideas_4_5: "Прыжки по островам"
national_ideas_4_5_desc: "Контроль Средиземного моря требует захвата всех островов. Практика амфибийных высадок на наших островах облегчит будущие операции."

national_ideas_4_6: "Балканская кампания"
national_ideas_4_6_desc: "Балканы — наша законная территория с древних времён. Теперь мы можем исправить ошибки прошлого."

national_ideas_4_7: "Оборона Африки"
national_ideas_4_7_desc: "Территории на юге ценны только если мы удержим их и превратим в эффективные фронты."

national_ideas_4_8: "Итальянские амбиции"
national_ideas_4_8_desc: ""

## SOV
national_ideas_5_0: "Советские традиции"
national_ideas_5_0_desc: ""

national_ideas_5_1: "Пятилетний план"
national_ideas_5_1_desc: "Царь долго игнорировал промышленность, заботясь о себе и семье. Мы должны наверстать упущенное, индустриализировать страну и стать мировой державой."

national_ideas_5_2: "Чистка политических противников"
national_ideas_5_2_desc: "Диссиденты и вредители повсюду. Нужно устранить элементы, угрожающие стране."

national_ideas_5_3: "Советская воля"
national_ideas_5_3_desc: "Мы пережили многие трагедии. В этот раз мы тоже выдержим всё, даже самого дьявола и его орды."

national_ideas_5_4: "Уроки зимней войны"
national_ideas_5_4_desc: "Финны выжили вопреки прогнозам. Исследование Севера — приоритет, если хотим победить там."

national_ideas_5_5: "Массовое производство"
national_ideas_5_5_desc: "Народ силён, но нужны оружие и ресурсы. Сосредоточимся на обеспечении каждого бойца."

national_ideas_5_6: "Возвращение Родины"
national_ideas_5_6_desc: "Пора освободить Родину от захватчиков, отомстить за их преступления и освободить трудящихся. Пролетарии всех стран, соединяйтесь!"

national_ideas_5_7: "Приказ №227"
national_ideas_5_7_desc: "Ни шагу назад! Врагу мы уже дали слишком много земли. Теперь нужно стоять насмерть, готовиться к контратаке."

national_ideas_5_8: "Советские амбиции"
national_ideas_5_8_desc: ""

## JAP
national_ideas_6_0: "Японские традиции"
national_ideas_6_0_desc: ""

national_ideas_6_1: "Императорский флот"
national_ideas_6_1_desc: "Море спокойно, но шторм надвигается. Нужно инвестировать в флот, чтобы быть победителем в грядущем конфликте."

national_ideas_6_2: "Современные авианосцы"
national_ideas_6_2_desc: "Западные державы строили сколько хотели, мы нет. Мы должны инновационно подходить к дизайну и атаковать неожиданно."

national_ideas_6_3: "Господство в Тихом океане"
national_ideas_6_3_desc: "Мы — островная нация. Логично стать морской державой и контролировать домашние моря, начав с Тихого океана."

national_ideas_6_4: "Банзай-атаки"
national_ideas_6_4_desc: "Что значит жизнь одного человека перед силой Тенно? Когда придёт время, готовьтесь пожертвовать всем ради славы!"

national_ideas_6_5: "Перехитрить американские корабли"
national_ideas_6_5_desc: "Противостоять врагу один на один — легко. Перехитрить его можно и нужно."

national_ideas_6_6: "Больше палуб на авианосцах"
national_ideas_6_6_desc: "Наши самолёты доказали свою эффективность. Больше места на авианосцах позволит большему количеству самолётов вступить в бой."

national_ideas_6_7: "Идеологический фанатизм"
national_ideas_6_7_desc: "Мы не можем позволить врагу победить. Потеря чести — последнее, что мы можем допустить. Tenno Heika Banzai!"

national_ideas_6_8: "Японские амбиции"
national_ideas_6_8_desc: ""

## FRA
national_ideas_7_0: "Французские традиции"
national_ideas_7_0_desc: ""

national_ideas_7_1: "Линия Мажино"
national_ideas_7_1_desc: "Сдерживание немцев в Великой войне потребовало огромных жертв. Сейчас нужно подготовиться к новой угрозе с востока. Строительство системы бункеров и окопов остановит любые атаки."

national_ideas_7_2: "Воспоминания о прошлом"
national_ideas_7_2_desc: "Великая война принесла смерть и разрушения. Изучение прошлого поможет избежать прежних ошибок."

national_ideas_7_3: "Соглашения с коммунистами"
national_ideas_7_3_desc: "Коммунисты не святы, но сейчас они здесь. Вместо деления нации, сосредоточимся на объединении и учёте голоса рабочих."

national_ideas_7_4: "Нет Германии"
national_ideas_7_4_desc: "Германия уже показывала, на что способна. Нельзя позволять ей расширять влияние, чтобы не повторить ошибки прошлого."

national_ideas_7_5: "Африканская кампания"
national_ideas_7_5_desc: "Богатства Африки огромны. Контроль над ними поможет нашим усилиям и ослабит врагов."

national_ideas_7_6: "Возвращение в Париж"
national_ideas_7_6_desc: "Настало наше время. С союзниками мы очистим страну от зла и освободим народ."

national_ideas_7_7: "Война, чтобы покончить со всеми войнами"
national_ideas_7_7_desc: "Мы допустили рост зла раз. Не повторим ошибки. Нужно действовать решительно и до конца."

national_ideas_7_8: "Французские амбиции"
national_ideas_7_8_desc: ""

## CAN
national_ideas_8_0: "Канадские традиции"
national_ideas_8_0_desc: ""

national_ideas_8_1: "Арктические температуры"
national_ideas_8_1_desc: "Холод родины закаляет. Ни одна зима не слишком сурова, ни один ветер слишком резок для победы."

national_ideas_8_2: "Арктические условия"
national_ideas_8_2_desc: "Климат требует от народа многого. Мы умеем выживать и работать с природой. Всё, что нужно человеку — знания и доверие к товарищу."

national_ideas_8_3: "Равенство на войне"
national_ideas_8_3_desc: "Не можем удерживать тех, кто готов сражаться за короля и страну. Даже если они не на фронте, они освобождают солдат."

national_ideas_8_4: "Королевский канадский флот"
national_ideas_8_4_desc: "Мать-страна правит морями, но мы должны защищать свои берега."

national_ideas_8_5: "Королевские канадские ВВС"
national_ideas_8_5_desc: "Война в Европе на горизонте. Воздушные силы помогут прорвать тупик. Требуется обучение совместно с доминионами."

national_ideas_8_6: "Африканская кампания"
national_ideas_8_6_desc: "Пустыни Северной Африки могут стать плацдармом для вторжения в Европу. Победа здесь обеспечит успех всей войны."

national_ideas_8_7: "Канадское вторжение"
national_ideas_8_7_desc: "Если союзники не смогут атаковать, мы готовы бросить всё на решающий штурм."

national_ideas_8_8: "Канадские амбиции"
national_ideas_8_8_desc: ""

## PRC
national_ideas_9_0: "Традиции китайского народа"
national_ideas_9_0_desc: ""

national_ideas_9_1: "Загнанная лиса"
national_ideas_9_1_desc: "Гражданская война требует быстрого создания периметров и постов. Наше численное положение — преимущество, если использовать скрытность."

national_ideas_9_2: "Последствия Долгого похода"
national_ideas_9_2_desc: "Долгий поход измотал войска. Восстановление потребует времени и ресурсов, но опыт ценный для будущего."

national_ideas_9_3: "Японская угроза"
national_ideas_9_3_desc: "Японцы технологически превосходят нас. Нужно использовать известную территорию и создавать сложные оборонительные позиции."

national_ideas_9_4: "Боевой дух китайцев"
national_ideas_9_4_desc: "Разум и воля народа велики. С правильным руководством они способны на невозможное."

national_ideas_9_5: "Великий скачок вперёд"
national_ideas_9_5_desc: "Земли отсталы, люди недостаточно технически подготовлены. Сотрудничество с крестьянами и союзниками компенсирует прошлые упущения."

national_ideas_9_6: "За линией врага"
national_ideas_9_6_desc: "Агенты за линией врага и взаимодействие с гражданскими дают ценную информацию о враге."

national_ideas_9_7: "Великий председатель"
national_ideas_9_7_desc: "Мао праведен и мудр. Если война необходима, мы готовы к ней."

national_ideas_9_8: "Амбиции китайского народа"
national_ideas_9_8_desc: ""

## CHI
national_ideas_10_0: "Китайские традиции"
national_ideas_10_0_desc: ""

national_ideas_10_1: "Немецкие офицеры"
national_ideas_10_1_desc: "Друзья из Германии помогают модернизировать армию. Нужно принять помощь и следовать их советам."

national_ideas_10_2: "Истинный Китай"
national_ideas_10_2_desc: "Несмотря на режимы военных вождей, мы — единственное легитимное китайское государство. Бюрократия и государственность должны быть эффективны."

national_ideas_10_3: "Боевой дух китайцев"
national_ideas_10_3_desc: "Разум и воля народа велики. С правильным руководством они способны на невозможное."

national_ideas_10_4: "Инцидент на мосту Марко Поло"
national_ideas_10_4_desc: "Граничные инциденты учащаются. Нужно готовить неприятные сюрпризы для соседей."

national_ideas_10_5: "Битва за Ухань"
national_ideas_10_5_desc: "После первых испытаний войска готовы быть Армией Гоминьдана и вести нас в будущее."

national_ideas_10_6: "Модернизация Китая"
national_ideas_10_6_desc: "Продолжительная индустриальная война возможна только при правильной промышленной базе. Сейчас её нет, но это решаемо."

national_ideas_10_7: "Угроза Мао"
national_ideas_10_7_desc: "Коммунисты Мао — самая серьёзная угроза среди группировок. Нужно подавить их прежде, чем станет слишком поздно."

national_ideas_10_8: "Китайские амбиции"
national_ideas_10_8_desc: ""

## Chinese Warlords
national_ideas_11_0: "Традиции китайских военачальников"
national_ideas_11_0_desc: ""

national_ideas_11_1: "Интриги в тени"
national_ideas_11_1_desc: "Режим Гоминьдана нестабилен и коррумпирован — это очевидно для всех. Используя пробелы и слабости его власти, мы можем постепенно дестабилизировать врага и, возможно, направить ресурсы к себе."

national_ideas_11_2: "Хаос в стране"
national_ideas_11_2_desc: "Китай погружается в смуту. Если мы хотим взять под контроль родной регион, время для этого приближается. Мы должны подготовиться, ведь у нас будет только один шанс объединить расколотые земли."

national_ideas_11_3: "Армия клик"
national_ideas_11_3_desc: "В данный момент наши войска больше похожи на банды, чем на современную армию. Нам нужно изменить как восприятие, так и реальность, чтобы стать уважаемым и независимым государством."

national_ideas_11_4: "Боевой дух китайцев"
national_ideas_11_4_desc: "Разум и воля нашего народа велики. С правильным руководством и мотивацией они способны достичь невозможного."

national_ideas_11_5: "Битва при Ухане"
national_ideas_11_5_desc: "Пройдя первые испытания и огонь, наши войска наконец готовы и достойны называться «Армией Гоминьдана»; именно они поведут нас в новое будущее на поле боя."

national_ideas_11_6: "Поддержка в хаосе"
national_ideas_11_6_desc: "В эти времена бедствий и возможностей нам нужны все, кто готов сражаться за нас. Убедить народ в наших планах и вовлечь его в их реализацию — необходимый шаг."

national_ideas_11_7: "Современные тактики"
national_ideas_11_7_desc: "Войны мобильности и комбинированных сил — будущее. Инвестиции в разработку доктрин и оснащение должны стать нашей среднесрочной целью."

national_ideas_11_8: "Амбиции китайских военачальников"
national_ideas_11_8_desc: ""

## POL
national_ideas_12_0: "Польские традиции"
national_ideas_12_0_desc: ""

national_ideas_12_1: "Крылатые гусары"
national_ideas_12_1_desc: "Наша кавалерия когда-то спасала всю Европу от угроз с юга. Хотя эпоха конницы заканчивается, её потенциал ещё не исчерпан; пока мы будем полагаться на традиции и опыт."

national_ideas_12_2: "Опыт раздела"
national_ideas_12_2_desc: "Наш народ имеет большой опыт разделов и угнетения, особенно от Пруссии, Австрии и России. Используем этот опыт и обиду во благо, чтобы обеспечить будущее без врагов на нашей земле!"

national_ideas_12_3: "Правильное польское государство"
national_ideas_12_3_desc: "Наш народ долго жил под чужими флагами, желая собственного государства. Пора это исправить и создать истинное польское государство, достойное будущего наших людей!"

national_ideas_12_4: "Сильные соседи"
national_ideas_12_4_desc: "Польша всегда находилась между двумя гигантами, каждый из которых стремится расширить своё влияние. Нам нужно использовать эту уникальную геополитику, играя на противоречиях, чтобы гарантировать выживание."

national_ideas_12_5: "Славное прошлое"
national_ideas_12_5_desc: "Раньше мы были могущественной нацией, защитниками христианского мира от исламской угрозы. Те времена ушли, но наша геополитическая значимость ещё возможна. Правильная игра позволит нам вернуть статус европейской державы."

national_ideas_12_6: "Выход к Балтийскому морю"
national_ideas_12_6_desc: "Наше побережье и флот малы, но мы не должны унывать. Нужно использовать ресурсы эффективно, защищать побережье и морские пути."

national_ideas_12_7: "Опыт прошлого"
national_ideas_12_7_desc: "Мы многократно переживали трагедии. Пусть это станет нашей гордостью, а не позором, и подготовит нас к будущим испытаниям."

national_ideas_12_8: "Польские амбиции"
national_ideas_12_8_desc: ""

## GER (Neutrality)
national_ideas_13_0: "Традиции имперской Германии"
national_ideas_13_0_desc: ""

national_ideas_13_1: "Стремление к имперской мощи"
national_ideas_13_1_desc: "Версальский договор разрушил нашу колониальную империю и deeply обидел гордость Германии. Мы должны вновь обрести значение. Под преданным и объединённым Кайзером мы вернём то, что по праву наше!"

national_ideas_13_2: "Уроки Великой войны"
national_ideas_13_2_desc: "Несмотря на трагичность войны, из неё можно извлечь уроки. Оборонительные стратегии столь же важны, как и наступательные. Мы должны усовершенствовать их и улучшить позиции войск."

national_ideas_13_3: "Уроки Ютланда"
national_ideas_13_3_desc: "Битва при Ютланде стала переломным моментом не только для нас и Англии, но и для будущих морских конфликтов. Необходимо переоценить всё: доктрины, конструкции флота, чтобы создать достойный флот."

national_ideas_13_4: "Пощады не будет"
national_ideas_13_4_desc: "Быть частью империи — привилегия, которую нельзя терять. Мы требуем абсолютного подчинения и не примем подрывные действия. Никто не будет пощажён."

national_ideas_13_5: "Не партии, а немцы"
national_ideas_13_5_desc: "Нельзя терять себя во внутренних спорах. Институты должны служить немецкому народу и империи. Объединим немцев под Кайзером для новой славы."

national_ideas_13_6: "Красный барон"
national_ideas_13_6_desc: "Хотя в Великой войне авиация не была решающей, в будущем она станет ключевой. С нашим опытом и знаменитым асом Манфредом фон Рихтгофеном мы доказали своё мастерство. Нужно поддерживать преемников Красного Барона."

national_ideas_13_7: "Наше место под солнцем"
national_ideas_13_7_desc: "Немцы заслуживают быть ведущей мировой силой. Потерянные из-за ошибок прошлого привилегии и колонии в Африке и Китае мы должны вернуть! Солнце никогда не зайдёт над нашей империей!"

national_ideas_13_8: "Амбиции имперской Германии"
national_ideas_13_8_desc: ""

## GRE
national_ideas_14_0: "Греческие традиции"
national_ideas_14_0_desc: ""

national_ideas_14_1: "Греческая промышленная революция"
national_ideas_14_1_desc: "Наша страна мала, ресурсы ограничены. Поэтому мы должны реорганизовать производство, транспорт и инфраструктуру, чтобы противостоять времени."

national_ideas_14_2: "Борьба с Великой депрессией"
national_ideas_14_2_desc: "Хотя депрессия началась в США, её последствия ощущались и у нас. Восстановление промышленности — первый шаг к процветающей Греции."

national_ideas_14_3: "Линия Метаксаса"
national_ideas_14_3_desc: "С ростом фашизма в Центральной Европе северная угроза становится реальной. Нужно подготовить статическую оборону на болгарской границе."

national_ideas_14_4: "Мегали Идея"
national_ideas_14_4_desc: "Многие земли, когда-то населённые греками, всё ещё под иностранным контролем. Возврат этих земель — приоритет любыми средствами!"

national_ideas_14_5: "Нет уступок"
national_ideas_14_5_desc: "Почему мы должны отдавать врагам победу без боя? Нет! Сегодня мы говорим «нет» и будем сопротивляться до конца!"

national_ideas_14_6: "Греческая партизанская армия"
national_ideas_14_6_desc: "Обычная война против крупных держав почти обречена. Вместо этого готовим армию для партизанской войны и поддержки союзников."

national_ideas_14_7: "Возвращение греческой философии"
national_ideas_14_7_desc: "Мы были первой цивилизованной страной на Западе. Восстановление лидерства в культуре и технологиях должно стать нашей гордостью."

national_ideas_14_8: "Греческие амбиции"
national_ideas_14_8_desc: ""

## SPR
national_ideas_15_0: "Испанские традиции"
national_ideas_15_0_desc: ""

national_ideas_15_1: "Благочестивый католицизм"
national_ideas_15_1_desc: "На рубежах христианства мы укрепляли правление Бога, объединяя людей против внешних угроз."

national_ideas_15_2: "Опыт гражданской войны"
national_ideas_15_2_desc: "Недавний конфликт дал нам уроки, которые нельзя игнорировать. Трагическая потеря жизни из-за плохого руководства не повторится."

national_ideas_15_3: "Воспоминания о Испанской армаде"
national_ideas_15_3_desc: "В расцвет империи никто не сомневался в мощи флота. Если хотим вернуть славу, нужно восстановить флот."

national_ideas_15_4: "Авторитарное государство"
national_ideas_15_4_desc: "Организация государства и армии под сильным руководством ускоряет бюрократию, увеличивает промышленность и улучшает координацию войск."

national_ideas_15_5: "Память о гегемонии Испании"
national_ideas_15_5_desc: "Наше влияние проявлялось через колонии. Потеря контроля над ними — наше главное падение. Восстановление контроля принесёт пользу нам и миру."

national_ideas_15_6: "Испанская империя"
national_ideas_15_6_desc: "Потеря колоний была почти неизбежной, но повторная потеря — полный провал и утрата престижа. Пусть это больше не повторится."

spain_subject_ideology_drift_idea: "Испанская империя"
spain_subject_ideology_drift_idea_desc: "Наш сюзерен §Y[Root.Overlord.GetNameWithFlag]§! завершил национальную идею '§Y[Root.Overlord.GetNationalIdeaName6]§!', что даёт нам этот бонус."

national_ideas_15_7: "Имперская армия"
national_ideas_15_7_desc: "Защита и руководство над клиентскими государствами имеет цену. Мы вправе требовать часть их людских ресурсов для наших целей."

national_ideas_15_8: "Испанские амбиции"
national_ideas_15_8_desc: ""

## Imperial Chinese
national_ideas_16_0: "Традиции императорского Китая"
national_ideas_16_0_desc: ""

national_ideas_16_1: "Наследники Конфуция"
national_ideas_16_1_desc: "В эти неспокойные времена учения некоронованного короля ценны как никогда. Нужно принять наследие и подготовить народ к надвигающейся буре."

national_ideas_16_2: "Уроки восстания ихэтуаней"
national_ideas_16_2_desc: "Мы пытались изгнать западных захватчиков и потерпели неудачу. Скоро мы попробуем снова и достигнем успеха там, где предки потерпели поражение."

national_ideas_16_3: "Боевой дух китайцев"
national_ideas_16_3_desc: "Разум и воля нашего народа велики. С правильным руководством они способны достичь невозможного."

national_ideas_16_4: "Месть за Симоносеки"
national_ideas_16_4_desc: "Мы растём, пока враги истощают друг друга. Пора исправить сорокалетнюю несправедливость, народ готов как никогда."

national_ideas_16_5: "Императорская дисциплина"
national_ideas_16_5_desc: "Мы были владыками больших земель, генералами огромных армий, хранителями богатства. Нужно укрепить ум и волю, чтобы достичь этого снова."

national_ideas_16_6: "Запретный город"
national_ideas_16_6_desc: "Гугун символизирует стабильность и гармонию 400 лет. Мы должны следовать этим идеалам."

national_ideas_16_7: "Пример для Терракотовой армии"
national_ideas_16_7_desc: "С времён императора Цинь известно, какую мощь приносит объединение народа. Как Терракотовая армия, мы защитим царство от разрушителей."

national_ideas_16_8: "Амбиции императорского Китая"
national_ideas_16_8_desc: ""

## Imperial Greek
national_ideas_17_0: "Традиции императорской Греции"
national_ideas_17_0_desc: ""

national_ideas_17_1: "Наследники Александра Македонского"
national_ideas_17_1_desc: "Мы наследники великого тактика и полководца. Мы достойны этого наследия и должны это показать."

national_ideas_17_2: "Воспоминания о войске Александра"
national_ideas_17_2_desc: "Армия Александра была уникальна в структуре, оружии и стратегиях. Мы должны перенять этот менталитет и организовать наши войска дисциплинированно."

national_ideas_17_3: "Единство через культуру"
national_ideas_17_3_desc: "Наша культура распространилась далеко и выжила в других странах. Восстановление связей позволит относиться к иностранцам как к потерянным братьям."

national_ideas_17_4: "Владыки известного мира"
national_ideas_17_4_desc: "От Греции и Болгарии до Египта и Индии мы когда-то правили большей частью известного мира. Времена меняются, но мы достойны трона."

national_ideas_17_5: "Быстрее Гермеса"
national_ideas_17_5_desc: "Возможность сейчас и только сейчас. Не теряем времени, ускоряем экспансию, заимствуя крылатые сандалии божественного гонца."

national_ideas_17_6: "Македонская война"
national_ideas_17_6_desc: "Максимальное использование опыта — ключ к успеху. С древних времён мы умели сочетать ветеранов и новобранцев в эффективные армии."

national_ideas_17_7: "Восстановление империи"
national_ideas_17_7_desc: "Земли разорены войной и пренебрежением. Нужно восстановить былую славу и создать новую золотую эру для народа."

national_ideas_17_8: "Амбиции императорской Греции"
national_ideas_17_8_desc: ""

## ROM
national_ideas_18_0: "Румынские традиции"
national_ideas_18_0_desc: ""

national_ideas_18_1: "Между гигантом и немцами"
national_ideas_18_1_desc: "Мы зажаты между двумя амбициозными державами. Возможно, стоит занять сторону противника или искать внешнюю помощь, чтобы защитить [This.GetName]."

national_ideas_18_2: "Румынская революция"
national_ideas_18_2_desc: "На протяжении века мы боремся за независимость и права на международной арене. В эти смутные времена нужно сосредоточиться на этой борьбе."

national_ideas_18_3: "Румынские нефтяные поля"
national_ideas_18_3_desc: "Нефтяные поля на юге и западе — наши богатства и крупнейшие в Европе. Они могут быть мощным инструментом политики и одновременно опасной нагрузкой."

national_ideas_18_4: "Железная гвардия"
national_ideas_18_4_desc: "Фашистская Железная гвардия давно имеет силу внутри страны и требует официального места в правительстве. Возможно, стоит пойти на уступки, чтобы избежать нестабильности."

national_ideas_18_5: "Смерть или позор"
national_ideas_18_5_desc: "С ростом фашистов и международных угроз у нас есть два пути: позорные союзы или смерть в отчаянной обороне."

national_ideas_18_6: "Большая Румыния"
national_ideas_18_6_desc: "Многие земли были отняты у нас. Мы вернём их, даже если придётся пройти через хаос и кровь."

national_ideas_18_7: "Дивизии охотников на танки"
national_ideas_18_7_desc: "Танки — будущее сухопутной войны. Мы не можем соперничать в танковом бою, но специализированные противотанковые части смогут выполнить задачу быстрее."

national_ideas_18_8: "Амбиции Румынии"
national_ideas_18_8_desc: ""

## TUR
national_ideas_19_0: "Традиции Турции"
national_ideas_19_0_desc: ""

national_ideas_19_1: "Реформы Ататюрка"
national_ideas_19_1_desc: "Ататюрк и его реформы превратили нас из разорённого султаната в современное государство. Нужно продолжать реформы и совершенствоваться."

national_ideas_19_2: "Новая республика"
national_ideas_19_2_desc: "Молодая республика всегда хрупка, уязвима внутри и снаружи. Мы должны заботиться о её укреплении, пока она не укоренится в сердцах народа."

national_ideas_19_3: "Приближение к Западу"
national_ideas_19_3_desc: "Мы долгое время были изолированы от Запада. Для нового республиканского государства дипломатические связи нужно налаживать как можно раньше."

national_ideas_19_4: "Мир дома и в мире"
national_ideas_19_4_desc: "Процветание приходит со стабильностью, которая основана на мире. Нужно стабилизировать хотя бы ближайшие регионы в этот период смуты."

national_ideas_19_5: "Сопротивление прошлого"
national_ideas_19_5_desc: "Мы всегда умели защищать свои интересы. При неудачной дипломатии необходимо быть готовыми к масштабной защите личности и страны."

national_ideas_19_6: "Тюркенюбунг"
national_ideas_19_6_desc: "Несколько стран демонстрируют силу, стремясь к нашей дружбе. Мы можем изучить их оборудование, стиль боя и тренировочные методики."

national_ideas_19_7: "Секуляризация"
national_ideas_19_7_desc: "История показывает, что секуляризация ведёт к будущему. Ататюрк начал этот процесс, и мы должны продолжить его для славного будущего."

national_ideas_19_8: "Амбиции Турции"
national_ideas_19_8_desc: ""

