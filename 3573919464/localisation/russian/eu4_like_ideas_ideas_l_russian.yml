IDEA_GROUP_19: "Монархические идеи"
IDEA_GROUP_20: "Идеи авианосцев"
IDEA_GROUP_21: "Идеи танков"
IDEA_GROUP_22: "Идеи министров"
IDEA_GROUP_23: "Идеи шпионажа"
IDEA_GROUP_24: "Идеи бомбардировок"
IDEA_GROUP_25: "Идеи внутренней политики"
IDEA_GROUP_26: "Идеи сопротивления"
IDEA_GROUP_27: "Идеи оккупации"

idea_group_1_1: "Академия советников"
idea_group_1_1_desc: "Хотя в нашей стране есть богатые семьи, с которыми мы любим вести дела и общаться, выбирать всех наших советников и офицеров только из них — рецепт неминуемой катастрофы. Мы должны создать академию для подготовки советников и офицеров специально для административных функций, чтобы не полагаться исключительно на 'дворянские связи'."

idea_group_1_2: "Министерство экономики"
idea_group_1_2_desc: "Экономическую политику сложно менять со временем, особенно при внезапных изменениях на мировом рынке. Создав министерство, которое будет заниматься финансовым законодательством внутри страны, мы сможем облегчить процесс изменения экономической политики как для простых граждан, так и для богатых."

idea_group_1_3: "Администрирование торгового законодательства"
idea_group_1_3_desc: "Торговые законы строятся на традициях прошлого и поэтому их трудно менять без больших усилий. Мы можем укрепить наши усилия, сосредоточившись на торговых законах и назначив персонал и чиновников для разработки оптимальных законов, способствующих долгосрочному росту."

idea_group_1_4: "Пропаганда"
idea_group_1_4_desc: "Наши люди имеют чувство единства и лояльности к нации и её истории, но существуют связи с другими народами и культурами. Эти связи — возможные каналы для распространения иностранных идеологий, что мы должны предотвращать, укрепляя собственную идеологию и самосознание."

idea_group_1_5: "Иностранная разведка"
idea_group_1_5_desc: "Использование иностранной разведки — не ново, но методы её применения изменились. Если мы сумеем сделать чужую разведку менее эффективной и более запутанной, нашим врагам будет сложнее обосновывать любые неправомерные претензии."

idea_group_1_6: "Стабильное правительство"
idea_group_1_6_desc: "Стабильность — основа любого государства. Без неё инфраструктура рушится, и мы уже видели это несколько раз. Мы должны учиться на прошлых ошибках и создать сильный и стабильный орган управления, чтобы избежать внутреннего коллапса."

idea_group_1_7: "Работоспособность народа"
idea_group_1_7_desc: "Способности наших работников — это здоровье нации; без рабочих нация не устоит. Мы должны обеспечить их необходимыми ресурсами и условиями для оптимальной работы."

idea_group_1_8: "Бонус административных идей"
idea_group_1_8_desc: ""

idea_group_2_1: "Конвейерные линии"
idea_group_2_1_desc: "Разделение работы на разные участки нормально, но не идеально в эпоху быстро развивающейся технологии. Внедрение конвейеров повысит эффективность производства и максимизирует выпуск продукции."

idea_group_2_2: "Улучшенные строительные площадки"
idea_group_2_2_desc: "Строительные площадки опасны и сложны, но их можно улучшить. Учитывая условия, материалы, персонал и другие факторы, можно ускорить процесс строительства."

idea_group_2_3: "Оптимизация производства"
idea_group_2_3_desc: "С ростом эффективности заводов и выпуска ресурсов нужно работать над оптимизацией производственных процессов. Улучшение рабочего потока и условий труда повысит общую продуктивность."

idea_group_2_4: "Улучшение добычи"
idea_group_2_4_desc: "Условия работы в шахтах опасны и могут быть утомительными. Улучшение условий и оборудования повысит производительность и эффективность."

idea_group_2_5: "Конвертация заводов"
idea_group_2_5_desc: "Заводы могут обслуживать разные нужды, но переключение с гражданских на военные нужды или наоборот — задача непростая. Логистика и координация персонала ускорят процесс."

idea_group_2_6: "Дополнительные ёмкости силосов"
idea_group_2_6_desc: "Улучшение силосов повышает эффективность армии. Сосредоточение усилий на этой задаче увеличит боеспособность."

idea_group_2_7: "Улучшение перерабатывающих заводов"
idea_group_2_7_desc: "Переработка ресурсов — важная задача. Улучшение методов переработки увеличит общий выпуск и сократит время обработки."

idea_group_2_8: "Бонус экономических идей"
idea_group_2_8_desc: ""

idea_group_3_1: "Научно-исследовательские учреждения"
idea_group_3_1_desc: "Образованные кадры нужны для общества и для централизации усилий. Исследовательские центры ускорят инновации."

idea_group_3_2: "Финансируемые исследования"
idea_group_3_2_desc: "Исследования требуют условий для учёных. Финансирование и стабильная работа повысят рациональность и эффективность исследований."

idea_group_3_3: "Улучшенная ПВО артиллерия"
idea_group_3_3_desc: "В эпоху воздушной мощи необходима эффективная противовоздушная оборона. Инвестиции в оружие ПВО обеспечат контроль над небом."

idea_group_3_4: "Улучшенная разведка"
idea_group_3_4_desc: "Шифрование важно для военных и исследований. Финансирование улучшенных методов шифрования увеличит возможности расшифровки вражеских кодов."

idea_group_3_5: "Лучшие конструкции самолётов"
idea_group_3_5_desc: "Дизайн самолётов усложняется с материалами и вооружением. Формализация процесса проектирования позволит создавать более совершенные самолёты, чем у врагов."

idea_group_3_6: "Улучшенная конверсия оборудования"
idea_group_3_6_desc: "Оружие должно быть многократно используемо в разных подразделениях. Улучшение логистики повысит эффективность военной техники."

idea_group_3_7: "Обученные рабочие"
idea_group_3_7_desc: "Использование неквалифицированных работников снижает производительность. Обучение работников инструментам и процессам повышает эффективность."

idea_group_3_8: "Бонус идей инноваций"
idea_group_3_8_desc: ""

