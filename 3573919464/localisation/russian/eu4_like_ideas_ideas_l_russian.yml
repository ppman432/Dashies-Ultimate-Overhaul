## Austro-Hungarian
national_ideas_21_0: "Австро-венгерские традиции"
national_ideas_21_0_desc: ""

national_ideas_21_1: "Возрождение Эрцберга"
national_ideas_21_1_desc: "Многие промышленные центры империи долгое время простаивали или использовались недостаточно. Мы должны вновь разжечь наши доменные печи и производственные мощности, чтобы заново ковать нашу нацию."

national_ideas_21_2: "Воссоединение промышленности"
national_ideas_21_2_desc: "Разделение империи разрушило когда-то грандиозную промышленную сеть; каждая бывшая часть пострадала по-своему. Снова объединяя эти элементы, мы становимся больше, чем сумма наших частей, и более мощной силой."

national_ideas_21_3: "Возрождение империи"
national_ideas_21_3_desc: "Две декады наша великая нация лежала в руинах, но больше нет! Мы не будем оставаться тенью самих себя, потому что путь к славе близок!"

national_ideas_21_4: "Союз со всей Европой"
national_ideas_21_4_desc: "Мы были политическим центром Европы на протяжении большей части нашей истории, перекрёстком между Востоком и Западом. Несмотря на то, что династические браки со временем утратили ценность, мы можем вновь стать центром дипломатии между частями Европы."

national_ideas_21_5: "Возвращение коронных земель"
national_ideas_21_5_desc: "Ядро империи вновь едино, но наши земли всё ещё оккупированы. Дипломатия ранее терпела неудачу, но законное завоевание не должно!"

national_ideas_21_6: "Новый рейхсмарине"
national_ideas_21_6_desc: "Флот продвинулся далеко с тех пор, как у нас был выход к морю. Понадобится время, чтобы снова гордо назвать себя 'моряками', но великое всегда начиналось с малого."

national_ideas_21_7: "Исправление старых ошибок"
national_ideas_21_7_desc: "В расцвете нации мы были нестабильны и культурно разделены. Наследный принц планировал изменить это. Сейчас самое время реализовать старые планы и улучшить жизнь народа на всех уровнях."

national_ideas_21_8: "Австро-венгерские амбиции"
national_ideas_21_8_desc: ""

## POR
national_ideas_22_0: "Португальские традиции"
national_ideas_22_0_desc: ""

national_ideas_22_1: "Старые союзы"
national_ideas_22_1_desc: "Мы всегда были хорошо связаны с миром через многочисленные торговые посты и военно-морские базы. Восстановление этих старых связей обеспечит безопасное будущее."

national_ideas_22_2: "Корпоративный статизм"
national_ideas_22_2_desc: "Корпоративный статизм толкает нас к фашистским движениям в Европе. Как мы справимся с этим, определит нашу судьбу в ближайшие годы."

national_ideas_22_3: "Католическая церковь"
national_ideas_22_3_desc: "Церковь была важным столпом нашей истории. В эти тёмные времена она не должна терять своего значения, иначе государство развалится изнутри."

national_ideas_22_4: "Португальские колонии"
national_ideas_22_4_desc: "Мы были колониальной державой на протяжении веков. Использование наших колониальных ресурсов важнее, чем когда-либо, и игнорировать их было бы глупо."

national_ideas_22_5: "Португальский флот"
national_ideas_22_5_desc: "Как хороший сосед Испании, у нас был свой флот, способный бросить вызов любому флоту Европы. С учётом внутренних конфликтов соседей, мы можем превзойти их и стать локальной силой на Пиренейском полуострове или даже в Западной Европе."

national_ideas_22_6: "Воспоминания о Первой республике"
national_ideas_22_6_desc: "Первая республика была катастрофой, но создала интересные ситуации, из которых мы можем извлечь уроки, чтобы сохранить стабильное будущее Португалии."

national_ideas_22_7: "Воспоминания о военном перевороте"
national_ideas_22_7_desc: "Переворот 28 мая положил конец нестабильной Первой республике и открыл новую эру. Несмотря на то, что многие считают это прошлым, для нас это ценный опыт для будущего."

national_ideas_22_8: "Португальские амбиции"
national_ideas_22_8_desc: ""

## SWE
national_ideas_23_0: "Шведские традиции"
national_ideas_23_0_desc: ""

national_ideas_23_1: "Шведская корона"
national_ideas_23_1_desc: "Шведская корона имеет документированную линию с X века. Даже сегодня такие древние связи могут быть использованы в дипломатии и управлении."

national_ideas_23_2: "Воспоминания о Васа"
national_ideas_23_2_desc: "Хотя история Васа больше позор, чем гордость, то время было великим. Мы должны стремиться вернуть этот статус."

national_ideas_23_3: "Официальная торговая нейтральность"
national_ideas_23_3_desc: "Во время Великой войны и ранее мы оказывались между воюющими сторонами. Нейтралитет защищал нас, и позволяет торговать с обеими сторонами, что выгодно."

national_ideas_23_4: "Приют для учёных"
national_ideas_23_4_desc: "С началом нового конфликта интеллектуалы вынуждены покидать страну, чтобы продолжить работу. Нейтралитет делает нас возможным убежищем, если продвигать себя правильно."

national_ideas_23_5: "Фокус на внутренней политике"
national_ideas_23_5_desc: "С войной вокруг нас мы не должны вмешиваться. Вместо этого нужно развивать страну, чтобы быть готовыми к будущим вызовам."

national_ideas_23_6: "Saab 21R"
national_ideas_23_6_desc: "Хотя не первый в своём роде, SAAB 21R — это истребитель нового поколения. Инвестиции в него и аналогичные проекты — путь в будущее."

national_ideas_23_7: "Svenska Flygvapnet"
national_ideas_23_7_desc: "Наши ВВС должны защищать нас от любых угроз. С увеличением вероятности высадок, воздушная оборона должна быть усилена."

national_ideas_23_8: "Шведские амбиции"
national_ideas_23_8_desc: ""

## HOL
national_ideas_24_0: "Голландские традиции"
national_ideas_24_0_desc: ""

national_ideas_24_1: "Торговые традиции Голландии"
national_ideas_24_1_desc: "На протяжении трёх столетий наша нация сосредоточена на торговле. Сохранять и расширять этот опыт — наш патриотический долг."

national_ideas_24_2: "Опытные кораблестроители"
national_ideas_24_2_desc: "Кораблестроение — первая тяжёлая промышленность старого мира, мы помогли её развивать. С времён Священной Римской империи мы считаемся верфями Европы."

national_ideas_24_3: "Fokker"
national_ideas_24_3_desc: "С Великой войны мы известны как хозяева одного из лучших производителей самолётов. Этот потенциал должен быть использован, а Парижская авиационная выставка — хорошая возможность для продвижения."

national_ideas_24_4: "Корни торговой империи"
national_ideas_24_4_desc: "С новыми конфликтами торговля и сырьё становятся ещё ценнее. То, чего другие достигают военной силой, мы можем получить более мирным путём."

national_ideas_24_5: "Koninklijk Huis"
national_ideas_24_5_desc: "Наша королевская семья долгое время была инструментом для внешних держав. Теперь, когда у нас суверенитет, использовать старые связи будет разумно."

national_ideas_24_6: "Koninklijke Marine"
national_ideas_24_6_desc: "Поскольку торговля — наш национальный приоритет, защита её должна быть нашей военной целью. Сильный флот необходим для безопасного судоходства."

national_ideas_24_7: "Военные базы по всему миру"
national_ideas_24_7_desc: "Точно так же, как наша торговая сеть охватывает весь мир, флот должен быть везде. Малые базы и договоры о швартовке обеспечат необходимые диапазоны операций."

national_ideas_24_8: "Голландские амбиции"
national_ideas_24_8_desc: ""

## SAU
national_ideas_25_0: "Традиции Саудовской Аравии"
national_ideas_25_0_desc: ""

national_ideas_25_1: "Aramco"
national_ideas_25_1_desc: "Хотя пока это лишь небольшая ветвь Standard Oil, Калифорнийско-Аравийская Standard Oil Company может помочь в добыче сокровищ под песками нашей земли."

national_ideas_25_2: "Третье саудовское государство"
national_ideas_25_2_desc: "Наше государство молодое и хрупкое. Нужно действовать осторожно, развивая потенциал, иначе неправильные решения приведут к его гибели."

national_ideas_25_3: "Джихад"
national_ideas_25_3_desc: "Слово Корана можно распространять книгой или мечом. В эти трудные времена, возможно, придётся прибегнуть к мечу, как это делали предки."

national_ideas_25_4: "Пустынные воины"
national_ideas_25_4_desc: "Наши земли в основном пустынны, особенно Руб-эль-Хали. Мы сражаемся здесь поколениями, и это закалило нас, делая способными выжить там, где другие не смогут."

national_ideas_25_5: "Воспоминания о войнах за объединение"
national_ideas_25_5_desc: "Мы боролись за каждый город, каждую деревню, каждую хижину! Мы не позволим чужим силам или внутренним противникам отнять у нас что-либо снова!"

national_ideas_25_6: "Воспоминания о арабском восстании"
national_ideas_25_6_desc: "В самом рождении нашей нации нас предали так называемые союзники. Мы должны быть готовы к предательству снова."

national_ideas_25_7: "Преемники халифата"
national_ideas_25_7_desc: "Наши корни ведут к великим халифатам прошлого, которые были политической силой. Мы должны учиться на прошлом и восстанавливать славу нашей веры."

national_ideas_25_8: "Амбиции Саудовской Аравии"
national_ideas_25_8_desc: ""

