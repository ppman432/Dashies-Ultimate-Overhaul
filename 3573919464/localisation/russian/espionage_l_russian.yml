SPIES_TOOLTIP:0 "У вас есть [?spies_display] £шпионов.\n\nВы нанимаете [?dm] £шпионов в месяц.\n\nВы можете строить вербовочные офисы, выбрав штат и нажав кнопку под индикатором сопротивления. Постройка будет добавлена в очередь в вашем меню строительства. Для доступа к меню локальной разведки нажмите на значок рядом с верхней панелью."
SPY_EFFICIENCY_TOOLTIP:0 "Эффективность шпионажа сейчас составляет §H[?Spy_Efficiency]%§! \n\n§H[?Spy_Efficiency_Stability]%§! от стабильности £stability_espionage.\n§H[?encryption_decryption_efficiency]%§! от шифрования и дешифровки £decryption_espionage \n§H[?training_efficiency]%§! от программ обучения шпионов £spy"
Spy_University:0 "Вербовочный офис"
Spy_University_desc:0 "Это здание обеспечивает штат обученными шпионами.\n\n§RНабор шпионов ограничен 5 £шпионами в день. Любой офис, построенный сверх этого лимита, не будет набирать шпионов, если другие вербовочные офисы не повреждены."
SPY_MENU_TOOLTIP:0 "§HНажмите здесь, чтобы открыть меню тайных операций.§!\n(Если вы используете Kaiserreich и хотите проверить значения мнений, нажмите на вкладку «Детали» под этим значком) \n§RЭто меню будет недоступно, если у вас выбрана вкладка деталей вместо дипломатии.§!"
DISRUPT_CIVILIAN_TOOLTIP:0 "§GНарушить работу гражданской промышленности§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие повредит ряд гражданских фабрик противника.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
DISRUPT_MILITARY_TOOLTIP:0 "§GНарушить работу военной промышленности§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие повредит ряд военных заводов противника.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
SABOTAGE_PRODUCTION_TOOLTIP:0 "§GСаботаж производства§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие саботирует производство противника, снижая эффективность на §R15%§! на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
SABOTAGE_EXTRACTION_TOOLTIP:0 "§GСаботаж добычи§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие саботирует добычу ресурсов противника, снижая её эффективность на §R15%§! на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
SABOTAGE_RECRUITMENT_TOOLTIP:0 "§GСаботаж набора§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие нарушает призыв противника, снижая его на §R5%§!§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
SABOTAGE_PLANNING_TOOLTIP:0 "§GСаботаж военного планирования§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие нарушает планирование противника, снижая скорость на §R30%§! и максимальное значение на §R25%§! на §R90§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
DISRUPT_SUPPLY_TOOLTIP:0 "§GНарушить линии снабжения§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие нарушает снабжение противника, снижая скорость пополнения на §R5%§!, увеличивая потребление на §R10%§!, штраф за нехватку снабжения на §R20%§! и потери от истощения на §R10%§! на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
JAM_RADAR_TOOLTIP:0 "§GГлушение авиационных радаров§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие нарушает систему авиационного радара противника, снижая показатели воздушного превосходства, воздушного ближнего удара и воздушной ближней обороны на §R10%§! каждый, увеличивая риск авиааварий, ночной штраф и погодный штраф на §R20%§! каждый на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
POISON_FOOD_TOOLTIP:0 "§GПодбросить яд в продовольствие§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие отравляет продовольствие противника, заставляя их генералов получить черту §R«Больной»§! на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
SUPPORT_RESISTANCE_TOOLTIP:0 "§GПоддержка сопротивления§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие увеличивает эффект сопротивления противника на §R40%§! на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
SUPPORT_PACIFISTS_TOOLTIP:0 "§GПоддержка пацифистов§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие поддерживает призыв к миру и снижает еженедельный прирост военной поддержки противника на §R-1%§! и скорость мобилизации на §R-30%§! на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
SABOTAGE_RESEARCH_TOOLTIP:0 "§GСаботаж исследований§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие саботирует исследования противника, снижая их скорость на §R15%§! на §R60§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
POLITICAL_DISCONTENT_TOOLTIP:0 "§GПосеять политический раздор§!\n[Последняя попытка]\nДля выполнения требуется 100 £шпионов и 100% сила сети.§H\nЭто действие сеет политический раздор в стране противника, снижая прирост политической власти на §R25%§! на §R90§! дней.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
INFILTRATE_TOOLTIP:0 "§GИнфильтрация§!\n[Последняя попытка]\nДля выполнения требуется 50 £шпионов из вашего пула страны. Уровень агентства должен быть 3.§H\nЭто действие предоставляет ежедневные разведывательные отчёты о противнике, доступные в нашем штабе разведки, §Rбессрочно§! до обнаружения шпионов. Инфильтрация также позволяет изучать технологии противника и использовать их в своих целях.§! \nМожно совершить только §RОДНУЮ§! тайную операцию на одну цель в интервале §R30§! дней (любой страной)."
OPERATION_EICHE_TOOLTIP:0 "Разработайте и запустите операцию по спасению шпионов, удерживаемых в §H[FROM.GetNameWithFlag]§!."
NEGOTIATE_RELEASE_TOOLTIP:0 "Напишите письмо §H[FROM.GetLeader]§! для переговоров о выпуске наших шпионов, удерживаемых в их стране."
 
 
LABORATORY_TOOLTIP:0 "Назначьте шпионов в эту лабораторию, чтобы изучать технологии страны, в которую вы сейчас внедряетесь, и работать над воссозданием их юнитов для нашего использования."
SPY_XP_TOOLTIP:0 "В настоящее время у вас есть [?spy_xp] £spy_xp, которые можно использовать для разблокировки новых действий шпионажа. Опыт вы получаете, совершая тайные операции в иностранных странах."
LEVEL_2_TOOLTIP:0 "Вам нужно 100 £spy_xp, чтобы открыть этот уровень.\nНа этом уровне станут доступны следующие действия шпионажа:\n§HВоенная пропаганда\n§HПомощь в исследованиях\n§HПодавление сопротивления"
LEVEL_3_TOOLTIP:0 "Вам нужно 100 £spy_xp, чтобы открыть этот уровень.\nНа этом уровне станут доступны следующие действия шпионажа:\n§HПрограмма добровольцев\n§HПроникновение\nИзучение технологий противника\nУстановить приоритеты направления агентства\nВооружение сопротивления вражеских государств"
