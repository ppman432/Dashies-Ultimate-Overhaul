STRATEGIC_BOMBER_TOOLTIP:0 "§HИзучение технологий стратегических бомбардировщиков противника§!\n\nДля разблокировки этой модели нужно §H500§! £research_points.\nДоступная версия: §H[?enemy_strategic_bomber_year]§! версия\n\nЭта операция будет §RВОЗМОЖНА§! только если технологический уровень этой модели противника на один уровень выше."
