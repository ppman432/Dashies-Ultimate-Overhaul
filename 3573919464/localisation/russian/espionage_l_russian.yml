espionage.news.334.t:0 "Гражданская промышленность нарушена тайными действиями!"
espionage.news.334.desc:0 "[This.GetNewspaperHeader]Иностранное государство частично нарушило нашу гражданскую промышленность с помощью шпионов, находящихся на нашей территории. Это могло повредить некоторые фабрики и замедлить строительство новых гражданских фабрик на 45 дней. Нужно реагировать!"
espionage.news.334.a:0 "Может, нам стоит повысить эффективность шпионажа?"

espionage.news.335.t:0 "Мы отразили иностранную тайную операцию!"
espionage.news.335.desc:0 "[This.GetNewspaperHeader]Иностранное государство пыталось провести тайную операцию на нашей территории. Но благодаря нашей системе защиты мы раскрыли заговор и арестовали всех вовлечённых шпионов. Похоже, они действовали под командованием секретной службы [From.GetAdjective]."
espionage.news.335.a:0 "[From.GetName] заплатит за это!"

  
espionage.news.336.t:0 "Операция в [From.GetName] завершена успешно!"
espionage.news.336.desc:0 "[This.GetNewspaperHeader]Наши шпионы успешно проникли в страну [From.GetName] и выполнили тайную операцию, о которой вы просили. Враг не имеет ни малейшего понятия о том, кто стоит за этим нападением, благодаря нашей высокой эффективности шпионажа."
espionage.news.336.a:0 "Ждите новых новостей!"

espionage.news.337.t:0 "Операция в [From.GetName] провалена!"
espionage.news.337.desc:0 "[This.GetNewspaperHeader]Внезапно [From.GetName] отбила наших шпионов и захватила их до завершения операции. Мы ожидаем дипломатический протест со стороны [From.GetAdjective] правительства и возможные последствия. Наши дипломаты работают не покладая рук, чтобы убедить их, что это недоразумение."
espionage.news.337.a:0 "Надеюсь, они поверят в это!"

espionage.news.338.t:0 "Операция в [From.GetName] провалена!"
espionage.news.338.desc:0 "[This.GetNewspaperHeader]Внезапно [From.GetName] обнаружила наших шпионов и арестовала их. Правительство решило применить усиленные методы допроса, что может раскрыть, кто стоит за атакой."
espionage.news.338.a:0 "Надеемся на лучшее!"

espionage.news.339.t:0 "Расследование: заговорщики раскрыты!"
espionage.news.339.desc:0 "[This.GetNewspaperHeader]В результате применения усиленных методов допроса иностранные шпионы признались, что [From.GetName] стоит за рядом недавних тайных операций на нашей территории."
espionage.news.339.a:0 "[From.GetName] за это заплатит!"

espionage.news.340.t:0 "Расследование провалилось!"
espionage.news.340.desc:0 "[This.GetNewspaperHeader]В результате чрезмерного применения усиленных методов допроса большинство захваченных шпионов погибло. В данный момент мы не можем определить, кто стоял за тайными операциями."
espionage.news.340.a:0 "Возможно, мы узнаем позже!"

espionage.news.341.t:0 "Военная промышленность нарушена тайными операциями!"
espionage.news.341.desc:0 "[This.GetNewspaperHeader]Иностранные агенты частично нарушили работу нашей военной промышленности на нашей территории. Некоторые заводы могли быть повреждены. Также это замедлит строительство новых военных заводов на 45 дней. Нужно действовать!"
espionage.news.341.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.342.t:0 "Производство саботировано тайными операциями!"
espionage.news.342.desc:0 "[This.GetNewspaperHeader]Иностранные агенты частично нарушили производство оружия на нашей территории. Производство новых вооружений замедлится на 45 дней. Нужно реагировать!"
espionage.news.342.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.343.t:0 "Добыча ресурсов нарушена тайными операциями!"
espionage.news.343.desc:0 "[This.GetNewspaperHeader]Иностранные агенты частично нарушили добычу ресурсов на нашей территории. Эффективность добычи снизится на 20% на 45 дней. Нужно реагировать!"
espionage.news.343.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.344.t:0 "Набор в армию нарушен тайными операциями!"
espionage.news.344.desc:0 "[This.GetNewspaperHeader]Иностранные агенты частично нарушили процесс набора войск на нашей территории. Способность эффективно вербовать снизится на 45 дней. Нужно действовать!"
espionage.news.344.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.345.t:0 "Военное планирование саботировано тайными операциями!"
espionage.news.345.desc:0 "[This.GetNewspaperHeader]Иностранные агенты саботируют наше военное планирование, снижая стратегические возможности. Наш план на следующие 3 месяца скомпрометирован. Работаем над новым планом."
espionage.news.345.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.346.t:0 "Линии снабжения нарушены тайными операциями!"
espionage.news.346.desc:0 "[This.GetNewspaperHeader]Иностранные агенты нарушают линии снабжения, снижая эффективность системы. Некоторые маршруты скомпрометированы, что приводит к потерям и замедлению доставки."
espionage.news.346.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.347.t:0 "Авиарадары заглушены тайными операциями!"
espionage.news.347.desc:0 "[This.GetNewspaperHeader]Иностранные агенты заглушают наши авиарадары, повышая риск аварий. Рекомендуем сократить воздушные операции на 60 дней до решения проблемы."
espionage.news.347.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.348.t:0 "Враг поддерживает местное сопротивление"
espionage.news.348.desc:0 "[This.GetNewspaperHeader]Иностранные агенты поддерживают местное сопротивление, дестабилизируя страну. Рекомендуем усилить военную полицию на оккупированных территориях на 60 дней."
espionage.news.348.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.349.t:0 "Враг отравил наши запасы продовольствия"
espionage.news.349.desc:0 "[This.GetNewspaperHeader]Иностранные агенты поддерживают местное сопротивление, дестабилизируя страну. Усиление военной полиции на оккупированных территориях необходимо."
espionage.news.349.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.350.t:0 "Пацифисты сотрудничают с иностранными шпионами"
espionage.news.350.desc:0 "[This.GetNewspaperHeader]Иностранные агенты помогают пацифистским фракциям в нашей стране, снижая поддержку войны и замедляя мобилизацию. Что делать?"
espionage.news.350.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.351.t:0 "Враг саботирует наши исследования"
espionage.news.351.desc:0 "[This.GetNewspaperHeader]Иностранные агенты саботируют наши исследования. Данные уничтожены, некоторые ученые вынуждены уйти. Нужно реагировать."
espionage.news.351.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.352.t:0 "Враг сеет политическое недовольство"
espionage.news.352.desc:0 "[This.GetNewspaperHeader]Иностранные агенты сеют политическое недовольство: шантажируют и убирают лидеров. Нужно реагировать."
espionage.news.352.a:0 "Может, стоит повысить эффективность шпионов?"

espionage.news.353.t:0 "Проникновение в [From.GetName] в процессе"
espionage.news.353.desc:0 "[This.GetNewspaperHeader]Наш разведывательный агент успешно проник в [From.GetAdjective] правительство [From.From.GetName], предоставляя ежедневные отчеты о промышленности и армии."
espionage.news.353.a:0 "Отлично!"

espionage.news.354.t:0 "Сопротивление подорвано в [From.From.GetName]"
espionage.news.354.desc:0 "[This.GetNewspaperHeader]Сопротивление в [From.From.GetName], финансируемое [From.GetName], раскрыто и арестовано нашими агентами."
espionage.news.354.a:0 "[From.GetName] за это заплатит!"

espionage.news.355.t:0 "Сопротивление победило в [From.From.GetName]"
espionage.news.355.desc:0 "[This.GetNewspaperHeader]Сопротивление, финансируемое иностранным государством, успешно провело план, нанеся ущерб инфраструктуре региона."
espionage.news.355.a:0 "Надо подавить сопротивление"

espionage.news.356.t:0 "Сопротивление победило в [From.From.GetName]"
espionage.news.356.desc:0 "[This.GetNewspaperHeader]Наше поддерживаемое сопротивление успешно провело план, повредив инфраструктуру. [From.GetAdjective] правительство не знает о нашей поддержке. Надо использовать возможность."
espionage.news.356.a:0 "Отлично!"

espionage.news.357.t:0 "Сопротивление победило в [From.From.GetName]"
espionage.news.357.desc:0 "[This.GetNewspaperHeader]Наше поддерживаемое сопротивление успешно разрушило все авиабазы. [From.GetAdjective] правительство не знает о нас. Надо использовать шанс."
espionage.news.357.a:0 "Отлично!"

espionage.news.358.t:0 "Сопротивление победило в [From.From.GetName]"
espionage.news.358.desc:0 "[This.GetNewspaperHeader]Наше поддерживаемое сопротивление успешно разрушило все радары. [From.GetAdjective] правительство не знает о нас. Надо использовать шанс."
espionage.news.358.a:0 "Отлично!"

espionage.news.359.t:0 "Сопротивление провалилось в [From.From.GetName]"
espionage.news.359.desc:0 "[This.GetNewspaperHeader]Наше поддерживаемое сопротивление провалилось, план раскрыт, участники арестованы. [From.GetAdjective] правительство знает о нашей поддержке. Возможны дипломатические последствия."
espionage.news.359.a:0 "Нужно лучше планировать в следующий раз!"

espionage.news.360.t:0 "Перехвачен призрачный сигнал"
espionage.news.360.desc:0 "[This.GetNewspaperHeader]Мы перехватили неизвестный сигнал. Аналитики пока не смогли определить его природу."
espionage.news.360.a:0 "Надо разобраться!"

espionage.news.361.t:0 "Проникновение врага отражено"
espionage.news.361.desc:0 "[This.GetNewspaperHeader]Перехваченные сообщения [From.GetAdjective] разведки раскрыли попытку проникновения. Благодаря нашей защите попытка отражена, все участники арестованы."
espionage.news.361.a:0 "[From.GetName] за это заплатит!"

espionage.news.362.t:0 "Проникновение в [From.GetName] провалено"
espionage.news.362.desc:0 "[This.GetNewspaperHeader][From.GetAdjective] спецслужбы перехватили наши коммуникации, арестовали всех и знают источники. Возможны дипломатические последствия."
espionage.news.362.a:0 "Плохо!"

espionage.news.363.t:0 "Проникновение прервано!"
espionage.news.363.desc:0 "[This.GetNewspaperHeader]Наша команда была обнаружена и арестована. Вероятно, скомпрометированы каналы связи. Рекомендуется повысить эффективность шпионов и улучшить шифрование."
espionage.news.363.a:0 "Плохо!"

espionage.news.364.t:0 "Сопротивление победило в [From.From.GetName]"
espionage.news.364.desc:0 "[This.GetNewspaperHeader]Сопротивление, финансируемое иностранным государством, успешно реализовало план, повредив наши авиабазы."
espionage.news.364.a:0 "Надо подавить сопротивление"

espionage.news.365.t:0 "Сопротивление победило в [From.From.GetName]"
espionage.news.365.desc:0 "[This.GetNewspaperHeader]Сопротивление, финансируемое иностранным государством, успешно реализовало план, повредив наши радары."
espionage.news.365.a:0 "Надо подавить сопротивление"

espionage.news.366.t:0 "Политическое недовольство дома"
espionage.news.366.desc:0 "[This.GetNewspaperHeader]Иностранные агенты сеют недовольство: финансируют оппозицию, шантажируют членов правящей партии. Наши чиновники выступили с пресс-конференцией."
espionage.news.366.a:0 "Нужно выяснить"
 
 
espionage.news.370.t:0 "Сообщены подозрительные действия"
espionage.news.370.desc1:0 "Мы заметили подозрительные действия возле одного из гражданских промышленных объектов. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc2:0 "Мы заметили подозрительные действия возле одного из военных промышленных объектов. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc3:0 "Мы заметили подозрительные действия возле одного из заводов по производству оружия. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc4:0 "Мы заметили подозрительные действия возле одного из объектов добычи ресурсов. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc5:0 "Мы заметили подозрительные действия возле одного из военных наборных пунктов. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc6:0 "Мы заметили подозрительные действия возле одного из штабов военного планирования. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc7:0 "Мы заметили подозрительные действия возле одного из складов снабжения. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc8:0 "Мы заметили подозрительные действия возле одного из авиарадаров. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.desc9:0 "Мы заметили подозрительные действия возле одного из складов продовольствия. Мужчины с иностранным акцентом осматривали территорию и общались по рациям. Неизвестно, работают ли они на наше правительство."
espionage.news.370.a:0 "Вооружить охрану!"
espionage.news.370.b:0 "Нет повода для беспокойства"

espionage.news.371.t:0 "Враг направил подкрепления в [From.GetName]"
espionage.news.371.desc:0 "Похоже, что [From.GetAdjective] спецслужбы направили подкрепления к объекту нашей операции в [From.GetName]. Вражеские охранники замечены вблизи, ведут наблюдение и связь по рациям. Что делать?"
espionage.news.371.a:0 "Следовать первоначальному плану"
espionage.news.371.b:0 "Открыть огонь по охране"
espionage.news.371.c:0 "Отложить операцию"
espionage.news.371.d:0 "Отменить операцию"

espionage.news.372.t:0 "Враг открыл огонь по нашей охране!"
espionage.news.372.desc:0 "Подкрепления, направленные для проверки подозрительной активности, подверглись обстрелу со стороны иностранных милиций. Что делать?"
espionage.news.372.a:0 "Закрыть всю территорию на карантин"
espionage.news.372.b:0 "Есть более важные дела"

espionage.news.373.t:0 "Подозрительные лица исчезли!"
espionage.news.373.desc:0 "Подозрительная активность, о которой сообщалось ранее, пропала. Вернуть подкрепления или использовать их в другом месте?"
espionage.news.373.a:0 "Да"
espionage.news.373.b:0 "Нет, оставить их там"

espionage.news.374.t:0 "Подкрепления всё ещё на месте!"
espionage.news.374.desc:0 "Вражеские подкрепления возле цели операции всё ещё присутствуют, несмотря на перенос операции. Какие действия предпримем?"
espionage.news.374.a:0 "Следовать первоначальному плану"
espionage.news.374.b:0 "Открыть огонь по охране"
espionage.news.374.c:0 "Отменить операцию"

espionage.news.375.t:0 "Шпионов захватили в [From.GetName]"
espionage.news.375.desc:0 "После выполнения тайного плана в [From.GetName] и повреждений, достигнутых нашими шпионами, [From.GetAdjective] спецслужбы прислали подкрепления и заблокировали возвращение шпионов."
espionage.news.375.a:0 "Зато мы достигли цели!"

espionage.news.376.t:0 "Происходит подозрительная встреча"
espionage.news.376.desc1:0 "Сообщено о подозрительной встрече в столице. Лидеры сопротивления встречаются с иностранцами. Неизвестно, что обсуждают."
espionage.news.376.desc2:0 "Сообщено о подозрительной встрече в столице. Лидеры изоляционистского движения встречаются с иностранцами. Неизвестно, что обсуждают."
espionage.news.376.desc3:0 "Сообщено о подозрительной встрече в столице. Ученые встречаются с иностранцами. Неизвестно, что обсуждают."
espionage.news.376.desc4:0 "Сообщено о подозрительной встрече в столице. Политики [Root.GetAdjective] партий встречаются с иностранцами. Неизвестно, что обсуждают."
espionage.news.376.a:0 "Отправить военную полицию"
espionage.news.376.b:0 "Нас это не касается"

espionage.news.377.t:0 "Эскалация в [From.GetName]"
espionage.news.377.desc1:0 "Наши агенты в [From.GetName] окружены [From.GetAdjective] охраной, отправленной расследовать встречу с лидерами сопротивления. Что делать?"
espionage.news.377.desc2:0 "Наши агенты в [From.GetName] окружены [From.GetAdjective] охраной, расследующей встречу с лидерами изоляционистского движения. Что делать?"
espionage.news.377.desc3:0 "Наши агенты в [From.GetName] окружены [From.GetAdjective] охраной, расследующей встречу с учеными. Что делать?"
espionage.news.377.desc4:0 "Наши агенты в [From.GetName] окружены [From.GetAdjective] охраной, расследующей встречу с политиками. Что делать?"
espionage.news.377.a:0 "Использовать поддельные документы"
espionage.news.377.b:0 "Открыть огонь и уйти"

espionage.news.378.t:0 "Операция в [From.GetName] завершена успешно!"
espionage.news.378.desc:0 "[This.GetNewspaperHeader]Наши шпионы успешно выполнили запланированную тайную операцию в [From.GetName]. Враг не знает, кто за этим стоит."
espionage.news.378.a:0 "Ждите новых новостей!"

espionage.news.379.t:0 "[From.GetAdjective] шпионы захвачены до побега!"
espionage.news.379.desc:0 "[This.GetNewspaperHeader]После окружения территории мы захватили [From.GetAdjective] шпионов, ответственных за нападения на наших охранников. Захват даёт дипломатическое преимущество."
espionage.news.379.a:0 "Заключить в тюрьму"

espionage.news.380.t:0 "[From.GetLeader] предлагает сделку"
espionage.news.380.desc:0 "[From.GetLeader] из [From.GetName] пишет нам предложение:\n\nМы освобождаем §H[?Root.Spies_Demand]§! их шпионов.\n\nВзамен:\n\nОсвобождают [?Root.Spies_Offer] наших шпионов.\nДают нам [?Root.equipment_offer]K пехотного оборудования."
espionage.news.380.a:0 "Принять сделку"
espionage.news.380.b:0 "Отклонить сделку"

espionage.news.381.t:0 "[From.GetName] начал операцию по спасению шпионов"
espionage.news.381.desc:0 "[This.GetNewspaperHeader]Перехвачено сообщение, что [From.GetName] начали операцию по спасению своих шпионов. Что делать?"
espionage.news.381.a:0 "Ничего не предпринимать"
espionage.news.381.b:0 "Отправить наземное подкрепление"
espionage.news.381.c:0 "Отправить воздушное подкрепление"
espionage.news.381.d:0 "Отправить наземное и воздушное подкрепление"

espionage.news.382.t:0 "[From.GetName] направили подкрепление против нашей операции"
espionage.news.382.desc:0 "[From.GetName] направили подкрепление. Что делать?"
espionage.news.382.a:0 "Ничего не предпринимать"
espionage.news.382.b:0 "Отправить воздушное подкрепление"
espionage.news.382.c:0 "Прервать миссию"

espionage.news.383.t:0 "Мы успешно отразили попытку [From.GetName] спасти шпионов"
espionage.news.383.desc:0 "[This.GetNewspaperHeader][From.GetName] пытались спасти своих шпионов. Операция провалилась. Мы переместим заключённых в секретное место."
espionage.news.383.a:0 "Отлично"

espionage.news.384.t:0 "Операция Eiche успешна в [From.GetName]"
espionage.news.384.desc:0 "[This.GetNewspaperHeader]Мы успешно проникли в логово врага и спасли наших шпионов. Они вернулись домой."
espionage.news.384.a:0 "Отлично"

espionage.news.385.t:0 "Операция Eiche провалена в [From.GetName]"
espionage.news.385.desc:0 "[This.GetNewspaperHeader]Наша операция по спасению шпионов в [From.GetName] провалилась. Наши люди были подавлены врагом. Нужно подготовить лучший план в следующий раз."
espionage.news.385.a:0 "Жаль"

espionage.news.386.t:0 "[From.GetName] успешно спасли своих шпионов"
espionage.news.386.desc:0 "[This.GetNewspaperHeader][From.GetName] проникли в наши оборонительные позиции с парашютистами и морскими дивизиями и спасли своих шпионов."
espionage.news.386.a:0 "Жаль"

espionage.news.387.t:0 "Мы успешно отразили попытку [From.GetName] спасти шпионов"
espionage.news.387.desc:0 "[This.GetNewspaperHeader][From.GetName] пытались спасти своих шпионов. Мы успешно отразили операцию и переместим заключённых в новое секретное место."
espionage.news.387.a:0 "Отлично"

espionage.news.388.t:0 "[From.GetName] успешно спасли своих шпионов"
espionage.news.388.desc:0 "[This.GetNewspaperHeader][From.GetName] проникли в наши оборонительные позиции и спасли своих шпионов."
espionage.news.388.a:0 "Жаль"

espionage.news.389.t:0 "Операция Eiche успешна в [From.GetName]"
espionage.news.389.desc:0 "[This.GetNewspaperHeader]Мы успешно проникли в логово врага и спасли наших шпионов. Они вернулись домой."
espionage.news.389.a:0 "Отлично"

espionage.news.390.t:0 "Операция Eiche провалена в [From.GetName]"
espionage.news.390.desc:0 "[This.GetNewspaperHeader]Наша операция по спасению шпионов в [From.GetName] провалилась. Наши люди были подавлены врагом. Нужно подготовить лучший план в следующий раз."
espionage.news.390.a:0 "Жаль"

espionage.news.391.t:0 "[From.GetLeader] принял наше предложение"
espionage.news.391.desc:0 "[This.GetNewspaperHeader][From.GetLeader] принял наши условия. Это выгодно обеим странам. Наши шпионы возвращаются домой, оборудование отправлено."
espionage.news.391.a:0 "Отлично"

espionage.news.392.t:0 "[From.GetLeader] отклонил наше предложение"
espionage.news.392.desc:0 "[This.GetNewspaperHeader][From.GetLeader] отклонил предложение без объяснения причин. Возможно, нужно действовать более агрессивно и спасти шпионов силой."
espionage.news.392.a:0 "Жаль"

espionage.news.393.t:0 "Мы отразили иностранную тайную операцию!"
espionage.news.393.desc:0 "[This.GetNewspaperHeader][From.GetName] пытались выполнить тайную операцию на нашей территории. Благодаря защите, мы выявили заговор и арестовали всех шпионов. Они подчинялись [From.GetAdjective] секретной службе."
espionage.news.393.a:0 "[From.GetName] за это заплатит!"

  
  
ARM_THE_GUARDS:0 "\nЭто действие потребует Пехотное снаряжение.\n"
CAPTURE_BEFORE_ESCAPE:0 "Мы заключаем §H100§! [From.GetAdjective] £шпиона."
CAPTURE_TOOLTIP:0 "Мы заключаем §H100§! Иностранного £шпиона."

Letter_Content:0 "\n\nМы ожидаем от вас:\n\nОсвободить               [?ROOT.Spies_Demand@ROOT.show_Negotiate_Release] наших шпионов, находящихся в заключении в вашей стране.\n\nВ обмен мы предлагаем следующее:\n\n               [?ROOT.Spies_Offer@ROOT.show_Negotiate_Release] ваших шпионов, возвращённых в вашу страну.\n\n               [?Equipment_Offer@ROOT.show_Negotiate_Release] пехотного снаряжения для доставки вам.\n\nМы надеемся оставить эту тяжёлую главу истории позади и начать новую эру сотрудничества и взаимного уважения между [?ROOT.show_Negotiate_Release.GetName] и [Root.GetName].\n                                                                              [Root.GetLeader]"

Letter_Header:0 "Я, [Root.GetLeader] из [Root.GetName], обращаюсь к вашему превосходительству с попыткой договориться об освобождении наших шпионов, находящихся в заключении в вашей стране."

Deal_Favorability:0 "§H[?ROOT.Deal_Favorability@ROOT.show_Negotiate_Release]§!"
DEAL_FAVORABILITY_TOOLTIP:0 "Эта сделка должна иметь положительную благосклонность, чтобы ИИ её принял. Не применяется к игрокам-человекам.\n\nНа это также влияет:\nМнение о нас: §H[?ROOT.show_Negotiate_Release:Opinion@ROOT]§!"

Mission_Confirmation:0 "Вы желаете попробовать этот скрытный план в\n§H[?ROOT.show_Mission_Confirmation.GetNameWithFlag]§!?: [OperationType]"

SUCCESS_CHANCE_TOOLTIP:0 "Базовый шанс успеха этой миссии в данный момент: §H[?ROOT.Success_Chance@PREV]%§!.\n\nРасчёт производится следующим образом:\n\nБазовый шанс (§H[?ROOT.base_of_this@PREV]§!) x (§H[Root.GetAdjective]§! эффективность шпиона ÷ §H[From.GetAdjective]§! эффективность шпиона) ÷ 1.5 - §H[From.GetAdjective]§! контрразведка в §H[Root.GetName]§!.\n\nБазовый шанс успеха не окончателен и может быть увеличен или уменьшен в ходе событий после начала операции."

PROCEED_WITH_PLAN:0 "§HСкрытный подход:§!\nШанс успеха операции в §H[From.GetName]§! уменьшен на §H15%§!, но план будет выполнен. В случае успеха шпионы не будут захвачены."

OPEN_FIRE:0 "§HАгрессивный подход:§!\nШанс успеха операции в §H[From.GetName]§! увеличен на §H10%§!. Однако даже при успехе, использование боевых патронов может вызвать подкрепление, что даст нашим шпионам §H50%§! шанс быть §Rзахваченными§! (этот шанс может увеличиваться в зависимости от реакции противника)."

LOCKDOWN_TOOLTIP:0 "Это увеличит шанс захвата вражеских шпионов, участвующих в действии, с §H50%§! до §H90%§!."

TARGETS_MAXED:0 "Добавить §H100§! £шпионов в нашу сеть в §H[From.GetNameWithFlag]§!.\n\nВ настоящее время у нас §R[?ROOT.networks_used]/5§! сетей за рубежом. Если достигнем лимита в 5, придётся отзывать шпионов из одной страны для создания новых сетей.\n\nАктивные сети развернуты в следующих странах:\n[?ROOT.network1_target.GetNameWithFlag]\n[?ROOT.network2_target.GetNameWithFlag]\n[?ROOT.network3_target.GetNameWithFlag]\n[?ROOT.network4_target.GetNameWithFlag]\n[?ROOT.network5_target.GetNameWithFlag]"

DECREASE_NETWORK:0 "[Being_Disrupted]Отозвать §H100§! £шпионов из §H[From.GetNameWithFlag]§!" 

INCREASE_TRANSPORT_TOOLTIP:0 "Назначить 5 транспортных самолётов для этой миссии.\n\nВ настоящее время у нас §H[?ROOT.show_Operation_Eiche:Spies_Captured@ROOT]§! £шпионов захвачено в §H[?ROOT.show_Operation_Eiche.GetName]§! и §H[?ROOT.paratroopers_eiche@ROOT.show_Operation_Eiche]§! парашютных дивизий назначено на миссию.\n\nВсего нужно как минимум §H[?ROOT.transport_needed@ROOT.show_Operation_Eiche]§! самолётов для транспортировки парашютистов и спасённых шпионов."

SPIES_CAPTURED:0 "§H[?PREV.Spies_Captured@ROOT]§! наших £шпионов в настоящее время заключены в §H[Prev.GetNameWithFlag]§!"

EICHE_CHANCE_TOOLTIP:0 "Наш шанс успеха рассчитывается так:\n(§HЗахваченные £шпионы §! ÷ -5) ÷ (§H[Root.GetAdjective]§! эффективность шпиона ÷ §H[?ROOT.show_Operation_Eiche.GetAdjective]§! эффективность шпиона)\n\nК этому добавляются следующие факторы:\nНазначенные парашютные дивизии: §G[?ROOT.paratroopers_bonus@ROOT.show_Operation_Eiche]§!\nНазначенные морские дивизии: §G[?ROOT.marines_bonus@ROOT.show_Operation_Eiche]§!\nШтраф за нехватку транспорта: §R[?ROOT.transport_penalty@ROOT.show_Operation_Eiche]§!\nШтраф за нехватку конвоев: §R[?ROOT.convoy_penalty@ROOT.show_Operation_Eiche]§!\n\nЭто значение не окончательное и может изменяться в ходе событий после начала операции."

DECREASE_TRANSPORT_TOOLTIP:0 "Отменить назначение §H5§! транспортных самолётов с миссии.\n\nВ настоящее время у нас §H[?ROOT.show_Operation_Eiche:Spies_Captured@ROOT]§! £шпионов захвачено в §H[?ROOT.show_Operation_Eiche.GetName]§! и §H[?ROOT.paratroopers_eiche@ROOT.show_Operation_Eiche]§! парашютных дивизий назначено.\n\nВсего нужно как минимум §H[?ROOT.transport_needed@ROOT.show_Operation_Eiche]§! самолётов."

INCREASE_CONVOY_TOOLTIP:0 "Назначить §H5§! конвоев для этой миссии.\n\nВ настоящее время у нас §H[?ROOT.marines_eiche@ROOT.show_Operation_Eiche]§! морских дивизий назначено. Нам потребуется §H[?ROOT.convoy_needed@ROOT.show_Operation_Eiche]§! конвоев для транспортировки."

DECREASE_CONVOY_TOOLTIP:0 "Отменить назначение §H5§! конвоев.\n\nВ настоящее время у нас §H[?ROOT.marines_eiche@ROOT.show_Operation_Eiche]§! морских дивизий назначено. Нам потребуется §H[?ROOT.convoy_needed@ROOT.show_Operation_Eiche]§! конвоев для транспортировки."

INCREASE_PARATROOPERS_TOOLTIP:0 "Назначить §H1§! парашютную дивизию на миссию.\n\nНам потребуется §H3000§! Пехотного снаряжения I, §H1000§! вспомогательного снаряжения и §H10,000§! человек для формирования дивизии. Также необходимо исследовать технологию Парашютисты I."

DECREASE_PARATROOPERS_TOOLTIP:0 "Отменить назначение §H1§! парашютной дивизии на миссию."

INCREASE_MARINES_TOOLTIP:0 "Назначить §H1§! дивизию морской пехоты на миссию.\n\nНам потребуется §H3000§! Пехотного снаряжения I, §H1000§! вспомогательного снаряжения и §H10,000§! человек для формирования дивизии. Также необходимо исследовать технологию Морская пехота I."

DECREASE_MARINES_TOOLTIP:0 "Отменить назначение §H1§! дивизии морской пехоты на миссию."

Recent_Attempt:0 "§RЭта страна уже подвергалась скрытной операции (нами или иностранной страной) за последние 60 дней. Нужно дождаться окончания кулдауна.§!"

Being_Disrupted:0 "§RМы не можем распустить нашу сеть в этой стране, пока не истекут последствия последней скрытной операции.§!\n"

INITIATE_EICHE:0 "Начать операцию Eiche (должен быть положительный шанс успеха)."

Counter_Espionage_Non_Active:0 "Назначьте сеть шпионов для контр-операций в §H[From.GetNameWithFlag]§! снижая шанс успеха их скрытных операций против нас на §G15%§!.\n\n§RВы не сможете проводить другие скрытные операции, пока это активно§!"

Counter_Espionage_Active:0 "Наша сеть шпионов в настоящее время назначена на контр-операции в [From.GetNameWithFlag]§!, снижая шанс успеха их скрытных операций против нас на §G15%§!.\nНажмите снова, чтобы отключить.\n\n§RВы не сможете проводить другие скрытные операции, пока это активно§!"

