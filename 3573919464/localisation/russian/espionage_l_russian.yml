WAR_PROPAGANDA_TOOLTIP:0 "Вам нужно 50 £spy_xp, чтобы открыть эту миссию.\n§HНаправление вашего агентства должно быть как минимум уровня 2. Шпионы, назначенные на эту миссию, будут распространять пропаганду для увеличения поддержки войны по всей стране."
RESEARCH_AID_TOOLTIP:0 "Вам нужно 50 £spy_xp, чтобы открыть эту миссию.\n§HНаправление вашего агентства должно быть как минимум уровня 2. Шпионы, назначенные на эту миссию, будут собирать разведданные о научных исследованиях других стран и предоставлять их нашим исследовательским институтам для продвижения научного прогресса."
SUPPRESS_RESISTANCE_TOOLTIP:0 "Вам нужно 50 £spy_xp, чтобы открыть эту миссию.\n§HНаправление вашего агентства должно быть как минимум уровня 2. Шпионы, назначенные на эту миссию, будут работать над проникновением и разрушением фракций сопротивления внутри нашей страны."
FREIWILLIGE_PROGRAM_TOOLTIP:0 "Вам нужно 50 £spy_xp, чтобы открыть эту миссию.\n§HНаправление вашего агентства должно быть как минимум уровня 3. Шпионы, назначенные на эту миссию, будут искать и вербовать энтузиастов войны, которые разделяют наши взгляды в некоревых территориях."

STUDY_TECHNOLOGY_SPIES_TOOLTIP:0 "Назначьте §H200§! £spy для изучения технологий цели внедрения и накопления очков исследований, которые можно использовать для копирования моделей юнитов."
RESEARCH_POINTS_TOOLTIP:0 "В настоящее время у вас есть §H[?research_points]§! £research_points, которые можно использовать для воссоздания моделей юнитов текущей цели внедрения.\nЭти очки исследований можно использовать §RТОЛЬКО§! на этой §Rконкретной§! цели."
LIGHT_ARMOR_TOOLTIP:0 "§HИзучение технологий лёгкой бронетехники противника§!\n\nДля разблокировки этой модели нужно §H500§! £research_points.\nДоступная версия: §H[?enemy_light_armor_year]§! версия\n\nЭта операция будет §RВОЗМОЖНА§! только если технологический уровень этой модели противника на один уровень выше."
