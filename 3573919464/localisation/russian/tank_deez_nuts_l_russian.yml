### Шасси механизированной пехоты ###

mech_chassis_1:0 "Изначальное шасси механизированного оборудования"
mech_chassis_1_short:0 "Шасси мехпехоты"
mech_chassis_2:0 "Шасси пехотного полугусеничного транспорта"
mech_chassis_2_short:0 "Полугус. шасси"
mech_chassis_2_desc:0 "Ранние механизированные пехотные подразделения использовали разнообразные конструкции: усиленные колесные грузовики или гусеничные машины, защищающие экипаж от стрелкового оружия. Полугусеничный дизайн — компромисс между гусеничным и колесным транспортом, сочетая универсальность и скорость. Опыт боевых действий также повлиял на оснащение полугусеничек средствами самозащиты, включая пулемёты и смотровые отверстия для стрелков."

mech_chassis_3:0 "Улучшенное полугусеничное шасси пехоты"
mech_chassis_3_short:0 "Ул. полугус. шасси"
mech_chassis_3_desc:0 "Продолжение существующих полугусеничных проектов, улучшенное новыми двигателями и схемами защиты. Несмотря на сомнения, эти полугусеничные конструкции достигли вершины линии развития транспортных средств для пехоты."

mech_chassis_x:0 "Шасси бронетранспортёра"
mech_chassis_x_short:0 "БТР шасси"
mech_chassis_x_desc:0 "С ростом скорости и надёжности гусеничных машин эпоха полугусеничек фактически закончилась. Новые транспортёры полностью гусеничные и закрытые, обеспечивая максимальную защиту и оптимальную мобильность."

mech_chassis_x_2:0 "Шасси боевой машины пехоты"
mech_chassis_x_2_short:0 "БМП шасси"
mech_chassis_x_2_desc:0 "Отличаются от обычных БТР, предназначены как специализированные боевые платформы с турельным тяжёлым оружием. Жертвуют частью пассажировместимости ради огневой мощи, подходят для городского боя и могут изменить мехвойну."

