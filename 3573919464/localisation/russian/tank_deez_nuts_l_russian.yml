### МОДУЛИ ###
car_4x4_suspension:0 "Привод на 4 колеса"
car_4x4_suspension_desc:0 "4 колеса обеспечивают большую скорость и простоту производства, делая разведывательную машину быстрой и маневренной."
car_6x6_suspension:0 "Привод на 6 колес"
car_6x6_suspension_desc:0 "6 колес медленнее, но лучше управляются, подходят для поддержки пехоты и охоты на партизан."
car_8x8_suspension:0 "Привод на 8 колес"
car_8x8_suspension_desc:0 "Конфигурация 8x8 приближает бронеавтомобиль к танкам, улучшает контроль и эффективность засады."

car_riveted_armor:0 "Заклепанная броня"
car_riveted_armor_desc:0 ""
car_welded_armor:0 "Сварная броня"
car_welded_armor_desc:0 "Сварка стальных плит требует времени и квалифицированных рабочих, но дает более прочную броню."

car_flat_armor:0 "Прямолинейная броня"
car_flat_armor_desc:0 "Популярна в межвоенный период, проста в производстве, обеспечивает простор для экипажа."

car_semi-flat_armor:0 "Полуплоская броня"
car_semi-flat_armor_desc:0 "Компромисс между наклонной и плоской броней: в некоторых местах угол крутой для защиты, в других плоская для удобства монтажа."

car_sloped_armor:0 "Наклонная броня"
car_sloped_armor_desc:0 "Наклонная броня для бронеавтомобилей."

car_oscillating_turret:0 "Колеблющаяся башня"
car_oscillating_turret_desc:0 "Башня на петлях для наведения орудия, облегчает установку автозагрузки и большего калибра, но снижает броню из-за конструкции."

car_open_top_turret:0 "Башня с открытым верхом"
car_open_top_turret_desc:0 "Открытый верх облегчает установку крупного орудия, снижает вес и стоимость производства."

car_one_man_tank_turret:0 "Башня на 1 человека"
car_one_man_tank_turret_desc:0 "Башня, рассчитанная на одного человека для управления и стрельбы."

car_two_man_tank_turret:0 "Башня на 2 человека"
car_two_man_tank_turret_desc:0 "Башня, рассчитанная на двух человек."

car_three_man_tank_turret:0 "Башня на 3 человека"
car_three_man_tank_turret_desc:0 "Башня, рассчитанная на трех человек."

car_nft_one_man_tank_turret:0 "Башня на 1 человека, закрепленная на корпусе"
car_nft_one_man_tank_turret_desc:0 ""

car_nft_two_man_tank_turret:0 "Башня на 2 человека, закрепленная на корпусе"
car_nft_two_man_tank_turret_desc:0 "Размещение главного орудия в каземате позволяет ставить более крупные пушки. (Изображение: Banznerfahrer, CC BY-SA 3.0)"

car_nft_three_man_tank_turret:0 "Башня на 3 человека, закрепленная на корпусе"
car_nft_three_man_tank_turret_desc:0 ""

car_rocket_launcher:0 "Ракетная установка"
car_rocket_launcher_desc:0 "Эффективна против пехоты и морального духа, но малоэффективна против брони."

car_machine_gun:0 "Пулемет"
car_flamethrower:0 "Огнемет"
car_auto_cannon:0 "Автоматическая пушка"
car_auto_cannon_2:0 "Улучшенная автоматическая пушка"

car_small_cannon:0 "Малое орудие"
car_small_cannon_2:0 "Улучшенное малое орудие"
car_small_cannon_3:0 "Передовое малое орудие"
car_small_cannon_3_desc:0 "Малое и дешевое орудие, стреляет по пехоте и броне, но малый калибр ограничивает эффективность."

car_small_cannon_4:0 "Современное малое орудие"
car_small_cannon_4_desc:0 "Малое и дешевое орудие, стреляет по пехоте и броне, но малый калибр ограничивает эффективность."

