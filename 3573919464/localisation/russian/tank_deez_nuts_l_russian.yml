### Приводы башен ###
power_handcranked_turret: "Башня с ручным приводом"
power_handcranked_turret_desc: "Башня, поворачиваемая вручную. Не ставьте тяжёлую башню!"

power_assisted_turret: "Электропривод с ручным доворотом"
power_assisted_turret_desc: "Башня вращается электродвигателями на полной скорости, но тонкая настройка всё ещё делается вручную, ограничивая скорость реакции."

power_full_electric_turret: "Электрическая башня"
power_full_electric_turret_desc: "Башня полностью вращается электродвигателями, позволяя быстро поворачивать, но дорого в производстве."

power_modern_hull_electric_turret: "Современный электрический привод башни"
power_modern_hull_electric_turret_desc: "Современные электрические приводы позволяют башне поворачиваться крайне быстро, даже если башня тяжёлая."

### ПТУР и улучшения ###
mech_atgm_upgrade: "Улучшение тандемным зарядом (GLATGM)"
mech_atgm_upgrade_desc: "GLATGM с двумя кумулятивными зарядами. Первый заряд активирует ERA заранее, позволяя второму пробивать броню напрямую. Может быть неэффективно против композитной брони."

anti_tank_guided_missiles_upgrade:0 "Дополнительные ПТУР с тандемным зарядом"
anti_tank_guided_missiles_desc:0 "Проводные ракеты, управляемые стрелком через адаптированный джойстик, значительно увеличивают шанс первого выстрела на дистанции. Используют тандемный HEAT-заряд, улучшая противотанковую эффективность и позволяя преодолевать ранние ERA. Однако новейшая композитная броня может быть способна остановить их."

mech_atgm_1: "Пусковая установка ПТУР"
mech_atgm_1_desc: "$anti_tank_guided_missiles_mech_desc$"

mech_atgm_2: "Пусковая установка тандемных ПТУР"
mech_atgm_2_desc:0 "Проводные ракеты, управляемые стрелком через адаптированный джойстик, значительно увеличивают шанс первого выстрела на дистанции. Используют тандемный HEAT-заряд, улучшая противотанковую эффективность и позволяя преодолевать ранние ERA. Однако новейшая композитная броня может быть способна остановить их."
