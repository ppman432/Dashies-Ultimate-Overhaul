### МОДУЛИ ОБОРУДОВАНИЯ ###
tank_hydrostatic_engine:0 "Гидростатический привод"
tank_hydrostatic_engine_desc:0 "Хотя это трансмиссия, требуется специализированный двигатель, повышающий скорость башни и движения танка, при меньшем расходе топлива."

tank_horstmann_suspension:0 "Подвеска Хорстманна"
tank_horstmann_suspension_desc:0 "Подобно подвеске Кристи, распределяет вес на несколько колес, позволяя устанавливать тяжелое оборудование."

tank_hydropneumatic_suspension:0 "Гидропневматическая подвеска"
tank_hydropneumatic_suspension_desc:0 "Сложная подвеска: колеса поднимаются на неровностях, обеспечивая более точный огонь и защитные позиции на пересеченной местности."

flat_armor:0 "Прямолинейная броня"
flat_armor_desc:0 "Популярна между войнами, проста в производстве, обеспечивает простор в корпусе для экипажа."

semi-flat_armor:0 "Полуплоская броня"
semi_flat_armor_desc:0 "Компромисс между плоской и наклонной броней: в некоторых местах угол крутой, повышая эффективность, а в других плоская броня облегчает монтаж частей."

sloped_armor_zwei:0 "Экстремально наклонная броня"
sloped_armor_zwei_desc:0 "Снаряды рикошетят от корпуса, но условия для экипажа стесненные, сложнее размещать важные части, стоимость ниже."

tank_db_two_man_light_tank_turret:0 "Башня на 2 человека"
tank_db_two_man_light_tank_turret_desc:0 "."

tank_db_three_man_light_tank_turret:0 "Башня на 3 человека"
tank_db_three_man_light_tank_turret_desc:0 "."

tank_db_three_man_medium_tank_turret:0 "Башня на 3 человека"
tank_db_three_man_medium_tank_turret_desc:0 "."

tank_db_three_man_heavy_tank_turret:0 "Башня на 3 человека"
tank_db_three_man_heavy_tank_turret_desc:0 "."

tank_db_four_man_heavy_tank_turret:0 "Башня на 4 человека"
tank_db_four_man_heavy_tank_turret_desc:0 "."

tank_air_one_man_tank_turret:0 "Башня на 1 человека"
tank_air_one_man_tank_turret_desc:0 "Достаточно легкая для одного члена экипажа, может перевозиться самолетами."

tank_air_two_man_tank_turret:0 "Башня на 2 человека"
tank_air_two_man_tank_turret_desc:0 "Легкая башня для двух членов экипажа, может перевозиться самолетами."

add_on_armor_turret:0 "Дополнительная броня башни"
add_on_armor_turret_desc:0 "Толстые плиты можно приклепать или приварить к существующей башне, повышая защиту экипажа."

oscillating_turret:0 "Колеблющаяся башня"
oscillating_turret_desc:0 "Верхняя часть башни движется целиком для наведения орудия, облегчая установку большего калибра и автозагрузки."

open_top_turret:0 "Башня с открытым верхом"
open_top_turret_desc:0 "Открытый верх облегчает установку крупного орудия, снижает вес и стоимость производства."

exp_rangefinder_turret:0 "Башня с дальномером"
exp_rangefinder_turret_desc:0 "Стереоскопический дальномер облегчает измерение дальности до цели."

internal_machine_gun:0 "Встроенный пулемет"
internal_machine_gun_desc:0 "Позволяет вести огонь по пехоте, не подвергая экипаж опасности."

ostketten:0 "Гусеницы с грунтозацепами"
ostketten_desc:0 "Увеличивают сцепление на рыхлых поверхностях, например, на снегу или грунте."

zimmerit:0 "Паста Циммерит"
zimmerit_desc:0 "Паста против магнитных мин. Состав: 40% сульфат бария, 25% поливинилацетат, 15% пигмент, 10% сульфид цинка, 10% опилки. Сделано в Германии."

schmalturm_turret:0 "Башня Schmalturm"
schmalturm_turret_desc:0 "Поздняя немецкая стандартизированная башня для Panther Ausf. F, Panzer IV (неудачная версия) и легкого Leopard, а также серии E. Имеет дальномер и щит орудия, похожий на Ferdinand. В массовое производство не поступала."
