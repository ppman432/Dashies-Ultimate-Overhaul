### Типы гусениц ###
tank_steel_tracks_0:0 "Базовые стальные гусеницы"
tank_steel_tracks_0_desc:0 "Простые стальные гусеницы, надежные и способные передвигаться по сложной местности."
tank_steel_tracks_1:0 "Улучшенные стальные гусеницы"
tank_steel_tracks_1_desc:0 "Улучшенные соединения гусениц облегчают ремонт и повышают прочность."
tank_steel_tracks_2:0 "Передовые стальные гусеницы"
tank_steel_tracks_2_desc:0 "Сталь склонна к расширению и растрескиванию в жарком климате. Улучшенный процесс производства позволяет выдерживать более суровые условия."
tank_steel_tracks_3:0 "Современные стальные гусеницы"
tank_steel_tracks_3_desc:0 "Современные стальные гусеницы дешевле и проще в производстве, чем когда-либо."

tank_rubber_tracks_1:0 "Базовые резиновые гусеницы"
tank_rubber_tracks_1_desc:0 "Неортодоксальный выбор для танка, резиновые гусеницы менее надежны, не выдерживают большой вес, но быстрее и проще в производстве."
tank_rubber_tracks_2:0 "Улучшенные резиновые гусеницы"
tank_rubber_tracks_2_desc:0 "Недостаток резины в том, что при повреждении весь элемент подлежит замене, но сегментация решает эту проблему."
tank_rubber_tracks_3:0 "Передовые резиновые гусеницы"
tank_rubber_tracks_3_desc:0 ""

tank_padded_tracks_1:0 "Базовые гусеницы с накладками"
tank_padded_tracks_1_desc:0 "Комбинируя преимущества резины и стали, на стальные пластины накладываются резиновые накладки, снижая недостатки резиновых гусениц."
tank_padded_tracks_2:0 "Улучшенные гусеницы с накладками"
tank_padded_tracks_2_desc:0 ""
tank_padded_tracks_3:0 "Передовые гусеницы с накладками"
tank_padded_tracks_3_desc:0 ""

### СЛОТЫ МОДУЛЕЙ ОБОРУДОВАНИЯ ###
EQ_MOD_SLOT_armor_layout_slot_TITLE:0 "Компоновка брони корпуса"
EQ_MOD_SLOT_turret_mod_slot_TITLE:0 "Характеристики башни"
EQ_MOD_SLOT_special_track_slot_TITLE:0 "Тип гусениц"
