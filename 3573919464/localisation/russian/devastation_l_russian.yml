l_russian:

# Решения
devastation_decisions: "Смягчение разрушений"
devastation_decisions_desc: "Смягчение разрушений в государствах важно как для устойчивости в военное время, так и для долгосрочного мира. Во время войны снижение разрушений помогает поддерживать национальную стабильность, мораль населения и обеспечивает функционирование критической инфраструктуры. В мирное время ликвидация разрушений необходима для экономического восстановления, благополучия населения и предотвращения будущей нестабильности, позволяя нации эффективнее восстанавливаться и развиваться."

devastation_emergency_repairs: "Аварийный ремонт"
devastation_emergency_repairs_desc: "Отправьте ремонтные бригады для восстановления критической инфраструктуры, такой как дороги, мосты и линии электропередач, чтобы поддерживать военные усилия."

devastation_evacuation_orders: "Приказы на эвакуацию"
devastation_evacuation_orders_desc: "Осуществите масштабную эвакуацию гражданского населения из сильно бомбардируемых или обстреливаемых районов, чтобы минимизировать потери и поддержать мораль."

devastation_rapid_response_teams: "Команды быстрого реагирования"
devastation_rapid_response_teams_desc: "Разверните команды быстрого реагирования для немедленного устранения и контроля повреждений после ударов противника, сосредотачиваясь на тушении пожаров, оказании медицинской помощи и аварийной инженерии."

devastation_national_infrastructure_investment: "Восстановление национальной инфраструктуры"
devastation_national_infrastructure_investment_desc: "Инвестируйте в восстановление критической инфраструктуры для возобновления транспортных сетей и коммунальных служб в пострадавших государствах."

devastation_relief_fund_allocation: "Выделение средств на помощь"
devastation_relief_fund_allocation_desc: "Выделите средства для оказания немедленной помощи и ресурсов наиболее пострадавшим регионам."

devastation_public_works_initiative: "Программа общественных работ"
devastation_public_works_initiative_desc: "Запустите масштабную программу общественных работ, направленную на трудоустройство безработных и восстановление разрушенных районов."

devastation_funding_allies: "Финансирование §Y[FROM.GetAdjective]§! ремонтов"
devastation_funding_allies_desc: "Отправьте помощь нашим [FROM.GetAdjective] союзникам для восстановления разрушений в их государствах."
devastation_funding_allies_tt: "§RНет [FROM.GetAdjective] пострадавших государств!§!"
devastation_funding_allies_cancel_trigger: "Мнение [FROM.GetFlag] §Y[FROM.GetNameDefCap]§! ниже §Y50§! и не является союзником [ROOT.GetFlag] §Y[ROOT.GetNameDefCap]§!"

# Неассимилированные населения
assimilation_decisions: "Неассимилированное население"
assimilation_decisions_desc: "По мере роста разрушений по землям, §Yбеженцы§! будут покидать эти районы и искать новое место для жизни. Попав в нашу страну, они пополняют §Oнеассимилированное население§!. Мы можем §Gассимилировать§! этих §Yбеженцев§! для консолидации населения в наших основных государствах либо постепенно, либо через целенаправленные политические усилия. Мы также можем их выслать, если они окажутся чрезмерной нагрузкой для аппарата государства.\n\nНа данный момент общее §Oнеассимилированное население§! составляет §R[?country_unassimilated_pops|2]K§!, что составляет §Y[CountryUnassimilatedPopsRatio]§! от нашего §Cосновного населения§! в §C[?country_core_population_controlled]K§!.\n\nКаждые §Y0.1%§! дают штраф §R[?global.unassimilated_stability_factor]%§! к §Yстабильности§!. Мы получаем [?country_unassimilated_pops_modifier^0|+2%] §Yфактор стабильности§! из-за этого.\n\nОбщее число §Oвнешних беженцев§!, прибывших в нашу страну с начала игры, составляет §Y[?total_external_refugees_in_game|2]K§!, из которых §G[?total_external_refugees_assimilated_in_game|2]K§! были §Gассимилированы§!, а §R[?total_external_refugees_expelled_in_game|2]K§! — высланы."

assimilation_passive_decision: "Пассивная ассимиляция беженцев"
assimilation_passive_decision_desc: "Неассимилированное население будет постепенно ассимилироваться и добавляться в ресурсный пул штатов."
assimilation_passive_decision_tt: "Случайное количество §Oнеассимилированного населения§! между §Y[?assimilate_unassimilated_pops_min|0%]§! и §Y[?assimilate_unassimilated_pops_max|0%]§! в каждом штате с §Oнеассимилированным населением§! будет §Gассимилировано§!."

assimilation_nationwide_drive_decision: "Общенациональная кампания по ассимиляции"
assimilation_nationwide_drive_decision_desc: "Ассимилируйте беженцев во всех наших подконтрольных штатах."
assimilation_nationwide_drive_decision_tt: "Случайное количество §Oнеассимилированного населения§! между §Y[?assimilate_unassimilated_pops_min|0%]§! и §Y[?assimilate_unassimilated_pops_max|0%]§! в каждом штате с §Oнеассимилированным населением§! будет §Gассимилировано§!."

assimilation_expel_decision: "Высылка беженцев"
assimilation_expel_decision_desc: "Выселите неассимилированных беженцев из всех подконтрольных штатов."
assimilation_expel_decision_tt: "Случайное количество §Oнеассимилированного населения§! между §Y[?assimilate_expel_pops_min|0%]§! и §Y[?assimilate_expel_pops_max|0%]§! в каждом штате с §Oнеассимилированным населением§! будет §Rвыслано§!."

