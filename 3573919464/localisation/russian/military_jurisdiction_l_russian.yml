strict_ethics:0 "Строгая Этика"
strict_ethics_desc:0 "От вооружённых сил ожидается строгая этика. Подразделения контролируются, законы войны и этика строго соблюдаются."
code_of_honour:0 "Кодекс Чести"
code_of_honour_desc:0 "Вооружённые силы действуют по кодексу чести, который уважает базовые права человека и достоинство."
no_supervision:0 "Без Надзора"
no_supervision_desc:0 "Вооружённые силы не имеют надзора или ограничений, милость предоставляется индивидуально каждому солдату."
