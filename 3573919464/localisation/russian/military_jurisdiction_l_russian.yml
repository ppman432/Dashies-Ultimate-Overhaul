support_roles:0 "Роли Поддержки"
support_roles_desc:0 "Женщины допускаются к службе в ролях боевой поддержки."
non_combat_roles:0 "Не Боевые Роли"
non_combat_roles_desc:0 "Женщины допускаются к службе, но только в небоевых ролях."
service_prohibited:0 "Служба Запрещена"
service_prohibited_desc:0 "Женщинам запрещена служба в вооружённых силах."

advanced_training:0 "Продвинутое Обучение"
