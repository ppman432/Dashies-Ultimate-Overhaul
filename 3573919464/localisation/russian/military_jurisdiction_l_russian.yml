merciless_desc:0 "Армия действует без учёта гуманитарного права или прав человека."
encouraged_brutality:0 "Поощряемая Жестокость"
encouraged_brutality_desc:0 "Жестокость в этой армии поощряется."

non_core_recruitment_prohibited:0 "Набор Неродовых Граждан Запрещён"
non_core_recruitment_prohibited_desc:0 "Запрещает неродовым гражданам служить в вооружённых силах."
segregated_regiments:0 "Раздельные Полки"
segregated_regiments_desc:0 "Этнические меньшинства допускаются к службе, но размещаются в отдельных полках."
integrated_manpower:0 "Интегрированное Пополнение"
integrated_manpower_desc:0 "Вооружённые силы действуют без учёта этнической принадлежности или расы."

equal_service:0 "Равная Служба"
