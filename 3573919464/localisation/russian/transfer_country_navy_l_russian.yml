transfer_navy_mod:0 "Передать флот"
transfer_navy_mod_desc:0 "Существует два типа решений: \n\n(1)§YПередать флот вассала§!. Вы можете взять под контроль флот вашего вассала, не аннексируя страну. Например, Великобритания может забрать флоты Австралии и Канады в начале игры, но у RAJ на старте нет кораблей, поэтому вы не можете забрать их флот.\n\n(2)§YПередать флот проигравшего§!. Сначала используйте это решение, и ваш враг сдастся ВАМ. Затем проигравший передаст вам свой флот. §YЕсли он сдастся другим, вы не получите их флот.§!\nЭто решение может работать в §GKaiserreich§! (Похоже, что оно не работает с Deutsches Reich). §RЕсли вы не уверены, что проигравший сдастся вам, я советую вассализировать его на мирной конференции и забрать флот с помощью первого решения§!"
transfer_your_subject_navy:0 "Забрать флот [From.GetAdjective]"
transfer_your_capitulated_enemies_navy:0 "Забрать флот [From.GetAdjective] §YПосле сдачи§!"
transfer_your_capitulated_enemies_navy_custom_effect:0 "Проигравший передаст вам свой флот.§YЕсли он сдастся другим, вы не получите его флот.§!"
capitulation_transfer_navy:0 "§Yпередача флота проигравшего не была запланирована§!"
nothad_transfer_subject_navy:0 "§Yфлот вассала ещё не был передан§!"
