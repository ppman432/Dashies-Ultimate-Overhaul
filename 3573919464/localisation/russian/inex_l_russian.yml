l_russian:
industrial_expansion:0 "Расширение промышленности"
industrial_expansion_desc:0 "Это здание предоставляет государству дополнительные слоты для строительства фабрик."
industrial_expansion_tech_1:0 "Расширение промышленности I"
industrial_expansion_tech_1_desc:0 "Заключение контрактов на новые земельные участки позволит нам эффективнее использовать пространство, увеличивая количество промышленности в одной области."
industrial_expansion_tech_2:0 "Расширение промышленности II"
industrial_expansion_tech_2_desc:0 "По мере того как машины становятся более компактными, внутри фабрики помещается больше производственных линий без влияния на скорость производства оборудования."
industrial_expansion_tech_3:0 "Расширение промышленности III"
industrial_expansion_tech_3_desc:0 "Последние достижения в модульной конструкции уменьшили занимаемую зданиями площадь, позволяя проводить дополнительные разработки на существующих территориях."
industrial_expansion_tech_4:0 "Расширение промышленности IV"
industrial_expansion_tech_4_desc:0 "Сосредоточив внимание на подземных мастерских, мы можем открыть новые площади для промышленности, которые ранее не использовались."
industrial_expansion_tech_5:0 "Расширение промышленности V"
industrial_expansion_tech_5_desc:0 "Создавая специальные промышленные зоны, мы можем объединить талантливых конструкторов для создания наиболее экономичных по пространству фабрик на сегодняшний день."
INDUSTRY_TITLE_EXPANSION:0 "РАСШИРЕНИЕ"

