resource_expansion_tech_1:0 "Добыча ресурсов I"
resource_expansion_tech_1_desc:0 "Разведка ресурсов в перспективных районах предоставит новые возможности для эксплуатации ранее неизвестных месторождений."
resource_expansion_tech_2:0 "Добыча ресурсов II"
resource_expansion_tech_2_desc:0 "Повышенная эффективность добывающей техники позволит получить доступ к ранее недоступным минералам."
resource_expansion_tech_3:0 "Добыча ресурсов III"
resource_expansion_tech_3_desc:0 "Новые методы плавки позволяют извлекать больше металла из сырья, увеличивая выпуск продукции."
resource_expansion_tech_4:0 "Добыча ресурсов IV"
resource_expansion_tech_4_desc:0 "С последними достижениями в химии можно добавить новые этапы переработки для дальнейшего повышения эффективности."
resource_expansion_tech_5:0 "Добыча ресурсов V"
resource_expansion_tech_5_desc:0 "Компьютеры для численного анализа могут быть использованы в процессах переработки, что позволит достигать новых успехов в добыче ресурсов."

