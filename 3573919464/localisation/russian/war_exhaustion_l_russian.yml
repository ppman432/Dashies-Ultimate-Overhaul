war_exhaustion_category:0 "Усталость от войны"
war_exhaustion_category_desc:0 "Во время войны крайне важно сохранять стабильность и единство нации. Голоса несогласных, если их игнорировать, могут подорвать весь военный потенциал и поставить под угрозу благополучие народа. Усталость от войны — это угроза, требующая стратегического вмешательства."
we_war_hero_narratives:0 "Создание историй военных героев"
we_war_hero_narratives_desc:0 "Выявляйте и продвигайте личности в армии, проявившие исключительное мужество или самопожертвование. Создавайте подробные нарративы о их подвигах и представляйте их как национальных героев."
we_war_bond_drives:0 "Выпуск военных облигаций"
we_war_bond_drives_desc:0 "Проводите выпуск облигаций, чтобы вовлечь граждан в финансовую поддержку войны. Это не только обеспечивает средства на войну, но и создает чувство участия и общей ответственности."
we_public_recognitions:0 "Патриотические речи"
we_public_recognitions_desc:0 "Проводите торжественные речи, чествующие мужество и жертвы солдат. Организуйте церемонии с вручением медалей и наград и обеспечьте широкое освещение в СМИ для укрепления национальной гордости и единства."
we_documentary_films:0 "Создание документальных фильмов"
we_documentary_films_desc:0 "Создавайте документальные фильмы и радиопрограммы, рассказывающие о реальных подвигах солдат. Используйте эмоциональное повествование, интервью и звуковые эффекты для формирования чувства восхищения и гордости."
we_arrest_and_detain_dissidents:0 "Арест и задержание диссидентов"
we_arrest_and_detain_dissidents_desc:0 "Разрешите силовым структурам выявлять и задерживать лиц, воспринимаемых как противники войны. Задерживайте их без суда, чтобы предотвратить распространение антивоенных настроений."
we_rationing_reevaluation:0 "Пересмотр нормирования"
we_rationing_reevaluation_desc:0 "Пересмотрите нормы потребления и подумайте о смягчении ограничений на некоторые товары. Это позволит гражданам улучшить уровень жизни и повысит положительное восприятие управления войной."
we_consumer_goods_subsidies:0 "Субсидии на потребительские товары"
we_consumer_goods_subsidies_desc:0 "Предоставляйте субсидии для отраслей, производящих потребительские товары. Это стимулирует производство и повышает благосостояние населения, снижая усталость от войны."
martial_law_start:0 "Ввести военное положение"
martial_law_start_desc:0 "Публично объявляйте строгие меры против инакомыслящих, включая тюремное заключение, лишение работы или угрозы семье. Создавайте атмосферу страха, чтобы предотвратить открытое противодействие."
accede_to_protests:0 "Уступить протестующим"
accede_to_protests_desc:0 "В условиях растущей усталости от войны, население выражает протест, требуя немедленных мер по снижению нагрузки. Уступка их требованиям может временно стабилизировать ситуацию, но принесет свои сложности.\n(Принятие некоторых доктрин, таких как Штурмовые атаки, Всеобщий призыв и Фольксштурм, увеличивает усталость от войны.)"

