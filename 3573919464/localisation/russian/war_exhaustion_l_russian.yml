war_exhaustion:0 "Усталость от войны"
war_exhaustion_tab:0 "§YУсталость от войны\n§!Значение: §Y[?war_exhaustion_value|%2]§!\n\n§YНа данный момент влияет:§!\n\nМаксимальное значение: §Y[?war_exhaustion_max_value|%0]§![WE_at_peace]\n\n§YЕженедельное изменение: [?war_exhaustion_weekly_change|%%-2]§![WE_at_peace_change][WE_has_war_type][WE_war_score][WE_country_devastation][WE_economic_mobilisation][WE_manpower_mobilisation]\n\n§YЭффекты текущей усталости от войны:§!\nФактор стабильности: [?we_stability_factor|%=+]\nФактор поддержки войны: [?we_war_support_factor|%=+]\nСкорость восстановления зданий: [?we_repair_speed_building_factor|%=+]\nБоевой дух армии: [?we_army_morale_factor|%=+]\nВосстановление организации армии: [?we_army_org_regain|%=+]\nМинимальный уровень подготовки: [?we_minimum_training_level|%=-]\nЦель сопротивления: [?we_resistance_target|%=-]\nРост сопротивления: [?we_resistance_growth|%=-]\nСкорость планирования: [?we_army_morale_factor|%=+]\nПроизводительность фабрик: [?we_army_morale_factor|%=+]\nСкорость строительства: [?we_repair_speed_building_factor|%=+]\nАтака дивизий: [?we_army_morale_factor|%=+]"
war_exhaustion_modifiers:0 "Модификаторы усталости от войны"
war_exhaustion_desc:0 "Усталость от войны — это общественное или политическое недовольство продолжительным конфликтом. Обычно ведет к недоверию к правительству и военному руководству, а также может спровоцировать протестные и антивоенные движения. Влияет на уровень призыва и мораль вооружённых сил."
war_exhaustion_value:0 "[?war_exhaustion_value|%0]"

