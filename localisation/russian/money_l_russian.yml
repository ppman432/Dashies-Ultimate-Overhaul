MONEY_TOOLTIP_BASE:0 "У вас [?dx] миллионов денег\n\nВы получаете §G[?nmn]§! миллионов денег в неделю\n §GДоходы§! \nНалоги [?tax] миллионов в неделю\nДоход от гражданских фабрик [?cfff] миллионов в неделю\nЭкспорт [?resourceincome] миллионов в неделю\n Экспорт резины [?rubber_export] миллионов в неделю\nЭкспорт хрома [?chromium_export] миллионов в неделю\nЭкспорт вольфрама [?tungsten_export] миллионов в неделю\nЭкспорт алюминия [?aluminium_export] миллионов в неделю\nЭкспорт нефти [?oil_export] миллионов в неделю\nЭкспорт стали [?steel_export] миллионов в неделю\n §RРасходы§! \nВоенные расходы -[?ms] миллионов в неделю\nСодержание военных фабрик -[?nf] миллионов в неделю\nСодержание морских фабрик -[?navf] миллионов в неделю\nНалог сюзерену -[?tax_to_overlord] миллионов в неделю\nВеликая депрессия -[?depression] миллионов в неделю\nСодержание государства -[?nc] миллионов в неделю\nИмпорт -[?resourceexpenses] миллионов в неделю\nИмпорт резины -[?rubber_import] миллионов в неделю\nИмпорт хрома -[?chromium_import] миллионов в неделю\nИмпорт вольфрама -[?tungsten_import] миллионов в неделю\nИмпорт алюминия -[?aluminium_import] миллионов в неделю\nИмпорт нефти -[?oil_import] миллионов в неделю\nИмпорт стали -[?steel_import] миллионов в неделю\nЭкономическая нестабильность -[?nerfeco] миллионов в неделю\nРасходы на оккупацию -[?no] миллионов в неделю\nЕжедневная стоимость долга -[?debtexp] миллионов в неделю\n\nОбщий долг [?debttotal] миллионов"

