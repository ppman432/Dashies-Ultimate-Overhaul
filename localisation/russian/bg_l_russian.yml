planning_stage:0 "Этап планирования"
planning_stage_desc:0 "Построение планов и размышления. Ваше правительство планирует следующий шаг."

efficient_beaurocracy:0 "Эффективная бюрократия"
efficient_beaurocracy_desc:0 "\"Бюрократия — это смерть любого достижения.\""

bolstering_of_partisans:0 "Поддержка партизан"
bolstering_of_partisans_desc:0 "\"Где есть угнетение, там будет сопротивление.\""

mobilization:0 "Наша мобилизация"
mobilization_desc:0 "\"Я решил провести специальную военную операцию.\""

gp_nationalism:0 "Национализм"
gp_nationalism_desc:0 "\"Чтобы сплотить народ, правительству нужны враги. Если настоящих нет, их создают.\""

covert_ops:0 "Скрытые операции"
covert_ops_desc:0 "Примерно так же скрытно, как молоток."

state_press:0 "Государственная пресса"
state_press_desc:0 "Пресса полностью контролируется государством и его механизмами."

semi_independent_press:0 "Полунезависимая пресса"
semi_independent_press_desc:0 "Пресса состоит из независимых организаций, но проходит через государственную цензуру."

free_press_short:0 "Свобода слова"
free_press_desc:0 "Пресса полностью независима от государства."

open_borders:0 "Открытые границы"
open_borders_desc:0 "Политика открытых границ позволяет любому путешествовать и въезжать в страну."

citizenship:0 "Гражданство"
citizenship_desc:0 "Иностранцы могут получить гражданство через натурализацию."

limited_citizenship:0 "Ограниченное гражданство"
limited_citizenship_desc:0 "Процесс натурализации ограничен строгими требованиями."

strict_immigration_controls:0 "Жёсткий контроль иммиграции"
strict_immigration_controls_desc:0 "Иммиграция в страну строго контролируется."

closed_borders:0 "Закрытые границы"
closed_borders_desc:0 "\"Стены защищают других или вас самих?\""

political_refugees:0 "Политические беженцы"
political_refugees_desc:0 "Политика приема беженцев в зависимости от их политического положения."

affirmative_action:0 "Программа поддержки"
affirmative_action_desc:0 "Программа поддержки включает меры и практики для включения групп, исторически подвергавшихся дискриминации."

significant_rights:0 "Равные права"
significant_rights_desc:0 "Меньшинства имеют равные права с остальными гражданами."

neutral_stance:0 "Нейтральная позиция"
neutral_stance_desc:0 "Правительство занимает нейтральную позицию по вопросам меньшинств, позволяя общественному мнению влиять на жизнь."

racial_segregation:0 "Расовая сегрегация"
racial_segregation_desc:0 "Разделение людей на расовые или этнические группы в повседневной жизни."

racial_hierarchy:0 "Расовая иерархия"
racial_hierarchy_desc:0 "Система стратификации, основанная на убеждении, что одни расы превосходят другие."

affirmative_actionF:0 "Программа поддержки"
affirmative_actionF_desc:0 "Государство продвигает гендерное равенство."

full_equality:0 "Полное равенство"
full_equality_desc:0 "Граждане обладают полным равенством независимо от пола."

limited_womens_rights:0 "Ограниченные права женщин"
limited_womens_rights_desc:0 "Женщины обладают ограниченными правами и юридической защитой."

no_legal_protections:0 "Отсутствие правовой защиты"
no_legal_protections_desc:0 "Государство не обеспечивает правовой защиты для недостаточно представленных групп."

patriarchal_society:0 "Патриархальное общество"
patriarchal_society_desc:0 "Патриархат — это социальная система, где доминирующие позиции в основном занимают мужчины."

allowed:0 "Разрешено"
allowed_desc:0 "Публичные собрания граждан разрешены."

monitored:0 "Под контролем"
monitored_desc:0 "Публичные собрания разрешены, но находятся под наблюдением государства."

banned:0 "Запрещено"
banned_desc:0 "Публичные собрания граждан запрещены."

economic_policies:0 "Экономическая политика"

ep_economic_model:0 "Экономическая модель"

rentier_state:0 "Рентное государство"
rentier_state_desc:0 "Рентное государство получает всю или значительную часть национальных доходов за счёт ренты, уплачиваемой иностранными лицами, компаниями или правительствами."

laisezz_faire:0 "Лассэ-фер"
laisezz_faire_desc:0 "«Лассэ-фер» — тип экономической системы, в которой транзакции между частными лицами свободны от какого-либо вмешательства государства."

welfare_capitalism:0 "Капитализм с социальной защитой"
welfare_capitalism_desc:0 "Капитализм с социальной защитой включает в себя социальные программы и/или практику предоставления предприятиями социальных услуг своим сотрудникам."

mixed_market:0 "Смешанная экономика"
mixed_market_desc:0 "Смешанная экономика допускает как частный бизнес, так и национализированные государственные предприятия, а также регулирует деятельность для защиты общества, окружающей среды или интересов государства."

state_capitalism:0 "Государственный капитализм"
state_capitalism_desc:0 "Государственный капитализм — экономическая система, в которой государство осуществляет коммерческую деятельность, а средства производства национализированы и находятся в собственности государства."

planned_economy_a:0 "Плановая экономика"
planned_economy_desc:0 "Плановая экономика — система, где распределение товаров и услуг, инвестиции, производство и распределение капитальных благ осуществляется согласно экономическим планам, либо на уровне всей экономики, либо для отдельных категорий товаров и услуг."

communal_economy:0 "Коммунальная экономика"
communal_economy_desc:0 "Коммунальная экономика — система, в которой средства производства и распределение товаров и услуг контролируются и направляются сообществом."

syndicalist_markets:0 "Синдикалистские рынки"
syndicalist_markets_desc:0 "Рыночный социализм — экономическая система, включающая общественную собственность на средства производства в рамках рыночной экономики."

ep_taxation_policy:0 "Налоговая политика"

very_high_taxation:0 "Очень высокие налоги"
very_high_taxation_desc:0 "Государство обременяет граждан очень высокими налогами."

high_taxation:0 "Высокие налоги"
high_taxation_desc:0 "Государство обременяет граждан высокими налогами."

standard_taxation:0 "Стандартные налоги"
standard_taxation_desc:0 "Государство обременяет граждан налогами на справедливом уровне."

low_taxation:0 "Низкие налоги"
low_taxation_desc:0 "Государство обременяет граждан низкими налогами."

very_low_taxation:0 "Очень низкие налоги"
very_low_taxation_desc:0 "Государство обременяет граждан очень низкими налогами."

mutual_aid:0 "Взаимопомощь"
mutual_aid_desc:0 "Модель организации, при которой добровольный обмен ресурсами и услугами между членами сообщества используется для удовлетворения общих потребностей."

ep_trade_tarrifs:0 "Торговые тарифы"

no_trade_tarrifs:0 "Без тарифов"
no_trade_tarrifs_desc:0 "Государство не взимает тарифы на импортируемые товары."

low_trade_tarrifs:0 "Низкие тарифы"
low_trade_tarrifs_desc:0 "Государство взимает низкие тарифы на импортируемые товары."

average_trade_tarrifs:0 "Средние тарифы"
average_trade_tarrifs_desc:0 "Государство взимает справедливые тарифы на импортируемые товары."

high_trade_tarrifs:0 "Высокие тарифы"
high_trade_tarrifs_desc:0 "Государство взимает высокие тарифы на импортируемые товары."

extreme_trade_tarrifs:0 "Экстремальные тарифы"
extreme_trade_tarrifs_desc:0 "Государство взимает чрезвычайно высокие тарифы на импортируемые товары."

ep_foreign_investments:0 "Иностранные инвестиции"

foreign_investments_encouraged:0 "Стимулирование иностранных инвестиций"
foreign_investments_encouraged_desc:0 "Государство поощряет иностранные инвестиции."

foreign_investments_allowed:0 "Разрешение иностранных инвестиций"
foreign_investments_allowed_desc:0 "Иностранные инвестиции разрешены."

foreign_investments_regulated:0 "Регулируемые иностранные инвестиции"
foreign_investments_regulated_desc:0 "Иностранные инвестиции разрешены, но регулируются."

foreign_investments_banned:0 "Запрет иностранных инвестиций"
foreign_investments_banned_desc:0 "Иностранные инвестиции полностью запрещены."

ep_war_bonds:0 "Военные облигации"

force_bonds_buying:0 "Принудительная покупка облигаций"
force_bonds_buying_desc:0 "Государство стимулирует и направляет покупку военных облигаций."

bonds_welcome:0 "Облигации приветствуются"
bonds_welcome_desc:0 "Государство предлагает военные облигации для покупки."

no_bonds_selling:0 "Облигации не продаются"
no_bonds_selling_desc:0 "Государство не предлагает военные облигации для покупки."

ep_subsidization:0 "Субсидирование"

military_spending:0 "Военные расходы"
military_spending_desc:0 "Государство субсидирует сектор обороны."

industrial_subsidies:0 "Промышленные субсидии"
industrial_subsidies_desc:0 "Государство субсидирует промышленность и производство."

encourage_foreign_investment:0 "Субсидии на иностранные инвестиции"
encourage_foreign_investment_desc:0 "Государство стимулирует инвестиции иностранных организаций."

scientific_grants:0 "Научные гранты"
scientific_grants_desc:0 "Государство поддерживает научные исследования и развитие науки."

government_type:0 "Форма правительства"

gt_head_of_state:0 "Исполнительная власть"
gt_judiciary:0 "Судебная власть"
gt_government_form:0 "Структура правительства"


#gt_head_of_state

monarch:0 "Монархия"
monarch_desc:0 "Монархия — это форма правления, при которой глава государства (монарх) занимает свой пост пожизненно или до отречения."

prime_minister:0 "Парламентская республика"
prime_minister_desc:0 "Парламентская республика — это республика с парламентской системой, где исполнительная власть получает легитимность от законодательного органа и подотчётна ему."

president:0 "Президентская республика"
president_desc:0 "Президентская система — форма правления, в которой глава правительства (президент) возглавляет исполнительную ветвь власти, отделённую от законодательной."

military_head:0 "Военная диктатура"
military_head_desc:0 "Военная диктатура — это форма диктатуры, при которой власть сосредоточена в руках одного или нескольких военных офицеров."

chairman:0 "Председатель партии"
chairman_desc:0 "Председатель или генеральный секретарь — официальный лидер большинства коммунистических партий. В однопартийном государстве генеральный секретарь обычно является фактическим лидером страны."

federal_council:0 "Федеральный совет"
federal_council_desc:0 "Федеральный совет — это постоянное коалиционное правительство, состоящее из представителей основных партий и регионов. Члены совета коллективно выполняют функции главы государства и правительства."

communal_council:0 "Коммунальный совет"
communal_council_desc:0 "Коммунальный совет — законодательный орган, состоящий из представителей регионов или муниципалитетов. Его члены действуют как коллективный законодательный и исполнительный орган."

workers_council:0 "Совет рабочих"
workers_council_desc:0 "Совет рабочих — орган управления на предприятии, в регионе или государстве, состоящий из работников или временных делегатов, избираемых рабочими и подотчётных им."

#gt_judiciary

Independent:0 "Независимый"
Independent_desc:0 "Судебная независимость означает, что судьи не подвержены давлению и могут принимать беспристрастные решения, основываясь исключительно на законе и фактах."

subordinate_to_the_executive:0 "Подчинённый исполнительной власти"
subordinate_to_the_executive_desc:0 "Исполнительная власть оказывает значительное влияние на деятельность судебной системы, делая её подчинённой исполнительной ветви."

politicized:0 "Политизированный"
politicized_desc:0 "Судебная система формируется по политическим назначениям и лояльности к исполнительной власти, а не по законам и принципам правосудия. Результат напоминает показательные процессы."

corrupt:0 "Коррумпированный"
corrupt_desc:0 "Судебная система коррумпирована и действует в интересах своих членов, а не закона, государства или общества."

#gt_government_form

unitary_state:0 "Унитарное государство"
unitary_state_desc:0 "Унитарное государство — это суверенное государство, управляемое как единое целое, где центральное правительство обладает верховной властью."

devolved_unitary_state:0 "Делегированное унитарное государство"
devolved_unitary_state_desc:0 "Делегирование полномочий — передача центральным правительством части власти для управления на региональном или местном уровне."

sassy_federated_state:0 "Федеративное государство"
sassy_federated_state_desc:0 "Федеративное государство — союз полуавтономных провинций, штатов или регионов, подчинённых национальному правительству. Ответственность и уровень автономии регионов закреплены конституцией или законом."

communal_state:0 "Коммунальное государство"
communal_state_desc:0 "Коммуны — это организационные сообщества с культурным и социальным единством. В управлении они могут включать местное самоуправление, коллективную собственность и культурное согласие."

city_state:0 "Город-государство"
city_state_desc:0 "Город-государство — независимый суверенный город, центр политической, экономической и культурной жизни на своей территории."

#welfare_policies

welfare_policies:0 "Социальная политика"

wp_labour_laws:0 "Трудовое законодательство"
wp_healthcare_policy:0 "Политика здравоохранения"
wp_education_policy:0 "Политика в области образования"
wp_benefits_policy:0 "Социальные пособия"
wp_healthcare_focus:0 "Акцент на здравоохранение"
wp_education_focus:0 "Акцент на образование"

#wp_labour_laws

eight_hour_workday:0 "8-часовой рабочий день"
eight_hour_workday_desc:0 "Максимальная продолжительность рабочего дня — 8 часов."

twelve_hour_workday:0 "12-часовой рабочий день"
twelve_hour_workday_desc:0 "Максимальная продолжительность рабочего дня — 12 часов."

fourteen_hour_workday:0 "14-часовой рабочий день"
fourteen_hour_workday_desc:0 "Максимальная продолжительность рабочего дня — 14 часов."

eighteen_hour_workday:0 "18-часовой рабочий день"
eighteen_hour_workday_desc:0 "Максимальная продолжительность рабочего дня — 18 часов."

no_work_hour_limits:0 "Без ограничения рабочего времени"
no_work_hour_limits_desc:0 "Нет максимальной продолжительности рабочего дня."

#wp_healthcare_policy

comprehensive_healthcare_system:0 "Всеобъемлющая система здравоохранения"
comprehensive_healthcare_system_desc:0 "Граждане пользуются полной системой здравоохранения."

standard_healthcare_system:0 "Стандартная система здравоохранения"
standard_healthcare_system_desc:0 "Граждане пользуются хорошей системой здравоохранения."

basic_healthcare_system:0 "Базовая система здравоохранения"
basic_healthcare_system_desc:0 "Граждане пользуются базовыми медицинскими услугами."

no_national_healthcare_system:0 "Отсутствие национальной системы здравоохранения"
no_national_healthcare_system_desc:0 "Государство не имеет национальной системы здравоохранения."

#wp_education_policy

subsidized_higher_education:0 "Субсидированное высшее образование"
subsidized_higher_education_desc:0 "Государство поддерживает и финансирует высшее образование."

subsidized_basic_education:0 "Субсидированное базовое образование"
subsidized_basic_education_desc:0 "Государство поддерживает систему образования, но не финансирует высшее образование."

basic_education_system:0 "Базовая система образования"
basic_education_system_desc:0 "Государство поддерживает и финансирует базовую систему образования."

no_official_education_system:0 "Отсутствие официальной системы образования"
no_official_education_system_desc:0 "Государство не имеет официальной системы образования."

left_to_the_market:0 "Передано частному сектору"
left_to_the_market_desc:0 "Образование предоставляется частными, коммерческими учреждениями."

#wp_benefits_policy

generous_state_welfare:0 "Щедрая государственная поддержка"
generous_state_welfare_desc:0 "Государство поддерживает граждан щедрой системой социального обеспечения."

moderate_state_welfare:0 "Умеренная государственная поддержка"
moderate_state_welfare_desc:0 "Государство поддерживает граждан умеренно щедрой системой социального обеспечения."

basic_state_welfare:0 "Базовая государственная поддержка"
basic_state_welfare_desc:0 "Государство поддерживает граждан базовой, достаточной системой социального обеспечения."

no_state_welfare:0 "Отсутствие государственной поддержки"
no_state_welfare_desc:0 "Государство не предоставляет гражданам никаких социальных программ."

#wp_healthcare_focus

military_hospitals:0 "Военные госпитали"
military_hospitals_desc:0 "Приоритет в сфере здравоохранения отдан военным вопросам."

research_focus:0 "Фокус на исследования"
research_focus_desc:0 "Приоритет в сфере здравоохранения отдан финансированию и поддержке научных исследований."

health_focus:0 "Фокус на здоровье"
health_focus_desc:0 "Приоритет в сфере здравоохранения отдан предоставлению наилучших доступных услуг гражданам государства."

#wp_education_focus

business_schools:0 "Бизнес-школы"
