# --- DESCRIPTIONS ---
NIDEAS_IDEA_GROUP6_BUTTON1_DESC_TT:0 "Наша промышленность должна быть готова адаптироваться к изменяющейся геополитической обстановке. Развивая технологии для более эффективной перенастройки фабрик, мы сможем легче переключаться между гражданскими и военными нуждами; баланс сил всегда будет в нашу пользу."
NIDEAS_IDEA_GROUP6_BUTTON2_DESC_TT:0 "Потенциал наших лучших умов с каждым днём пропадает впустую. Их талант лучше использовать для обучения нюансам существующих проектов и тех, что переданы иностранными государствами. Вскоре они наверняка улучшат эти грубые разработки."
NIDEAS_IDEA_GROUP6_BUTTON3_DESC_TT:0 "Инновации — это преодоление, но без фокуса наше технологическое могущество всегда будет уступать конкурентам. Реорганизация министерств в отдельные исследовательские советы по областям науки, где мы сможем контролировать финансирование и, следовательно, производство технологий, обеспечит нам будущее."
NIDEAS_IDEA_GROUP6_BUTTON4_DESC_TT:0 "Мы ничто без доверия нашего народа. Когда нашу администрацию атакуют со всех сторон, патриотизм людей поможет нам без труда адаптироваться к любой ситуации. Обеспечение этой поддержки через массовую мобилизацию необходимо для быстрого изменения политики."
NIDEAS_IDEA_GROUP6_BUTTON5_DESC_TT:0 "Переориентация наших исследовательских советов на военные усилия — ключ к успеху. Мы должны сосредоточить внимание на повышении организации вооружённых сил для быстрой и эффективной реакции."
NIDEAS_IDEA_GROUP6_BUTTON6_DESC_TT:0 "Геополитическая обстановка охвачена огнём. Традиционные войны вновь оказались кровавыми и дорогими. Всё наше внимание должно быть направлено на исследования в области баллистики, чтобы мы больше никогда не проливали кровь."
NIDEAS_IDEA_GROUP6_BUTTON7_DESC_TT:0 "С ростом потребления ресурсов для снабжения армии люди начинают уставать от голода. Наши лучшие умы займутся разработкой современных инфраструктурных решений для ускоренного строительства и перераспределения товаров по всей стране."
NIDEAS_IDEA_GROUP6_BUTTON8_DESC_TT:0 "Наши ресурсы исчерпываются, а узким местом становится скорость транспортировки. Команда наших инженеров подготовила чертежи для автоматизации обработки товаров на складах, что ускорит поставки как минимум в пять раз."

