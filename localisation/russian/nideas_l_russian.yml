NIDEAS_IDEA_GROUP7_SPIRIT3_desc:0 "Родина уязвима со всех сторон, а барабаны войны звучат громче. Наши войска должны иметь все ресурсы для защиты. Будь то пляжи, поля, улицы или холмы — мы будем готовы. Мы никогда не сдадимся."
NIDEAS_IDEA_GROUP7_SPIRIT4_desc:0 "Армия, вооружённая до зубов современным оружием, превзойдёт любые силы. Наши лучшие умы должны следить за качеством войск мирового уровня."
NIDEAS_IDEA_GROUP7_SPIRIT5_desc:0 "История говорит: сотня элитных ветеранов может противостоять ордам неорганизованных сил. Мы обязаны предоставить нашим новым рекрутам средства для достижения такого мастерства через тщательно разработанные тренировки."
NIDEAS_IDEA_GROUP7_SPIRIT6_desc:0 "Наша командная структура устарела. Модернизация обеспечит отсутствие ошибок между батальонами и позволит каждому подразделению адаптироваться к быстро меняющимся ситуациям."
NIDEAS_IDEA_GROUP7_SPIRIT7_desc:0 "Наша цель — победа, и мы заплатим цену кровью и потом. Программа разработки оружия должна сосредоточиться на огневой мощи, которую может использовать каждый."
NIDEAS_IDEA_GROUP7_SPIRIT8_desc:0 "Каждый желающий служить в армии должен быть призван, независимо от возраста или способностей. Остальные будут направлены на важные производства для снабжения войск."
NIDEAS_IDEA_GROUP7_SPIRIT9_desc:0 "Мы призвали всех добровольцев и направили остальных на фабрики. Но армия должна расти. Принудительный призыв теперь единственный способ, даже если это требует обеспечения всем необходимым для выживания на поле боя."
 NIDEAS_IDEA_GROUP7_SPIRIT_SPEC1_desc:0 ""
 NIDEAS_IDEA_GROUP7_SPIRIT_SPEC2_desc:0 ""

