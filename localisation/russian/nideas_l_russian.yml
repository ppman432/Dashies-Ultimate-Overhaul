NIDEAS_IDEA_GROUP4_BUTTON1_DESC_TT:0 "Протесты — один из главных факторов истощения наших вооружённых сил, они всё чаще перерастают в насилие по мере расширения наших территорий. С помощью тщательно подобранных формулировок мы можем принять законы, ограничивающие масштаб и потенциальную опасность протестов, сохраняя видимость равенства в обществе."
NIDEAS_IDEA_GROUP4_BUTTON2_DESC_TT:0 "Наши лучшие инженеры считают, что инфраструктура стала узким местом нашей промышленности. Мы должны приложить все усилия, чтобы соединить все народы страны, обеспечив им доступ к рабочим местам, которые будут подпитывать наше расширение."
NIDEAS_IDEA_GROUP4_BUTTON3_DESC_TT:0 "Наша конституция устарела и несовершенна. По мере расширения наши законодатели вынуждены регулярно вносить поправки, исправляющие основы нашего союза. Мы должны посвятить себя реформированию этого главного документа, чтобы избежать всё более трудоёмкой задачи и дать стране путь, ранее недоступный."
NIDEAS_IDEA_GROUP4_BUTTON4_DESC_TT:0 "Мы стали одной из величайших держав в истории. Наша мощь бесспорна. Наш народ стоит за нами. Наша власть абсолютна."
NIDEAS_IDEA_GROUP4_BUTTON5_DESC_TT:0 "Привлекая местных жителей из недавно приобретённых земель к службе во вспомогательных войсках, мы избежим траты новейшего оружия и лучших солдат на гарнизонную службу. Эти отряды лучше знакомы с населением и не будут восприниматься как захватчики, что позволит нам сосредоточить силы на других направлениях."
NIDEAS_IDEA_GROUP4_BUTTON6_DESC_TT:0 "Мы укрепили новую связь с нашим многонациональным населением, которое теперь само желает активно участвовать в жизни общества. Они сосуществуют на равных правах, что известно во всём мире и привлекает иммигрантов из ближних и дальних стран."
NIDEAS_IDEA_GROUP4_BUTTON7_DESC_TT:0 "Принуждение — мощный и эффективный инструмент, который мы должны использовать, чтобы заставить массы поддержать нашу экспансионистскую политику. Нежелание — лишь препятствие, которое необходимо преодолеть."
NIDEAS_IDEA_GROUP4_BUTTON8_DESC_TT:0 "Неизбежно, что мы столкнёмся с местными лидерами, возглавляющими оппозицию против нас. Аккуратное устранение может понадобиться для урегулирования гражданских волнений, чтобы продвинуть более лояльное население в недавно присоединённых землях."

NIDEAS_IDEA_GROUP4_SPIRIT1:0 "§HИдеи расширения: Антипротестные законы§!"
NIDEAS_IDEA_GROUP4_SPIRIT2:0 "§HИдеи расширения: Пояс и путь§!"
