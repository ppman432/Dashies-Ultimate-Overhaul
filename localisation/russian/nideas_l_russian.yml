NIDEAS_IDEA_GROUP9_BUTTON1_DESC_TT:0 "Каждая современная сильная нация нуждается в ВВС, чтобы поддерживать армию с воздуха. Пора серьёзно инвестировать в ресурсы, доктрины и высшее командование, которые составят наши будущие ВВС."
NIDEAS_IDEA_GROUP9_BUTTON2_DESC_TT:0 "Мы не можем ждать, пока таланты академии проявят себя. Чтобы быстро расширять ВВС, необходимо активно искать и поддерживать новые кадры, немедленно назначая их на высокие должности."
NIDEAS_IDEA_GROUP9_BUTTON3_DESC_TT:0 "Хотя текущее образование в академии хорошее, мы должны стремиться к его улучшению. Требуя больше от студентов, мы обеспечим, что каждый будущий пилот отлично знает свой самолёт и умеет использовать его максимально эффективно."
NIDEAS_IDEA_GROUP9_BUTTON4_DESC_TT:0 "Государством ратифицирована национальная программа воздушной обороны, которая гарантирует, что вражеские самолёты не коснутся территории страны. На первом этапе программы ведущие специалисты электронного сектора обязаны инвестировать в статическую оборону и радары."
NIDEAS_IDEA_GROUP9_BUTTON5_DESC_TT:0 "В рамках ADP состоялась закрытая встреча главы государства с национальной разведкой, чтобы сосредоточить усилия на расшифровке действий вражеских авиационных сил и анализе их перемещений."
NIDEAS_IDEA_GROUP9_BUTTON6_DESC_TT:0 "На заключительном этапе ADP крупнейшие промышленные корпорации страны были вынуждены принять более защитную политику, чтобы их заводы и продукция были лучше подготовлены к обороне от вражеской авиации."
NIDEAS_IDEA_GROUP9_BUTTON7_DESC_TT:0 "Очевидно, что страна скоро вступит в войну. С усиленными ВВС и вдохновлёнными пилотами пришло время улучшить самолёты и расширить аэродромы для долгого конфликта."
NIDEAS_IDEA_GROUP9_BUTTON8_DESC_TT:0 "Студентов академии необходимо обучать стремлению к совершенству, как их наставники и герои войны. Прославление наших бывших асов ещё больше вдохновит студентов стать легендами."
NIDEAS_IDEA_GROUP9_BUTTON9_DESC_TT:0 "Новая потенциальная доктрина академии – оптимизированный цикл бомбардировочных эскадрилий и обработка данных, обеспечивающий максимальный урон с учётом вражеских условий."

