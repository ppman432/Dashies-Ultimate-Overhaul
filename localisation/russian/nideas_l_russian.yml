l_russian:
NIDEAS_MAIN_TITLE:0 "Государственные идеи"
NIDEAS_OPEN_BUTTON_TT:0 "Нажмите здесь, чтобы просмотреть свои §HГосударственные идеи§!\n\nКогда идеи станут доступны, эта иконка будет светиться."

NIDEAS_CW_ICON_TT:0 "§RИдёт гражданская война§!"
NIDEAS_CW_ICON_DESC_TT:0 "Ваше правительство не имеет времени на улучшение и инновации в текущих бюрократических процессах во время внутреннего конфликта.\n\nПосле окончания войны вам будет возвращено £pol_power 50 за все идеи, уже взятые обеими сторонами гражданской войны, и все Государственные идеи будут сброшены."

nideas.1.a:0 "Ок"
nideas.1.t:0 "Восстановление правительства"
nideas.1.desc:0 "Страна преодолела гражданскую войну, но не без потерь. В ходе политических потрясений административные лучшие практики, текущие законы и финансовые договоренности были нарушены или даже утрачены. Новое правительство реорганизовалось и сосредоточено на возвращении к нормальной жизни.\n\n§RВам будет возвращено £pol_power 50 за все идеи, уже взятые обеими сторонами гражданской войны, и все Государственные идеи будут сброшены.§!"

### GROUP 1
NIDEAS_IDEA_GROUP1_TITLE:0 "ПОЛИТИКА"
NIDEAS_IDEA_GROUP1_TAKEN:0 "[?ROOT.idea_group1_taken]/6"
NIDEAS_IDEA_GROUP1_BUTTON1_TT:0 "§HПроверки регистрации§!\n£drift_defence_texticon  Защита от идеологического дрейфа: §G+25.0%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!"
NIDEAS_IDEA_GROUP1_BUTTON2_TT:0 "§HМестные герои§!\n£stability_popularity_texticon  Стабильность популярности партии: §G+10.00%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!"
NIDEAS_IDEA_GROUP1_BUTTON3_TT:0 "§HМинистерская гибкость§!\n£political_advisor_cost_texticon  Стоимость политического советника: §G-20%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!"
NIDEAS_IDEA_GROUP1_BUTTON4_TT:0 "§HEффективная бюрократия§!\n£political_power_texticon  Ежедневный прирост политической силы: §G+0.30§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HПроверки регистрации§!\n  §HМестные герои§!\n  §HМинистерская гибкость§!"
NIDEAS_IDEA_GROUP1_BUTTON5_TT:0 "§HБилль о правах§!\n£boost_popularity_texticon  Ежедневная поддержка демократии: §G+0.05%§!\n£stability_defensive_texticon  Модификатор стабильности при оборонительной войне: §G+20.00%§!\n£stability_texticon  Еженедельная стабильность: §G+0.10%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HEффективная бюрократия§!\n\nБлокирует:\n  §HВоенная хунта§!\n  §HЖелезный кулак§!"
NIDEAS_IDEA_GROUP1_BUTTON6_TT:0 "§HМаяк свободы§!\n£political_power_texticon  Ежедневный прирост политической силы: §G+0.50§!\n£compliance_gain_texticon  Скорость роста послушания: §G+10%§!§C[NIDEAS_SCRIPT_LOC_ELECTION_LIBERTY]§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HБилль о правах§!"
NIDEAS_IDEA_GROUP1_BUTTON7_TT:0 "§HВоенная хунта§!\nЕжедневная поддержка демократии: §G-0.05%§!\n£stability_offensive_texticon  Модификатор стабильности при наступательной войне: §G+20.00%§!\nЕженедельная поддержка войны: §G+0.10%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HEффективная бюрократия§!\n\nБлокирует:\n  §HБилль о правах§!\n  §HМаяк свободы§!"
NIDEAS_IDEA_GROUP1_BUTTON8_TT:0 "§HЖелезный кулак§!\n£political_power_texticon  Ежедневный прирост политической силы: §G+0.50§!\n£political_violence_damage_texticon  Урон гарнизонам: §G-20.00%§!\n£nideas_border_war_cooldown_texticon  Восстановление после приграничной войны: §G-50%§!§C[NIDEAS_SCRIPT_LOC_ELECTION_AUTHORITY]§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HВоенная хунта§!"

NIDEAS_IDEA_GROUP1_BUTTON1_DESC_TT:0 "Каждый день в нашу страну прибывают иностранцы, принося с собой мысли и идеалы родины. Проверка таких новоприбывших гарантирует, что никто из них не несёт идей идеологического инакомыслия."
NIDEAS_IDEA_GROUP1_BUTTON2_DESC_TT:0 "Наша страна славится выдающимися мыслителями, ораторами и деятелями. Если мы сможем склонить их к нашим политическим идеалам, простой народ последует за ними без колебаний."
NIDEAS_IDEA_GROUP1_BUTTON3_DESC_TT:0 "Прогресс страны зависит от надёжности кабинета министров. Политика гибкости и признание всех министров обеспечит быструю замену членов кабинета при необходимости."
NIDEAS_IDEA_GROUP1_BUTTON4_DESC_TT:0 "Недавние реформы улучшили политическую ситуацию страны и создают возможности для дальнейших улучшений в будущем."
NIDEAS_IDEA_GROUP1_BUTTON5_DESC_TT:0 "Мировые события показали, что демократические идеалы — путь вперёд. Новый Билль о правах обеспечит безопасность граждан и их свободу как в мирное, так и в военное время."
NIDEAS_IDEA_GROUP1_BUTTON6_DESC_TT:0 "Страна стала символом свободы. Партия закрепляет свои цели, обеспечивая равные права и свободы для всех людей, что укрепит поддержку населения."
NIDEAS_IDEA_GROUP1_BUTTON7_DESC_TT:0 "Мировые события показали, что население нельзя полностью доверять в управлении страной. Требуется новая военная рада для подготовки на случай народных бедствий."
NIDEAS_IDEA_GROUP1_BUTTON8_DESC_TT:0 "Наше правление должно быть абсолютным, чтобы защитить людей от самих себя. Абсолютная власть гарантирует эффективность бюрократии и ускоряет защитную политику."

### GROUP 2
NIDEAS_IDEA_GROUP2_TITLE:0 "ДИПЛОМАТИЯ"
NIDEAS_IDEA_GROUP2_TAKEN:0 "[?ROOT.idea_group2_taken]/6"
NIDEAS_IDEA_GROUP2_BUTTON1_TT:0 "§HИнициатива внешней дипломатии§!\n£trade_deal_opinion_texticon  Влияние на сделки: §H+25.00%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!"
NIDEAS_IDEA_GROUP2_BUTTON2_TT:0 "§HПрограммы обмена исследованиями§!\n£tech_share_bonus_texticon  Бонус совместного исследования: §G+100.00%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!"
NIDEAS_IDEA_GROUP2_BUTTON3_TT:0 "§HБорьба с коррупцией§!\n£traded_goods_texticon  Ресурсы на рынке: §H-5%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!"
NIDEAS_IDEA_GROUP2_BUTTON4_TT:0 "§HПрямая дипломатия§!\n£trade_texticon  Дополнительная торговля с сюзереном: §G+25.00%§!\n£autonomy_texticon  Свобода через торговлю: §G+50.00%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HИнициатива внешней дипломатии§!\n  §HПрограммы обмена исследованиями§!\n  §HБорьба с коррупцией§!"
NIDEAS_IDEA_GROUP2_BUTTON5_TT:0 "§HСтратегия умиротворения§!\n£improve_relations_texticon  Улучшение отношений: §G+50.00%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HПрямая дипломатия§!\n\nБлокирует:\n  §HДепартамент пропаганды§!\n  §HПризыв народа§!"
NIDEAS_IDEA_GROUP2_BUTTON6_TT:0 "§HЩит нейтралитета§!\n£war_goal_time_receive_texticon  Время оправдания войны против нас: §G+50.0%§!\n£world_tension_wargoal_texticon  Напряжение при объявлении войны: §G+10.0%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HСтратегия умиротворения§!"
NIDEAS_IDEA_GROUP2_BUTTON7_TT:0 "§HДепартамент пропаганды§!\n£war_goal_time_send_texticon  Время оправдания войны: §G-25.0%§!\n£civilian_intel_texticon  Гражданская разведка: §G-10.0%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HПрямая дипломатия§!\n\nБлокирует:\n  §HСтратегия умиротворения§!"
NIDEAS_IDEA_GROUP2_BUTTON8_TT:0 "§HПризыв народа§!\n£stability_texticon  Еженедельная стабильность: §G+0.10%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\n\nТребует:\n  §HДепартамент пропаганды§!"

NIDEAS_IDEA_GROUP2_BUTTON1_DESC_TT:0 "Наше присутствие должно ощущаться на мировой арене. Что может быть лучше для новых связей, чем использование мягкой силы для заключения выгодной торговой сделки?"
NIDEAS_IDEA_GROUP2_BUTTON2_DESC_TT:0 "Мы можем использовать влияние с дружественными государствами для совместных исследований, обеспечивая технологическое преимущество перед недружественными странами."
NIDEAS_IDEA_GROUP2_BUTTON3_DESC_TT:0 "По мере расширения дипломатических миссий отдельные лица могут пытаться извлечь выгоду. Мы должны расследовать это для поддержания доверия за рубежом."
NIDEAS_IDEA_GROUP2_BUTTON4_DESC_TT:0 "Мы обучим наших дипломатов искусству такта и дипломатии, чтобы достигать именно того, чего хотим, не делая врагов из иностранных держав."
NIDEAS_IDEA_GROUP2_BUTTON5_DESC_TT:0 "Делая разумные уступки недружественным государствам, мы можем полностью избежать конфронтации. Никакая война больше не постигнет нашу великую нацию."
NIDEAS_IDEA_GROUP2_BUTTON6_DESC_TT:0 "Мы будем использовать наше уникальное положение нейтралитета для защиты от агрессоров. Если они выступят против нас, весь мир встанет на нашу сторону!"
NIDEAS_IDEA_GROUP2_BUTTON7_DESC_TT:0 "Незаметное создание нового департамента пропаганды под видом общественных коммуникаций позволит скрыть наши истинные намерения и удерживать общественное мнение на нашей стороне!"
NIDEAS_IDEA_GROUP2_BUTTON8_DESC_TT:0 "Сильная риторика может объединить даже самых неподатливых людей, как близких, так и дальних. Это необходимая мера, чтобы обеспечить всё, чего мы хотим силой, иначе наша нация разорвёт себя на части."

NIDEAS_IDEA_GROUP2_BUTTON1_COMPLETE_DESC_TT:0 "Наше присутствие должно ощущаться на мировой арене. Как ещё лучше налаживать новые связи, чем используя мягкую силу для заключения выгодной торговой сделки?"
NIDEAS_IDEA_GROUP2_BUTTON2_COMPLETE_DESC_TT:0 "Мы можем использовать растущее влияние среди союзных государств для заключения исследовательских соглашений, выгодных для обеих сторон, сохраняя наше технологическое преимущество над недружественными странами."
NIDEAS_IDEA_GROUP2_BUTTON3_COMPLETE_DESC_TT:0 "По мере расширения дипломатических миссий найдутся чиновники, желающие использовать переговоры для собственной выгоды. Мы должны расследовать это, даже если оно незначительно, чтобы заслужить доверие за рубежом."
NIDEAS_IDEA_GROUP2_BUTTON4_COMPLETE_DESC_TT:0 "Мы обучим наших дипломатов искусству такта и дипломатии, чтобы достигать именно того, чего хотим, не делая врагов из иностранных держав."
NIDEAS_IDEA_GROUP2_BUTTON5_COMPLETE_DESC_TT:0 "Делая разумные уступки недружественным государствам, мы можем полностью избежать конфронтации. Никакая война больше не постигнет нашу великую нацию."
NIDEAS_IDEA_GROUP2_BUTTON6_COMPLETE_DESC_TT:0 "Мы будем использовать наше уникальное положение нейтралитета для защиты от агрессоров. Если они выступят против нас, весь мир встанет на нашу сторону!"
NIDEAS_IDEA_GROUP2_BUTTON7_COMPLETE_DESC_TT:0 "Незаметное создание нового департамента пропаганды под видом общественных коммуникаций позволит скрыть наши истинные намерения и удерживать общественное мнение на нашей стороне!"
NIDEAS_IDEA_GROUP2_BUTTON8_COMPLETE_DESC_TT:0 "Сильная риторика может объединить даже самых неподатливых людей, как близких, так и дальних. Это необходимая мера, чтобы обеспечить всё, чего мы хотим силой, иначе наша нация разорвёт себя на части."

