NIDEAS_IDEA_GROUP7_BUTTON7_TT:0 "§HДостаточно хорошо§!\n£research_speed_artillery_texticon  Скорость исследований артиллерии: §G+10%§!\n£research_speed_equipment_texticon  Скорость исследований оружия и оборудования: §G+10%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\nСтоимость (£army_experience ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_ARMYXP]§!\n\nТребуется:\n  §HФинансирование армии§!\n\nБлокирует:\n  §HПреимущество за счет качества§!\n  §HИнтенсивные тренировочные манёвры§!\n  §HРеформы структуры командования§!"
