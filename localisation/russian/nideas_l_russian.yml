NIDEAS_IDEA_GROUP8_BUTTON1_DESC_TT:0 "Те, кто правит волнами, меняют ход войны. Наш долг – обеспечить будущие победы, инвестируя в ВМФ уже сейчас."
NIDEAS_IDEA_GROUP8_BUTTON2_DESC_TT:0 "Мы вложили деньги в ВМФ, но нам не хватает кадров для растущего флота. Среди рядов есть будущие адмиралы, которых нужно продвигать немедленно, независимо от опыта."
NIDEAS_IDEA_GROUP8_BUTTON3_DESC_TT:0 "Наш флот силён, но превысил возможности частных индустрий в поддержании. Существует сильная политическая воля к национализации верфей, чтобы снять ограничения, снижавшие выпуск слишком долго."
NIDEAS_IDEA_GROUP8_BUTTON4_DESC_TT:0 "Эффективность нашей промышленности можно резко повысить, просто массово производя детали кораблей, независимо от актуальной необходимости."
NIDEAS_IDEA_GROUP8_BUTTON5_DESC_TT:0 "Планирование военных учений критично для организации флотов нашего размера. С улучшенной тактикой мы непременно преодолеем любого противника на открытых морях."
NIDEAS_IDEA_GROUP8_BUTTON6_DESC_TT:0 "Мы можем существенно улучшить стандартные структуры портов, устранив ненужные проверки и бюрократию. Без бюрократии частные морские индустрии можно развивать ещё дальше."
NIDEAS_IDEA_GROUP8_BUTTON7_DESC_TT:0 "Фокус на быстрые операции малыми флотами требует переоценки способов действий против более мощного морского присутствия. Адмиралы должны быть обучены сохранять целостность своих кораблей любой ценой, даже если это чрезмерная осторожность, чтобы мы могли продолжать борьбу в будущем."
NIDEAS_IDEA_GROUP8_BUTTON8_DESC_TT:0 "Разработка продвинутых метеорологических моделей для адмиралов позволит использовать погодные условия в своих интересах. Наши враги увидят непреодолимый шторм, где мы видим возможность нанести прицельный урон."
NIDEAS_IDEA_GROUP8_BUTTON9_DESC_TT:0 "Наши инженеры предлагают улучшить все системы запуска торпед, изменив подход к ним. В конце концов, важна не величина боеголовки, а как её использовать."

