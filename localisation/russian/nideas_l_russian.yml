# Подробные описания
NIDEAS_IDEA_GROUP5_BUTTON1_DESC_TT:0 "Наше разведывательное агентство всё ещё молодо и слабо. С дополнительным государственным финансированием мы сможем продолжить его расширение и защитить себя от иностранных подрывных угроз."
NIDEAS_IDEA_GROUP5_BUTTON2_DESC_TT:0 "Нашим агентам не хватает опыта, и они должны пройти серьёзную подготовку, чтобы преуспеть в поле. Строгая программа обучения оперативников выведет их на передовой уровень и обеспечит лучшую отдачу для нашей разведки."
NIDEAS_IDEA_GROUP5_BUTTON3_DESC_TT:0 "Текущая бюрократия агентства пронизана коррупцией и некомпетентностью, что ограничивает его развитие. Мы должны искоренить неэффективность сверху и заменить руководство честными и трудолюбивыми людьми."
NIDEAS_IDEA_GROUP5_BUTTON4_DESC_TT:0 "Наш отдел шифрования сделал крупный прорыв в исследованиях вычислительной техники, открыв путь к гораздо более эффективным системам. Мы должны поделиться этими достижениями с ведущими электронными компаниями, чтобы распространить революцию по всей стране."
NIDEAS_IDEA_GROUP5_BUTTON5_DESC_TT:0 "Администрация уже некоторое время обсуждает идею «Бастион» — современного центрального отдела в столице, специализирующегося на контрразведке. Этот зоркий глаз непременно поможет выследить шпионов в нашей стране."
NIDEAS_IDEA_GROUP5_BUTTON6_DESC_TT:0 "С постройкой «Бастиона» мы можем расширить его возможности. Создавая тайные бункеры, базы и опорные пункты для агентов, мы создадим сеть, повышающую эффективность «Бастиона» и скрывающую само его существование, превращая нашу страну в неуловимую тень для иностранных шпионов."
NIDEAS_IDEA_GROUP5_BUTTON7_DESC_TT:0 "Хотя радиосвязь хорошо служит нашим агентам, это не единственный способ передачи информации. Скрывая зашифрованные сообщения на виду, под прикрытием повседневной деятельности, мы позволим агентам проводить больше времени в поле, увеличивая объём собираемых данных."
NIDEAS_IDEA_GROUP5_BUTTON8_DESC_TT:0 "Важно, чтобы наши шпионы оставались незаметными и полностью растворялись в толпе. Мы будем постоянно поощрять их изучать язык, завоёвывать симпатии людей и перехватывать рабочие места врагов, чтобы они могли сливаться с окружением и снижать риск разоблачения."

