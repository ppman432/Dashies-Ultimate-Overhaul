NIDEAS_IDEA_GROUP7_BUTTON3_TT:0 "§HОборона Родины§!\n£army_experience  Получение опыта армии: §G+0.05§! ежедневно\n£attack_core_texticon  Атака дивизии на основной территории: §G+5.0%§!\n£defence_core_texticon  Защита дивизии на основной территории: §G+5.0%§!\n£command_power_max_texticon  Максимальная командная мощь: §G+50§!\n£army_intel_texticon  Разведка армии для других: §G-5.0%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\nСтоимость (£army_experience ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_ARMYXP]§!\n\nТребуется:\n  §HПрограмма ускоренного развития талантов армии§!\n  Один из следующих:\n    §HРеформы структуры командования§!\n    §HВсё разрешено§!"
NIDEAS_IDEA_GROUP7_BUTTON4_TT:0 "§HПреимущество за счет качества§!\n£research_speed_tank_texticon  Скорость исследований бронетехники: §G+10%§!\n£research_speed_motorised_texticon  Скорость исследований моторизации: §G+10%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\nСтоимость (£army_experience ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_ARMYXP]§!\n\nТребуется:\n  §HФинансирование армии§!\n\nБлокирует:\n  §HДостаточно хорошо§!\n  §HСнижение стандартов§!\n  §HВсё разрешено§!"
NIDEAS_IDEA_GROUP7_BUTTON5_TT:0 "§HИнтенсивные тренировочные манёвры§!\n£defence_texticon  Защита дивизии: §G+5.0%§!\n£attack_specops_texticon  Атака спецподразделений: §G+7.5%§!\n£defence_specops_texticon  Защита спецподразделений: §G+7.5%§!\nСтоимость (£pol_power ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_PP]§!\nСтоимость (£army_experience ):§H[NIDEAS_SCRIPT_LOC_IDEA_COST_ARMYXP]§!\n\nТребуется:\n  §HПреимущество за счет качества§!"
