# Описания идей
NIDEAS_IDEA_GROUP3_BUTTON1_DESC_TT:0 "Наши фабрики устаревают, и мы должны быть готовы платить за это цену. Субсидирование отрасли строительных инструментов увеличит выпуск и снизит расходы бизнеса на ремонт."
NIDEAS_IDEA_GROUP3_BUTTON2_DESC_TT:0 "Инвестиции в сектор разведки и бурения откроют для нас новые месторождения ценных материалов для торговли."
NIDEAS_IDEA_GROUP3_BUTTON3_DESC_TT:0 "Наша экономика замедляется; мы должны продолжать предоставлять денежные стимулы для промышленных проектов, чтобы повысить спрос, даже если это будет за счёт жилищного сектора."
NIDEAS_IDEA_GROUP3_BUTTON4_DESC_TT:0 "Выделение большего финансирования на образование, которое активно продвигает карьеру в промышленности, быстро увеличит занятость в инженерном секторе. Некоторые из специалистов займутся исследованиями, что позволит нам опережать конкурентов."
NIDEAS_IDEA_GROUP3_BUTTON5_DESC_TT:0 "Наша растущая экономика не сможет поддерживаться без большего числа рабочих. Нам придётся покрыть расходы, чтобы привлечь больше гражданского населения в фабрики."
NIDEAS_IDEA_GROUP3_BUTTON6_DESC_TT:0 "Создание новых транспортных связей для доставки сырья на линии производства увеличит выпуск, если рабочие будут работать сверхурочно."
NIDEAS_IDEA_GROUP3_BUTTON7_DESC_TT:0 "Растущее экономическое давление на гражданское население из-за дестабилизирующей политической обстановки в мире не осталось незамеченным. Мы не можем позволить бедности укорениться в нашей стране и должны увеличить пособия, чего бы это ни стоило."
NIDEAS_IDEA_GROUP3_BUTTON8_DESC_TT:0 "Увеличивая расходы на пособия, мы должны следить за ростом экономики, чтобы оплачивать их. Финансирование ключевых отраслей поможет стимулировать рост и сохранить население довольным."

