l_russian:
bombing_morale_damage: "Урон моральному духу"
bombing_events.1.t: "Урон моральному духу"
bombing_events.1.d: "Продолжающиеся стратегические бомбардировки подрывают мораль гражданского населения и нарушают внутреннюю стабильность страны."

heavy_bombing_consequences: "Разрушенные города"
bombing_events.2.t: "Разрушенные города"
bombing_events.2.d: "Вражеские бомбардировщики продолжают безжалостную кампанию, и целые районы лежат в руинах. Инфраструктура разрушена, фабрики простаивают, а паника охватывает население. Правительство изо всех сил пытается поддерживать мораль, пока граждане эвакуируются или прячутся в импровизированных укрытиях. Каждая воздушная атака подтачивает волю к сопротивлению."

bombing_collapse: "Крах тыла"
bombing_events.3.t: "Крах тыла"
bombing_events.3.d: "Разрушения с воздуха превысили все пределы. Крупные города уничтожены, цепочки поставок продовольствия и медицинских средств нарушены, а гражданские волнения близки к открытому восстанию. Семьи разлучены, крики раненых слышны громче любого призыва к оружию. Власть правительства ослабевает, а вера в победу угасает."

Strategic_Bombing_decision_cat: "Программы реагирования на воздушные налеты"
Strategic_Bombing_decision_cat_desc: "Безжалостные бомбардировки врага наносят ущерб нашей промышленности и населению. Инвестируя политический капитал в гражданскую защиту, укрепление инфраструктуры и противовоздушную оборону, мы можем снизить разрушения и защитить наши военные усилия."

Civil_Defense_Campaign: "Кампания гражданской обороны"
Civil_Defense_Campaign_desc: "Правительство запускает кампанию по информированию и подготовке населения. Граждан обучают оказанию первой помощи, протоколам эвакуации и мерам контроля ущерба. Эти меры замедлят продвижение вражеского бомбардирования."
Civil_Defense_Campaign_tt: "Снижает потери от стратегических бомбардировок на 30 дней. Уменьшает негативные эффекты разрушений стратегического бомбардирования на 5."

Fortify_Critical_Infrastructure: "Укрепление критической инфраструктуры"
Fortify_Critical_Infrastructure_desc: "Государство выделяет экстренные ресурсы для усиления ключевой инфраструктуры, такой как оружейные фабрики, нефтеперерабатывающие заводы и транспортные узлы, против воздушных налетов."
fortify_infrastructure_tt: "Строит зенитные установки в 3 ваших ключевых провинциях для усиления ПВО. Снижает негативные эффекты стратегического бомбардирования на 10."

mobilize_fighter_production: "Мобилизация производства истребителей"
mobilize_fighter_production_desc: "Наши небеса не останутся без защиты. Увеличиваем сборочные линии истребителей и готовим больше перехватчиков!"
mobilize_fighter_production_tt: "Добавляет 250 истребителей модели 47 в запасы для усиления воздушной обороны. Снижает негативные эффекты стратегического бомбардирования на 15."
