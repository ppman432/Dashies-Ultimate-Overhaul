continuous_naval_production1: "Судостроение I"
continuous_naval_production2: "Судостроение II"
continuous_naval_production3: "Судостроение III"
continuous_naval_production1_desc: "Мы должны господствовать на морях, чтобы защитить себя и голодать наших врагов: +33% к выпуску кораблей. Иногда мы делаем важные открытия, позволяющие получить больше опыта флота или исследовать новые корабли."
continuous_naval_production2_desc: "Мы должны господствовать на морях, чтобы защитить себя и голодать наших врагов: +67% к выпуску кораблей. Иногда мы делаем важные открытия, позволяющие получить больше опыта флота или исследовать новые корабли."
continuous_naval_production3_desc: "Мы должны господствовать на морях, чтобы защитить себя и голодать наших врагов: +100% к выпуску кораблей. Иногда мы делаем важные открытия, позволяющие получить больше опыта флота или исследовать новые корабли."

continuous_air_production1: "Авиация I"
continuous_air_production2: "Авиация II"
continuous_air_production3: "Авиация III"
continuous_air_production1_desc: "Если мы проиграем воздушную войну, мы проиграем и всю войну: +33% к выпуску авиации. Иногда мы делаем небольшие открытия, позволяющие получить больше опыта авиации или исследовать новые самолёты."
continuous_air_production2_desc: "Если мы проиграем воздушную войну, мы проиграем и всю войну: +67% к выпуску авиации. Иногда мы делаем значительные открытия, позволяющие получить больше опыта авиации или исследовать новые самолёты."
continuous_air_production3_desc: "Если мы проиграем воздушную войну, мы проиграем и всю войну: +100% к выпуску авиации. Иногда мы делаем важные открытия, позволяющие получить больше опыта авиации или исследовать новые самолёты."

continuous_standard_equipment1: "Производство стандартного оружия I"
continuous_standard_equipment2: "Производство стандартного оружия II"
continuous_standard_equipment3: "Производство стандартного оружия III"
continuous_standard_equipment1_desc: "«Идеальное» оружие переоценено, большое количество «достаточно хорошего» — путь к победе! +33% к выпуску стандартного оружия. Иногда мы делаем небольшие открытия, позволяющие получить больше опыта армии или исследовать новые технологии."
continuous_standard_equipment2_desc: "«Идеальное» оружие переоценено, большое количество «достаточно хорошего» — путь к победе! +67% к выпуску стандартного оружия. Иногда мы делаем значительные открытия, позволяющие получить больше опыта армии или исследовать новые технологии."
continuous_standard_equipment3_desc: "«Идеальное» оружие переоценено, большое количество «достаточно хорошего» — путь к победе! +100% к выпуску стандартного оружия. Иногда мы делаем важные открытия, позволяющие получить больше опыта армии или исследовать новые технологии."

continuous_tank_production1: "Производство танков I"
continuous_tank_production2: "Производство танков II"
continuous_tank_production3: "Производство танков III"
continuous_tank_production1_desc: "Наши мощные танки прорвут линии врага и рассредоточат его силы: +33% к выпуску танков. Иногда мы делаем небольшие открытия, позволяющие получить больше опыта армии или исследовать новые танки."
continuous_tank_production2_desc: "Наши мощные танки прорвут линии врага и рассредоточат его силы: +67% к выпуску танков. Иногда мы делаем значительные открытия, позволяющие получить больше опыта армии или исследовать новые танки."
continuous_tank_production3_desc: "Наши мощные танки прорвут линии врага и рассредоточат его силы: +100% к выпуску танков. Иногда мы делаем важные открытия, позволяющие получить больше опыта армии или исследовать новые танки."

mass_production1: "Массовое производство I"
mass_production2: "Массовое производство II"
mass_production3: "Массовое производство III"
mass_production1_desc: "Мы должны сосредоточить промышленность и заставить её работать максимально эффективно."
mass_production2_desc: "Мы должны сосредоточить промышленность и заставить её производить всё больше и больше."
mass_production3_desc: "Мы должны сосредоточить промышленность и производить максимум."

flexible_production1: "Гибкое производство I"
flexible_production2: "Гибкое производство II"
flexible_production3: "Гибкое производство III"
flexible_production1_desc: "Наша промышленность всегда должна быть готова к адаптации."
flexible_production2_desc: "Наша промышленность всегда должна быть готова производить новые типы оборудования."
flexible_production3_desc: "Наша промышленность должна постоянно переключаться на текущие потребности армий."

continuous_non_factory_construct1: "Инженерное строительство I"
continuous_non_factory_construct2: "Инженерное строительство II"
continuous_non_factory_construct3: "Инженерное строительство III"
continuous_non_factory_construct1_desc: "Мы должны мобилизовать силы страны для строительства светлого будущего. Иногда расширение инфраструктуры превзойдёт ожидания или мы сделаем небольшие открытия в строительстве."
continuous_non_factory_construct2_desc: "Мы должны мобилизовать силы страны для БЫСТРОГО строительства светлого будущего. Иногда расширение инфраструктуры значительно превзойдёт ожидания или мы сделаем значительные открытия в строительстве."
continuous_non_factory_construct3_desc: "Мы должны мобилизовать ВСЕ силы страны для строительства самого светлого будущего. Иногда расширение инфраструктуры превзойдёт самые смелые ожидания или мы сделаем важные открытия в строительстве."

construction_effort1: "Строительные усилия I"
construction_effort2: "Строительные усилия II"
construction_effort3: "Строительные усилия III"
construction_effort1_desc: "Начнем с расширения тяжёлой промышленности. Иногда расширение превзойдёт ожидания или мы сделаем небольшие открытия в промышленной технологии."
construction_effort2_desc: "Начнем с БЫСТРОГО расширения тяжёлой промышленности. Иногда расширение превзойдёт ожидания или мы сделаем значительные открытия в промышленной технологии."
construction_effort3_desc: "Начнем с расширения тяжёлой промышленности ЛЮБОЙ ЦЕНОЙ. Иногда расширение превзойдёт самые смелые ожидания или сделает важные открытия в промышленной технологии."

armament_effort1: "Военные усилия I"
armament_effort2: "Военные усилия II"
armament_effort3: "Военные усилия III"
armament_effort1_desc: "Наша рабочая сила ценна, пули дешёвы. Мы должны производить больше врага. Иногда расширение военной промышленности слегка превзойдёт ожидания или даст небольшие открытия."
armament_effort2_desc: "Наша рабочая сила ценна, пули дешёвы. Мы должны производить больше врага очень быстро. Иногда расширение военной промышленности превзойдёт ожидания или даст значительные открытия."
armament_effort3_desc: "Наша рабочая сила ценна, пули дешёвы. Мы должны производить больше врага максимально быстро. Иногда расширение военной промышленности превзойдёт самые смелые ожидания или даст важные открытия."

excavation_effort1: "Разведочные усилия I"
excavation_effort2: "Разведочные усилия II"
excavation_effort3: "Разведочные усилия III"
excavation_effort1_desc: "Мы должны мобилизовать людей для добычи ресурсов, улучшить переработку и избежать потерь. Можно обнаружить новые мелкие месторождения или сделать небольшие открытия в технологиях добычи."
excavation_effort2_desc: "Мы должны мобилизовать людей для интенсивной добычи ресурсов, улучшить переработку и избежать потерь. Можно обнаружить новые месторождения или сделать значительные открытия в технологиях добычи."
excavation_effort3_desc: "Мы должны мобилизовать ВСЕх людей для добычи ресурсов, улучшить переработку и избежать потерь. Можно обнаружить новые месторождения или сделать важные открытия в технологиях добычи."

continuous_repair1: "Ремонтные работы I"
continuous_repair2: "Ремонтные работы II"
continuous_repair3: "Ремонтные работы III"
continuous_repair1_desc: "Никакие жертвы, отступления или бомбы не повлияют на нашу решимость. Любой урон должен быть устранён."
continuous_repair2_desc: "Никакие жертвы, отступления или бомбы не повлияют на нашу решимость. Любой урон должен быть устранён немедленно."
continuous_repair3_desc: "Никакие жертвы, отступления или бомбы не повлияют на нашу решимость. Любой урон должен быть устранён максимально быстро."

continuous_rationing1: "Распределение I"
continuous_rationing2: "Распределение II"
continuous_rationing3: "Распределение III"
continuous_rationing1_desc: "Необходимо начать рационализировать питание и потребительские товары, чтобы избежать чрезмерного потребления."
continuous_rationing2_desc: "Необходимо рационализировать питание и потребительские товары, чтобы они соответствовали потребностям людей."
continuous_rationing3_desc: "Необходимо рационализировать питание и потребительские товары и отдавать всё для победы!"

continuous_trade1: "Международная торговля I"
continuous_trade2: "Международная торговля II"
continuous_trade3: "Международная торговля III"
continuous_trade1_desc: "Наша международная политика должна успокаивать торговых партнёров и максимизировать экспорт."
continuous_trade2_desc: "Наша международная политика должна улучшать существующие торговые связи и строить новые."
continuous_trade3_desc: "Единственной целью нашей политики должен быть экспорт и ничего больше."

continuous_recruitment1: "Призыв I"
continuous_recruitment2: "Призыв II"
continuous_recruitment3: "Призыв III"
continuous_recruitment1_desc: "Мы должны быстрее мобилизовать и обучать солдат."
continuous_recruitment2_desc: "Мы должны мобилизовать и обучать как можно больше солдат."
continuous_recruitment3_desc: "Ни один враг не сможет противостоять нашим людским волнам."

continuous_training1: "Подготовка I"
continuous_training2: "Подготовка II"
continuous_training3: "Подготовка III"
continuous_training1_desc: "Наши дивизии должны быть гораздо опытнее до начала боёв."
continuous_training2_desc: "Наши дивизии должны быть подготовлены максимально эффективно."
continuous_training3_desc: "Каждый солдат должен быть экспертом."

continuous_unity1: "Единство I"
continuous_unity2: "Единство II"
continuous_unity3: "Единство III"
continuous_unity1_desc: "Каждый должен знать, за что мы боремся."
continuous_unity2_desc: "Ничто не повлияет на нашу решимость к победе."
continuous_unity3_desc: "Даже в самые тёмные времена всегда есть надежда и повод бороться."
 
continuous_suppression1: "Подавление сопротивления I"
continuous_suppression2: "Подавление сопротивления II"
continuous_suppression3: "Подавление сопротивления III"
continuous_suppression1_desc: "Мы не можем позволить террористам подрывать наши усилия по pacификации. Мы должны быть быстрыми и сильными."
continuous_suppression2_desc: "Мы не можем позволить террористам подрывать наши усилия по pacификации. Мы должны быть ещё быстрее и сильнее."
continuous_suppression3_desc: "Мы не можем позволить террористам подрывать наши усилия по pacификации. Все наши усилия должны быть направлены против них."

continuous_tech_share1: "Обмен технологиями I"
continuous_tech_share2: "Обмен технологиями II"
continuous_tech_share3: "Обмен технологиями III"
continuous_tech_share_desc1: "Нет смысла изобретать велосипед. Мы должны убедить союзников передать нам свои новейшие технологии и доктрины."
continuous_tech_share_desc2: "Нет смысла изобретать велосипед. Мы должны убедить союзников передать нам свои новейшие технологии и доктрины как можно быстрее."
continuous_tech_share_desc3: "Нет смысла изобретать велосипед. Мы должны убедить союзников передать нам свои новейшие технологии и доктрины прямо сейчас."

continuous_tech_effort1: "Исследовательские усилия I"
continuous_tech_effort2: "Исследовательские усилия II"
continuous_tech_effort3: "Исследовательские усилия III"
continuous_tech_effort1_desc: "«Бог не на стороне крупнейших батальонов, а на стороне лучших». Иногда мы делаем небольшие открытия в области электроники, ядерного деления или реактивных двигателей."
continuous_tech_effort2_desc: "«Бог не на стороне крупнейших батальонов, а на стороне лучших». Иногда мы делаем значительные открытия в области электроники, ядерного деления или реактивных двигателей."
continuous_tech_effort3_desc: "«Бог не на стороне крупнейших батальонов, а на стороне лучших». Иногда мы делаем важные открытия в области электроники, ядерного деления или реактивных двигателей."

continuous_boost_freedom1: "Расширение автономии I"
continuous_boost_freedom2: "Расширение автономии II"
continuous_boost_freedom3: "Расширение автономии III"
continuous_boost_freedom1_desc: "Мы достигнем независимости не войной и восстанием, а постепенно расширяя автономию."
continuous_boost_freedom2_desc: "Мы достигнем независимости не войной и восстанием, а расширяя автономию."
continuous_boost_freedom3_desc: "Мы достигнем независимости не войной и восстанием, а быстро расширяя автономию."

continuous_subjugate1: "Подчинение I"
continuous_subjugate2: "Подчинение II"
continuous_subjugate3: "Подчинение III"
continuous_subjugate1_desc: "Мы должны усилить контроль над колониями и протекторатами. Мы не допустим предательства!"
continuous_subjugate2_desc: "Мы должны ещё сильнее усилить контроль над колониями и протекторатами. Мы не допустим предательства!"
continuous_subjugate3_desc: "Мы должны держать наши колонии и протектораты под полным контролем. Мы не допустим предательства!"

population_growth1: "Рост населения I"
population_growth2: "Рост населения II"
population_growth3: "Рост населения III"
population_growth1_desc: "Мы улучшим условия жизни в стране. Это увеличит рост населения и привлечёт беженцев каждые несколько недель."
population_growth2_desc: "Мы ещё больше улучшим условия жизни. Это значительно увеличит рост населения и привлечёт больше беженцев каждые несколько недель."
population_growth3_desc: "Мы радикально улучшим условия жизни. Это драматически увеличит рост населения и привлечёт множество беженцев каждые несколько недель."

army_modernisation1: "Модернизация армии I"
army_modernisation2: "Модернизация армии II"
army_modernisation3: "Модернизация армии III"
army_modernisation1_desc: "Мы сделаем всё возможное для модернизации армии. Мы сможем чаще обновлять дивизионные шаблоны и оборудование. Иногда делаем небольшие открытия, дающие опыт армии или бонусы к исследованиям сухопутных технологий."
army_modernisation2_desc: "Мы приложим ещё больше усилий для модернизации армии. Мы сможем чаще обновлять дивизионные шаблоны и оборудование. Иногда делаем значительные открытия, дающие опыт армии или бонусы к исследованиям сухопутных технологий."
army_modernisation3_desc: "Мы приложим все усилия для модернизации армии. Мы сможем чаще обновлять дивизионные шаблоны и танки. Иногда делаем крупные открытия, дающие опыт армии или бонусы к исследованиям сухопутных технологий."

airforce_modernisation1: "Модернизация авиации I"
airforce_modernisation2: "Модернизация авиации II"
airforce_modernisation3: "Модернизация авиации III"
airforce_modernisation1_desc: "Мы сделаем всё возможное для модернизации авиации. Мы сможем чаще обновлять самолёты. Иногда делаем небольшие открытия, дающие опыт авиации или бонусы к исследованиям воздушных технологий."
airforce_modernisation2_desc: "Мы приложим ещё больше усилий для модернизации авиации. Мы сможем чаще обновлять самолёты. Иногда делаем значительные открытия, дающие опыт авиации или бонусы к исследованиям воздушных технологий."
airforce_modernisation3_desc: "Мы приложим все усилия для модернизации авиации. Мы сможем чаще обновлять самолёты. Иногда делаем крупные открытия, дающие опыт авиации или бонусы к исследованиям воздушных технологий."

navy_modernisation1: "Модернизация флота I"
navy_modernisation2: "Модернизация флота II"
navy_modernisation3: "Модернизация флота III"
navy_modernisation1_desc: "Мы сделаем всё возможное для модернизации флота. Мы сможем чаще обновлять корабли. Иногда делаем небольшие открытия, дающие опыт флота или бонусы к исследованиям морских технологий."
navy_modernisation2_desc: "Мы приложим ещё больше усилий для модернизации флота. Мы сможем чаще обновлять корабли. Иногда делаем значительные открытия, дающие опыт флота или бонусы к исследованиям морских технологий."
navy_modernisation3_desc: "Мы приложим все усилия для модернизации флота. Мы сможем чаще обновлять корабли. Иногда делаем крупные открытия, дающие опыт флота или бонусы к исследованиям морских технологий."

navy_modernisation: "Модернизация флота"
airforce_modernisation: "Модернизация авиации"
army_modernisation: "Модернизация армии"
