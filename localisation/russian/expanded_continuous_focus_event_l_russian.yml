l_russian:
ecf.start.1.t:0 "Expanded Continuous Focuses: Вопрос совместимости"
ecf.start.1.d:0 "ECF работает с базовой игрой и всё увеличивающимся списком других модов. Чтобы отобразить правильные фокусы, пожалуйста, выберите мод, с которым вы играете, ниже. \n\nПРИМЕЧАНИЕ: Чтобы избежать наложений с некоторыми древами фокусов, Постоянные фокусы были перемещены ниже в древе."
ecf.start.1.a:0 "Я играю в ваниль/без глобальных модов"
ecf.start.1.b:0 "Я играю с Road to 56"
ecf.start.1.c:0 "Я играю с другими глобальными модами"
ecf.start.1.e:0 "Что? Другие глобальные моды???"
ecf.start.1.e.tt:0 "Открывает список совместимых модов"

ecf.start.2.t:0 "ECF: Совместимые моды"
ecf.start.2.d:0 "ECF может работать с этими модами... наверное... \n\nKaiserReich, KaiserRedux, Old World Blues, Equestria At War, Cold War Iron Curtain: A World Divided, Apres Moi Le Deluge, - Hearts of Oak -, Hearts of Oak 2: Directors Cut и Hearts of Iron IV: The Great War. \n\nПланируется поддержка большего числа модов, но это займёт много времени. Сообщайте о проблемах на странице мода в Steam!"
ecf.start.2.a:0 "Это эпично! Верните меня назад."
