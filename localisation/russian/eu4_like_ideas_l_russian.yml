RULE_DELAY_10_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y10§! лет после начала игры, если возможно."

EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION: "Снижение стоимости Политической силы для ИИ"
RULE_OPTION_NONE_EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION: "Нет"
NONE_EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION_DESC: "§YСтраны с ИИ§! §Rне получат§! дополнительное снижение стоимости £pol_power£. \n\nЭто снижение влияет на слоты §YТорговые Законы§!, §YПолитические Советники§!, §YИсследования и Производство§! и §YВоенный Штаб§! в политической вкладке. \n\n§YВы можете выбрать любое из этих снижений, чтобы ИИ чаще тратил Политическую силу на эти слоты, а не только на идеи, однако это даёт ИИ преимущество перед игроком и может привести к тому, что идеи будут игнорироваться до заполнения всех слотов.§!"
RULE_OPTION_RULE_5_PERCENT: "Изменение стоимости £pol_power£: §G-5.00%§!"
RULE_5_PERCENT_EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION_DESC: "§YСтраны с ИИ§! §Gполучат§! дополнительный бонус §Y5.00%§! к стоимости £pol_power£. \n\nЭто снижение влияет на слоты §YТорговые Законы§!, §YПолитические Советники§!, §YИсследования и Производство§! и §YВоенный Штаб§!. \n\n§YВы можете выбрать любое из этих снижений, чтобы ИИ чаще тратил Политическую силу на эти слоты, а не только на идеи, однако это даёт ИИ преимущество перед игроком и может привести к тому, что идеи будут игнорироваться до заполнения всех слотов.§!"
RULE_OPTION_RULE_10_PERCENT: "Изменение стоимости £pol_power£: §G-10.00%§!"
RULE_10_PERCENT_EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION_DESC: "§YСтраны с ИИ§! §Gполучат§! дополнительный бонус §Y10.00%§! к стоимости £pol_power£. \n\nЭто снижение влияет на слоты §YТорговые Законы§!, §YПолитические Советники§!, §YИсследования и Производство§! и §YВоенный Штаб§! и т.д."
RULE_OPTION_RULE_15_PERCENT: "Изменение стоимости £pol_power£: §G-15.00%§!"
RULE_15_PERCENT_EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION_DESC: "§YСтраны с ИИ§! §Gполучат§! дополнительный бонус §Y15.00%§! к стоимости £pol_power£. \n\nЭто снижение влияет на слоты §YТорговые Законы§!, §YПолитические Советники§!, §YИсследования и Производство§! и §YВоенный Штаб§! и т.д."
RULE_OPTION_RULE_20_PERCENT: "Изменение стоимости £pol_power£: §G-20.00%§!"
RULE_20_PERCENT_EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION_DESC: "§YСтраны с ИИ§! §Gполучат§! дополнительный бонус §Y20.00%§! к стоимости £pol_power£. \n\nЭто снижение влияет на слоты §YТорговые Законы§!, §YПолитические Советники§!, §YИсследования и Производство§! и §YВоенный Штаб§! и т.д."
RULE_OPTION_RULE_25_PERCENT: "Изменение стоимости £pol_power£: §G-25.00%§!"
RULE_25_PERCENT_EU4_LIKE_IDEAS_RULE_AI_PP_COST_REDUCTION_DESC: "§YСтраны с ИИ§! §Gполучат§! дополнительный бонус §Y25.00%§! к стоимости £pol_power£. \n\nЭто снижение влияет на слоты §YТорговые Законы§!, §YПолитические Советники§!, §YИсследования и Производство§! и §YВоенный Штаб§! и т.д."
RULE_OPTION_RULE_30_PERCENT: "Изменение стоимости £pol_power£: §G-30.00%§!"
