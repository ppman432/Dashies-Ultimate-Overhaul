EU4_LIKE_IDEAS_RULES: "Правила Идей"

EU4_LIKE_IDEAS_RULE_SHOW_INTRODUCTION: "Показать Всплывающее Введение"
YES_EU4_LIKE_IDEAS_RULE_SHOW_INTRODUCTION_DESC: "Если установлено §YДа§!, игроки-человеки §Gполучат§! всплывающее окно в начале игры с текстом и изображениями, объясняющими механику мода."
NO_EU4_LIKE_IDEAS_RULE_SHOW_INTRODUCTION_DESC: "Если установлено §YНет§!, игроки-человеки §Rне получат§! всплывающее окно в начале игры с текстом и изображениями, объясняющими механику мода."

EU4_LIKE_IDEAS_RULE_LIMITED_IDEA_GROUPS_FROM_SAME_TYPE: "Ограничения Групп Идей"
ENABLED_EU4_LIKE_IDEAS_RULE_LIMITED_IDEA_GROUPS_FROM_SAME_TYPE_DESC: "Если установлено §YВключено§!, страны §Rне смогут§! выбирать более §Y50%§! своих групп идей из одной категории (Административные, Дипломатические, Военные), что приведёт к более разнообразному выбору."
DISABLED_EU4_LIKE_IDEAS_RULE_LIMITED_IDEA_GROUPS_FROM_SAME_TYPE_DESC: "Если установлено §YОтключено§!, страны §Gсмогут§! выбирать более §Y50%§! групп идей из одной категории."
NO_TIME_AND_TYPE_LIMIT: "Без Ограничений по Времени и Типу"
NO_TIME_AND_TYPE_LIMIT_EU4_LIKE_IDEAS_RULE_LIMITED_IDEA_GROUPS_FROM_SAME_TYPE_DESC: "Если установлено §YБез Ограничений по Времени и Типу§!, все слоты идей §Gбудут§! разблокированы с начала, и страны §Gсмогут§! выбирать более §Y50%§! групп идей из одной категории."

EU4_LIKE_IDEAS_RULE_IDEA_COST: "Базовая Стоимость Идей"
RULE_25_PP: "§Y25§! £pol_power£"
RULE_25_PP_EU4_LIKE_IDEAS_RULE_IDEA_COST_DESC: "Базовая стоимость завершения одной идеи — §Y25§! Политической силы."
RULE_50_PP: "§Y50§! £pol_power£"
RULE_50_PP_EU4_LIKE_IDEAS_RULE_IDEA_COST_DESC: "Базовая стоимость завершения одной идеи — §Y50§! Политической силы."
RULE_100_PP: "§Y100§! £pol_power£"
RULE_100_PP_EU4_LIKE_IDEAS_RULE_IDEA_COST_DESC: "Базовая стоимость завершения одной идеи — §Y100§! Политической силы."
RULE_150_PP: "§Y150§! £pol_power£"
RULE_150_PP_EU4_LIKE_IDEAS_RULE_IDEA_COST_DESC: "Базовая стоимость завершения одной идеи — §Y150§! Политической силы."
RULE_200_PP: "§Y200§! £pol_power£"
RULE_200_PP_EU4_LIKE_IDEAS_RULE_IDEA_COST_DESC: "Базовая стоимость завершения одной идеи — §Y200§! Политической силы."
EU4_LIKE_IDEAS_RULE_AI: "Использование ИИ"
ENABLED_EU4_LIKE_IDEAS_RULE_AI_DESC: "Если установлено §YВключено§!, страны с ИИ §Gбудут§! выбирать группы идей, идеи и политики."
RULE_OPTION_ONLY_MAJORS: "Только Великие державы"
ONLY_MAJORS_EU4_LIKE_IDEAS_RULE_AI_DESC: "Если установлено §YОграничено§!, страны с ИИ §Gбудут§! выбирать группы идей, идеи и политики только если они §YВеликие державы§!."
RULE_OPTION_ONLY_MINORS: "Только Мелкие страны"
ONLY_MINORS_EU4_LIKE_IDEAS_RULE_AI_DESC: "Если установлено §YОграничено§!, страны с ИИ §Gбудут§! выбирать группы идей, идеи и политики только если они §Yне Великие державы§!."
DISABLED_EU4_LIKE_IDEAS_RULE_AI_DESC: "Если установлено §YОтключено§!, страны с ИИ §Rне будут§! выбирать группы идей, идеи и политики. \n\n§OЭто делает правило игры §YЗадержка Использования ИИ§! неактивным.§W"
DISALLOW_IDEAS_THAT_ALLOW_COLLAB_GOVS_EU4_LIKE_IDEAS_RULE_AI: "Ограничено"
DISALLOW_IDEAS_THAT_ALLOW_COLLAB_GOVS_EU4_LIKE_IDEAS_RULE_AI_DESC: "Если установлено §YОграничено§!, ИИ §Rне сможет§! выбирать группы идей, которые позволяют стране использовать Сотрудничающие правительства."

EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY: "Задержка Использования ИИ"
NONE_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY: "Нет"
NONE_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это сразу, как только смогут."
RULE_DELAY_1_YEAR: "§Y1§! Год"
RULE_DELAY_1_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y1§! год после начала игры, если возможно."
RULE_DELAY_2_YEAR: "§Y2§! Года"
RULE_DELAY_2_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y2§! года после начала игры, если возможно."
RULE_DELAY_3_YEAR: "§Y3§! Года"
RULE_DELAY_3_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y3§! года после начала игры, если возможно."
RULE_DELAY_4_YEAR: "§Y4§! Года"
RULE_DELAY_4_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y4§! года после начала игры, если возможно."
RULE_DELAY_5_YEAR: "§Y5§! Лет"
RULE_DELAY_5_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y5§! лет после начала игры, если возможно."
RULE_DELAY_6_YEAR: "§Y6§! Лет"
RULE_DELAY_6_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y6§! лет после начала игры, если возможно."
RULE_DELAY_7_YEAR: "§Y7§! Лет"
RULE_DELAY_7_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y7§! лет после начала игры, если возможно."
