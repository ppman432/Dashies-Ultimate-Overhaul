RULE_DELAY_9_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y9§! лет после начала игры, если возможно."
