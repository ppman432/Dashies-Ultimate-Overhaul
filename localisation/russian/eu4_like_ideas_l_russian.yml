 # Startup Window:
EU4_LIKE_IDEAS_STARTUP_WINDOW_TITLE: "Введение в мод Ideas"
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_1_TEXT: "Приветствуем вас, спасибо за то, что играете с модом §YEU4 Style Ideas§! Это всплывающее окно предназначено для ознакомления с механикой мода, но вы можете просто нажать кнопку закрытия, чтобы начать играть. Также вы можете отключить это окно в §Yправилах игры§!.\n\nНа изображении ниже показано, где находится кнопка для открытия §YОкна Идей§! (отмечена §Rкрасным§!) и где находится пользовательское уведомление, связанное с его механикой (отмечено §Gзелёным§!)."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_2_TEXT: "При нажатии на кнопку, обведённую §Rкрасным§! на изображении выше, открывается §YОкно Идей§!. На втором изображении показано это окно. \nОно включает множество элементов: от небольшой общей информации вверху, до ваших национальных идей, выбранных групп идей и выбранных политик. В зависимости от вашего выбора в правилах игры, у вас будет §Y2§! до §Y26§! слотов групп идей (по умолчанию §Y8§!), которые разблокируются в зависимости от даты. На изображении ниже уже разблокированы 3 слота (один из которых отмечен §Rкрасным§!), на которые можно нажать, чтобы открыть окно выбора §YГруппы Идей§!."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_3_TEXT: "В §YОкне Выбора Группы Идей§! вы видите список всех групп идей, которые можно выбрать, разделённых на три категории: §YАдминистративные§!, §YДипломатические§! и §YВоенные§!. Хотя группы идей могут иметь эффекты для всех категорий, обычно они сосредоточены на специфике своей категории. \nПри наведении на кнопку группы (отмечена §Gзелёным§!) отображаются все идеи этой группы и их эффекты, также можно навести курсор на отдельные идеи, чтобы увидеть их названия, описания и эффекты. Нажатие на кнопку выбирает группу идей и запрашивает подтверждение выбора. \nПри наведении на маленький значок политики (отмечен §Rкрасным§!) отображаются политики, связанные с этой группой идей, их эффекты и требуемая другая группа идей. Вторая группа будет окрашена, если вы уже её выбрали."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_4_5_TEXT: "Ниже показано, как выглядят подсказки для значка политики (§Rслева§!) и кнопки группы идей (§Gсправа§!)."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_6_TEXT: "После выбора группы идей §YОкно Выбора Группы Идей§! закрывается, и открывается §YОкно Идей§!. Свободный слот заменяется выбранной группой, показывая её категорию, название и отдельные идеи. Чтобы завершить идею, нужно кликнуть по ней. Можно завершить только следующую доступную идею с зелёным фоном (отмечена §Rкрасным§!). Последующие идеи будут заблокированы, пока не будут разблокированы предыдущие. Нажатие на доступную идею разблокирует её и даёт бонусы, но требует §Y£pol_power£§!. Если недостаточно §Y£pol_power£§!, фон следующей доступной идеи будет красным. Полоса под идеями показывает, хватает ли вам §Y£pol_power£§!. \nВы также можете удалить выбранную группу идей, нажав кнопку удаления (отмечена §Gзелёным§!), что возвращает часть использованного §Y£pol_power£§! и удаляет группу вместе с уже завершёнными идеями и их бонусами."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_7_TEXT: "За каждые §Y3§! разблокированные идеи вы получаете одну из ваших национальных идей. Так как у вас §Y7§! национальных идей, нужно завершить §Y21§! идеи, чтобы полностью открыть национальные идеи. Наведение на значки модификаторов (отмечены §Rкрасным§!) покажет название, описание и эффект идеи."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_8_TEXT: "Каждая национальная группа идей также имеет 2 §YТрадиции§! и 1 §YАмбицию§!. Амбиция даётся после завершения всех 7 национальных идей. Традиции активны с самого начала. \nБонусы отображаются рядом с названием национальной группы идей в краткой форме (отмечены §Rкрасным§!), а при наведении показываются полностью."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_9_TEXT: "Внизу показаны выбранные политики (отмечены §Rкрасным§!), которые можно удалить, нажав на их значок. Политики можно удалять только через §Y1 месяц§! после их введения. \nКнопка §YДобавить Политику§! (отмечена §Gзелёным§!) справа открывает окно с доступными политиками."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_10_TEXT: "§YОкно Политик§! показывает все политики, для которых выбрана хотя бы одна группа идей. В правом верхнем углу, рядом с кнопкой закрытия, есть кнопка для настройки уведомлений (отмечена §Gзелёным§!). Она открывает меню со всеми доступными политиками и кнопками для включения или отключения уведомления. Также есть кнопка-стрелка (отмечена §Rкрасным§!), открывающая или закрывающая боковое меню для полного отключения и повторного включения конкретных уведомлений."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_11_TEXT: "Каждая запись политики имеет кнопку с золотой рамкой для выбора политики (отмечена §Gзелёным§!). Нажатие выбирает политику и запрашивает подтверждение. На кнопке указаны название политики, её значок и эффекты. Наведение на кнопку показывает эффекты и требуемые группы идей. \nТакже есть кнопка (отмечена §Rкрасным§!) для прямого отключения или повторного включения уведомления конкретной политики, чтобы не искать её в списке."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_12_TEXT: "Наконец, когда можно переключить идеи на другой набор, появляется решение об этом. Оно вызывает событие с предварительным просмотром нового набора идей."
EU4_LIKE_IDEAS_STARTUP_WINDOW_IMAGE_13_TEXT: "Надеюсь, это краткое введение помогло вам понять мод и его механику. Спасибо за внимание и приятной игры! \n\nНиже показано, как отключить это всплывающее окно для следующей игры."

