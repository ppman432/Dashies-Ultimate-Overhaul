RULE_DELAY_8_YEAR_EU4_LIKE_IDEAS_AI_IDEA_USAGE_DELAY_DESC: "Страны с ИИ, которым разрешено использовать идеи, сделают это §Y8§! лет после начала игры, если возможно."
