eu4_like_ideas_flavor_events.EVTDESC1: "Бисмарк был первым из двух линейных кораблей класса Бисмарк, построенных для Кригсмарине. Назван в честь канцлера Отто фон Бисмарка, корабль был заложен на верфи Blohm & Voss в Гамбурге в июле 1936 года и спущен на воду в феврале 1939 года. Работа была завершена в августе 1940 года, когда корабль был введён в состав германского флота. Бисмарк и его сестринский корабль Тирпиц были крупнейшими линейными кораблями, когда-либо построенными в Германии, и одними из крупнейших среди европейских держав."
eu4_like_ideas_flavor_events1.EVTOPT1: "Король Океана!"

eu4_like_ideas_events.EVTNAME3: "Новые Традиции и Амбиции"
eu4_like_ideas_events.EVTDESC3: "Мы можем принять новые национальные идеи. Следует ли нам придерживаться текущих или сменить их на новые?"
eu4_like_ideas_events3.EVTOPT1: "Принять новые идеи."
eu4_like_ideas_events3.EVTOPT2: "Оставить [Root.GetNationalIdeasName]."

eu4_like_ideas_events.EVTNAME1000: "Перезагрузка групп идей?"
eu4_like_ideas_events.EVTDESC1000: "Вы запустили это событие вручную. Оно предназначено для перезагрузки групп идей, что необходимо, если вы хотите, чтобы страны могли выбирать группы, добавленные обновлением после начала этой сохранённой игры. Это не удалит никакие группы идей или идеи, но чтобы избежать багов, рекомендуется поставить игру на паузу перед выбором первой опции. \nВы хотите перезагрузить группы идей?"
eu4_like_ideas_events1000.EVTOPT1: "Да, перезагрузить группы идей."
eu4_like_ideas_events1000.EVTOPT2: "Нет, я передумал."

