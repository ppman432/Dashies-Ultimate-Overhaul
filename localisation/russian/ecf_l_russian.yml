#OWB Ideologies
continuous_people_principles:0 "Принципы народа"
continuous_people_principles_desc:0 "С учётом состояния пустошей, защита будущего идеологии — лучший путь."

continuous_intellectuals_principles:0 "Принципы интеллигенции"
continuous_intellectuals_principles_desc:0 "С учётом состояния пустошей, защита будущего идеологии — лучший путь."

continuous_elites_principles:0 "Принципы элиты"
continuous_elites_principles_desc:0 "С учётом состояния пустошей, защита будущего идеологии — лучший путь."

continuous_ruler_principles:0 "Принципы правителя"
continuous_ruler_principles_desc:0 "С учётом состояния пустошей, защита будущего идеологии — лучший путь."

#Focuses Continued
continuous_synthetic_nation:0 "Синтетическая нация"
continuous_synthetic_nation_desc:0 "Недостаток нефти и резины ограничивает возможности армии. Финансирование синтетических заводов поможет решить проблему."

continuous_infrastructure_improvements:0 "Улучшение инфраструктуры"
continuous_infrastructure_improvements_desc:0 "Плохие дороги тормозят промышленность и передвижение войск. Увеличение бюджета на инфраструктуру улучшит ситуацию."

continuous_new_naval_structures:0 "Новые морские сооружения"
continuous_new_naval_structures_desc:0 "Фокус на постройку военно-морских баз и доков позволит восстановить морскую мощь страны."

continuous_new_aerial_structures:0 "Новые воздушные сооружения"
continuous_new_aerial_structures_desc:0 "Фокус на авиабазы и радиолокационные станции позволит восстановить воздушное превосходство."

continuous_defense_in_depth:0 "Глубокая оборона"
continuous_defense_in_depth_desc:0 "Политическая нестабильность требует масштабного строительства укреплений для защиты от возможных вторжений."

continuous_exploit_natural_resources:0 "Разработка природных ресурсов"
continuous_exploit_natural_resources_desc:0 "Увеличение расходов на добычу ресурсов поддержит внешнюю торговлю и военное строительство."

continuous_lower_industrial_taxes:0 "Снижение промышленных налогов"
continuous_lower_industrial_taxes_desc:0 "Снижение налогов на гражданскую промышленность позволит предприятиям развиваться. Для баланса бюджета придётся повысить налоги на военную промышленность."

continuous_lower_military_taxes:0 "Снижение военных налогов"
continuous_lower_military_taxes_desc:0 "Снижение налогов на военные предприятия даст им возможность развиваться. Для баланса бюджета придётся увеличить налоги на гражданскую промышленность."

continuous_industry_for_autonomy:0 "Промышленность для автономии"
continuous_industry_for_autonomy_desc:0 "Увеличение автономии в обмен на долю промышленности поможет обрести независимость и принесёт выгоду правителю."

continuous_foreign_investments:0 "Иностранные инвестиции"
continuous_foreign_investments_desc:0 "Инвестиции в зарубежные территории помогут финансово, предоставив долю доходов и возможность назначать министров."

continuous_volunteers_program:0 "Программа добровольцев"
continuous_volunteers_program_desc:0 "Программа добровольцев позволит влиять на исход войн за границей, убеждая население помогать союзникам."

continuous_temporary_agents:0 "Временные агенты"
continuous_temporary_agents_desc:0 "§R\"СЕКРЕТНО\"§!"

continuous_counter_intelligence:0 "Контрразведка"
continuous_counter_intelligence_desc:0 "Среди нас есть §Rсамозванцы§!."

#Research Focus
continuous_infantry_equipment_research:0 "Исследования пехотного снаряжения"
continuous_infantry_equipment_research_desc:0 "Огнестрельное оружие — одно из величайших изобретений. Почему бы его не улучшить?"

continuous_air_equipment_research:0 "Исследования авиационного снаряжения"
continuous_air_equipment_research_desc:0 "Самолёты доказали эффективность. Их улучшение даст преимущество."

continuous_naval_equipment_research:0 "Исследования флота"
continuous_naval_equipment_research_desc:0 "Фокус на качестве флота даст шанс против врагов."

continuous_artillery_research:0 "Исследования артиллерии"
continuous_artillery_research_desc:0 "Артиллерия была ключом в прошлых войнах и будет таковой в будущем."

continuous_armor_research:0 "Исследования бронетехники"
continuous_armor_research_desc:0 "Использование танков в армии обеспечит быструю победу, учитывая уроки прошлой войны."

continuous_industry_research:0 "Промышленные исследования"
continuous_industry_research_desc:0 "Лучшие технологии и строительство заводов увеличат производство оружия и обеспечат победы."

continuous_rocketry_research:0 "Исследования ракетной техники"
continuous_rocketry_research_desc:0 "\"Базовые исследования — это когда я не знаю, что делаю.\" — Вернер фон Браун"

continuous_nuclear_research:0 "Ядерные исследования"
continuous_nuclear_research_desc:0 "\"Теперь я стал смертью, разрушителем миров.\" — Джулиус Роберт Оппенгеймер"

#OWB Research Focus
continuous_owb_robotics_research:0 "Исследования робототехники"
continuous_owb_robotics_research_desc:0 "\"Mr. Handy, это просто работает!\" — Роберт Эдвин Хаус, основатель RobCo"

