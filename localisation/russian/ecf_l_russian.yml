l_russian:
continuous_thinking_outside_box:0 "Инвестирование в альтернативные науки"
continuous_thinking_outside_box_desc:0 "В мире, где технологии постоянно меняются и всё непредсказуемо, мы должны находить новые способы оставаться на шаг впереди конкурентов любыми средствами."

continuous_increase_war_support:0 "Милитаристская пропаганда"
continuous_increase_war_support_desc:0 "Слишком долго наша нация игнорировала растущую военную напряжённость вокруг нас. Нам следует мобилизовать народ к неизбежной войне."

continuous_increase_stability:0 "Социальные реформы"
continuous_increase_stability_desc:0 "Нация оказалась в социальном кризисе. Политические волнения требуют срочного вмешательства для стабилизации ситуации."

continuous_science_haven:0 "Научное убежище"
continuous_science_haven_desc:0 "Технологии отстают от соседей, поэтому нужно сосредоточить все ресурсы на их улучшении."

continuous_foreign_volunteers:0 "Иностранные добровольцы"
continuous_foreign_volunteers_desc:0 "Недостаток рабочей силы препятствует дипломатии. Обещания гражданам соседних стран сражаться на нашей стороне за землю и деньги помогут решить эту проблему."

continuous_immigration:0 "Иммиграция"
continuous_immigration_desc:0 "Постоянное решение проблемы рабочей силы — смягчение иммиграционных законов и улучшение условий жизни. Это разозлит ультранационалистов, верящих в силу армии без иностранных добровольцев."

continuous_consumer_goods_investment:0 "Инвестиции в потребительские товары"
continuous_consumer_goods_investment_desc:0 "Ограниченные ресурсы используются неэффективно. Поддержка НИОКР по рационализации ресурсов поможет сбалансировать военные и гражданские нужды."

continuous_land_doctrine_research:0 "Учения по сухопутной доктрине"
continuous_land_doctrine_research_desc:0 "Война — это борьба стратегий. Упреждение врага в стратегии даст преимущество в будущих конфликтах."

continuous_air_doctrine_research:0 "Учения по воздушной доктрине"
continuous_air_doctrine_research_desc:0 "Воздушные силы — ключ к современным войнам. Оптимальное их использование даст технологическое превосходство."

continuous_naval_doctrine_research:0 "Учения по морской доктрине"
continuous_naval_doctrine_research_desc:0 "Новые формы морской войны изменят представление о флоте. Фокус на технологии флота позволит господствовать на море."

continuous_military_think_tank:0 "Военный аналитический центр"
continuous_military_think_tank_desc:0 "Создание аналитического центра с участием опытных маршалов и новых генералов ускорит реализацию военных планов и повысит квалификацию командиров."

continuous_national_defense:0 "Национальная оборона"
continuous_national_defense_desc:0 "При угрозе вторжения важно снабжать гражданское население оружием и укреплять оборонительные сооружения."

continuous_resistance_suppression:0 "Подавление сопротивления"
continuous_resistance_suppression_desc:0 "Сопротивление гражданских непокорных регионов требует перераспределения промышленности на снабжение гарнизонов."

continuous_renounce_foreign_occupation:0 "Отказ от иностранной оккупации"
continuous_renounce_foreign_occupation_desc:0 "Правительство в изгнании должно поддерживать дух сопротивления среди населения и информировать о ходе войны и возвращении власти."

continuous_work_with_local_leaders:0 "Работа с местными лидерами"
continuous_work_with_local_leaders_desc:0 "Для улучшения отношений с местными жителями необходимо взаимодействовать с их лидерами и снизить сопротивление новым порядкам."

continuous_national_teachings:0 "Национальное воспитание"
continuous_national_teachings_desc:0 "Чтобы контролировать новые территории, необходимо обучать население идеологии и культуре страны."

continuous_nationalism:0 "Национализм"
continuous_nationalism_desc:0 "В условиях выживания необходимо массово распространять пропаганду, убеждая людей бороться любыми средствами."

#Normal Ideologies
continuous_political_correction_democratic:0 "Политическая корректировка"
continuous_political_correction_democratic_desc:0 "Демократия доказала свою эффективность. Устранение чуждых идей в правительстве поможет соответствовать большинству."

continuous_political_correction_communist:0 "Политические чистки"
continuous_political_correction_communist_desc:0 "Коммунизм — лучшая идеология. Устранение оппозиции обеспечит политическое будущее нации."

continuous_political_correction_fascist:0 "Политические чистки"
continuous_political_correction_fascist_desc:0 "Фашизм укрепил нацию. Любая оппозиция несёт угрозу безопасности идеологии."

continuous_political_correction_neutrality:0 "Политические соперники"
continuous_political_correction_neutrality_desc:0 "Политическая безопасность лидера под угрозой. Создаётся кабинет для выявления сторонников и противников, оппозиция подавляется."

#Kaiser Ideologies
continuous_totalist_principles:0 "Принципы тотализма"
continuous_totalist_principles_desc:0 "В текущей ситуации обеспечение будущего идеологии — лучший путь."

