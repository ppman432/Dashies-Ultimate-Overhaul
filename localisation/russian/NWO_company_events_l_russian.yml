contractGENERIC.3.d:0 "Дальнейшая разработка нашего Light Tank III привела к появлению нового лёгкого артиллерийского варианта с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.4.t:0 "Введение новой лёгкой зенитной артиллерии"
contractGENERIC.4.d:0 "Дальнейшая разработка нашего Light Tank III привела к появлению нового лёгкого зенитного артиллерийского варианта с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.5.t:0 "Конкурс проектов нового среднего танка"
contractGENERIC.5.d:0 "Ранее мы всегда имели две отдельные категории танков, но давление войны и советы военных экспертов привели к появлению планов нового промежуточного типа танка между лёгкими и тяжёлыми — среднего танка. Как первый в своём роде, мы должны тщательно выбрать прототип."

contractGENERIC.6.t:0 "Введение нового среднего истребителя танков"
contractGENERIC.6.d:0 "Дальнейшая разработка нашего Medium Tank I привела к появлению нового варианта среднего истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.7.t:0 "Введение новой средней САУ"
contractGENERIC.7.d:0 "Дальнейшая разработка нашего Medium Tank I привела к появлению нового варианта средней артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.8.t:0 "Введение новой средней зенитной артиллерии"
contractGENERIC.8.d:0 "Дальнейшая разработка нашего Medium Tank I привела к появлению нового варианта средней зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.9.t:0 "Конкурс проектов нового среднего танка"
contractGENERIC.9.d:0 "Успехи наших средних танков значительно повысили интерес к их возможностям. Поэтому был запрошен новый модельный проект, и первые прототипы уже подготовлены для вашего рассмотрения."

contractGENERIC.10.t:0 "Введение нового среднего истребителя танков"
contractGENERIC.10.d:0 "Дальнейшая разработка нашего Medium Tank II привела к появлению нового варианта среднего истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.11.t:0 "Введение новой средней САУ"
contractGENERIC.11.d:0 "Дальнейшая разработка нашего Medium Tank II привела к появлению нового варианта средней артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.12.t:0 "Введение новой средней зенитной артиллерии"
contractGENERIC.12.d:0 "Дальнейшая разработка нашего Medium Tank II привела к появлению нового варианта средней зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.13.t:0 "Конкурс проектов нового среднего танка"
contractGENERIC.13.d:0 "Это наш наибольший прогресс в области средних танков. Несколько многообещающих прототипов были предоставлены нашими промышленными предприятиями, и теперь остаётся выбрать один для полномасштабной разработки."

contractGENERIC.14.t:0 "Введение нового среднего истребителя танков"
contractGENERIC.14.d:0 "Дальнейшая разработка нашего Medium Tank III привела к появлению нового варианта среднего истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.15.t:0 "Введение новой средней САУ"
contractGENERIC.15.d:0 "Дальнейшая разработка нашего Medium Tank III привела к появлению нового варианта средней САУ с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.16.t:0 "Введение новой средней зенитной артиллерии"
contractGENERIC.16.d:0 "Дальнейшая разработка нашего Medium Tank III привела к появлению нового варианта средней зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.17.t:0 "Конкурс проектов нового современного танка"
contractGENERIC.17.d:0 "Предыдущие разработки танков привели к появлению новой концепции среди наших промышленных предприятий — по-настоящему «современного» танка, предназначенного для выполнения любых ролей. В проект было вложено много усилий, и ваше решение определит направление наших танковых проектов на десятилетия."

contractGENERIC.18.t:0 "Введение нового современного истребителя танков"
contractGENERIC.18.d:0 "Дальнейшая разработка нашего современного танка привела к появлению нового варианта современного истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.19.t:0 "Введение новой современной САУ"
contractGENERIC.19.d:0 "Дальнейшая разработка нашего современного танка привела к появлению нового варианта современной САУ с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.20.t:0 "Введение новой современной зенитной артиллерии"
contractGENERIC.20.d:0 "Дальнейшая разработка нашего современного танка привела к появлению нового варианта современной зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractGENERIC.21.t:0 "Конкурс проектов нового тяжёлого танка"
contractGENERIC.21.d:0 "Основываясь на успехах нашего первоначального проекта тяжёлого танка, мы считаем, что новый модельный проект будет не только способен выдерживать более сильный огонь врага, но и пробивать новые поколения бронированных противников. Остаётся лишь услышать ваши мнения о наших прототипах."

