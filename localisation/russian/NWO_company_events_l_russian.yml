NWO_USA_Ford_Result:0 "Компания Ford выпускает надёжные танки, с некоторыми компромиссами по огневой мощи."
NWO_USA_GM_Result:0 "General Motors выпускает проекты, ориентированные на скорость и лёгкие атаки."
NWO_USA_Chrysler_Result:0 "Chrysler производит прочные танки, способные наносить и выдерживать серьёзный урон."
NWO_GER_Porsche_Result:0 "Porsche производит невероятно быстрые танки, но их надёжность оставляет желать лучшего."
NWO_GER_MAN_Result:0 "Maschinenfabrik Augsburg-Nürnberg производит танки, способные противостоять вражеским танкам, с небольшими проблемами надёжности."
NWO_GER_Henschel_Result:0 "Henschel & Son производят танки с сильной бронёй, но с небольшими проблемами надёжности."
NWO_SOV_Morozov_Result:0 "Morozov обеспечивает прирост как лёгкой, так и тяжёлой атаки."
NWO_SOV_Astrov_Result:0 "Astrov производит проекты, ориентированные на броню и надёжность."
NWO_SOV_OKMO_Result:0 "OKMO славится производством танков с высокой вероятностью прорыва."

contractUSA.1.t:0 "Конкурс проектов для M24 Chaffee"
contractUSA.1.d:0 "Программа контракта на лёгкий танк M24 Ордонанс Корпус подошла к завершению. Запрашивался проект трёхместного танка массой до 20 тонн, вооружённого 75-мм пушкой и способного развивать как минимум 35 миль/ч на дорогах. Было представлено несколько многообещающих прототипов."
contractUSA.1.a:0 "Выбираем компанию Ford Motor Company"
contractUSA.1.b:0 "Выбираем General Motors"
contractUSA.1.c:0 "Выбираем Chrysler"

contractUSA.2.t:0 "Введение T48"
contractUSA.2.d:0 "Дальнейшая разработка M24 Chaffee привела к появлению нового варианта лёгкого истребителя танков и унаследовала некоторые конструктивные решения наших промышленных предприятий."
contractUSA.2.a:0 "Компания Ford будет довольна"
contractUSA.2.b:0 "General Motors будет довольна"
contractUSA.2.c:0 "Chrysler будет довольна"

contractUSA.3.t:0 "Введение нового лёгкого САУ"
contractUSA.3.d:0 "Дальнейшая разработка M24 Chaffee привела к появлению нового лёгкого артиллерийского варианта, с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.4.t:0 "Введение новой лёгкой зенитной артиллерии"
contractUSA.4.d:0 "Дальнейшая разработка Chaffee привела к появлению нового лёгкого зенитного артиллерийского варианта с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.5.t:0 "Конкурс проектов для M3 Lee"
contractUSA.5.d:0 "Наш текущий проект по модернизации армии США привёл к конкурсу проектов для машины, более подходящей для боя, чем наш провальный M2. Так как проект башенного среднего танка ещё несколько лет не будет готов, был запрошен промежуточный проект с башенной пушкой 75 мм, и несколько прототипов были представлены."

contractUSA.6.t:0 "Введение M10"
contractUSA.6.d:0 "Дальнейшая разработка M3 Lee привела к появлению нового варианта среднего истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.7.t:0 "Введение M7 Priest"
contractUSA.7.d:0 "Дальнейшая разработка M3 Lee привела к появлению нового варианта средней артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.8.t:0 "Введение новой средней зенитной артиллерии"
contractUSA.8.d:0 "Дальнейшая разработка M3 Lee привела к появлению нового варианта средней зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.9.t:0 "Конкурс проектов для M4 Sherman"
contractUSA.9.d:0 "Программа среднего танка M4 подошла к завершению цикла разработки, с несколькими многообещающими кандидатами, основанными на конструкции M3. Теперь остаётся выбрать окончательную модель для массового производства."

contractUSA.10.t:0 "Введение M18"
contractUSA.10.d:0 "Дальнейшая разработка M4 Sherman привела к появлению нового варианта среднего истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.11.t:0 "Введение M12"
contractUSA.11.d:0 "Дальнейшая разработка M4 Sherman привела к появлению нового варианта средней артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.12.t:0 "Введение новой средней зенитной артиллерии"
contractUSA.12.d:0 "Дальнейшая разработка M4 Sherman привела к появлению нового варианта средней зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.13.t:0 "Конкурс проектов для T20"
contractUSA.13.d:0 "Даже после завершения дизайна M4 Sherman, Ордонанс Корпус армии США начал разработку преемника Sherman. То, что начиналось как проект MX, теперь стало серией средних танков T20. Основываясь на британских конструкциях, Ордонанс Корпус уверен в потенциале T20, как и наши промышленные предприятия."

contractUSA.14.t:0 "Введение M36"
contractUSA.14.d:0 "Дальнейшая разработка T20 привела к появлению нового варианта среднего истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.15.t:0 "Введение M40"
contractUSA.15.d:0 "Дальнейшая разработка T20 привела к появлению нового варианта средней САУ с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.16.t:0 "Введение новой средней зенитной артиллерии"
contractUSA.16.d:0 "Дальнейшая разработка T20 привела к появлению нового варианта средней зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.17.t:0 "Конкурс проектов для M46 Patton"
contractUSA.17.d:0 "Хотя мнения среди нашего персонала и союзников относительно генерала-лейтенанта Джорджа Паттона различаются, никто не может отрицать его рвение в развитии американской танковой доктрины. Логично, что следующее поколение современных бронемашин носит его имя."

contractUSA.18.t:0 "Введение нового современного истребителя танков"
contractUSA.18.d:0 "Дальнейшая разработка M46 Patton привела к появлению нового варианта современного истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.19.t:0 "Введение новой современной САУ"
contractUSA.19.d:0 "Дальнейшая разработка M46 Patton привела к появлению нового варианта современной САУ с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.20.t:0 "Введение новой современной зенитной артиллерии"
contractUSA.20.d:0 "Дальнейшая разработка M46 Patton привела к появлению нового варианта современной зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.21.t:0 "Конкурс проектов для M6A1"
contractUSA.21.d:0 "В рамках быстрой модернизации нашего моторного парка для новой эры войн, начальник пехоты запросил новый вариант тяжёлого танка. Несмотря на опасения по поводу первоначального M6 для европейских и азиатских условий, M6A1 — шаг в правильном направлении, который многие наши промышленные предприятия готовы поддержать."

contractUSA.22.t:0 "Введение нового тяжёлого истребителя танков"
contractUSA.22.d:0 "Дальнейшая разработка M6A1 привела к появлению нового варианта тяжёлого истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.23.t:0 "Введение новой тяжёлой САУ"
contractUSA.23.d:0 "Дальнейшая разработка M6A1 привела к появлению нового варианта тяжёлой САУ с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.24.t:0 "Введение новой тяжёлой зенитной артиллерии"
contractUSA.24.d:0 "Дальнейшая разработка M6A1 привела к появлению нового варианта тяжёлой зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.25.t:0 "Конкурс проектов для M26 Pershing"
contractUSA.25.d:0 "После успеха средних и тяжёлых танков Ордонанс Корпус снова представил проект нового тяжёлого танка — M26 Pershing. Pershing показал отличные результаты в тестах против немецких и советских моделей, теперь остаётся выбрать прототип, который удовлетворит самого Blackjack."

contractUSA.26.t:0 "Введение нового тяжёлого истребителя танков"
contractUSA.26.d:0 "Дальнейшая разработка M26 Pershing привела к появлению нового варианта тяжёлого истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.27.t:0 "Введение T92"
contractUSA.27.d:0 "Дальнейшая разработка M26 Pershing привела к появлению нового варианта тяжёлой САУ с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.28.t:0 "Введение новой тяжёлой зенитной артиллерии"
contractUSA.28.d:0 "Дальнейшая разработка M26 Pershing привела к появлению нового варианта тяжёлой зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.29.t:0 "Конкурс проектов для T95"
contractUSA.29.d:0 "Столкнувшись с новым поколением стационарной обороны, такой как линия Зигфрида и прибрежные крепости Японии, Ордонанс Корпус разработал планы для сверхтяжёлого бронированного артиллерийского носителя. Это самые тяжёлые и дорогостоящие машины, которые мы когда-либо заказывали, поэтому выбор производителя должен быть тщательным."

contractUSA.30.t:0 "Введение нового сверхтяжёлого истребителя танков"
contractUSA.30.d:0 "Дальнейшая разработка T95 привела к появлению нового варианта тяжёлого истребителя танков с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.31.t:0 "Введение нового сверхтяжёлого САУ"
contractUSA.31.d:0 "Дальнейшая разработка T95 привела к появлению нового варианта тяжёлой САУ с унаследованными конструктивными решениями наших промышленных предприятий."

contractUSA.32.t:0 "Введение новой сверхтяжёлой зенитной артиллерии"
contractUSA.32.d:0 "Дальнейшая разработка T95 привела к появлению нового варианта тяжёлой зенитной артиллерии с унаследованными конструктивными решениями наших промышленных предприятий."
contractGENERIC.1.t:0 "Конкурс проектов нового лёгкого танка"
contractGENERIC.1.d:0 "Это наш наибольший прогресс в области лёгких танков. Несколько многообещающих прототипов были предоставлены нашими промышленными предприятиями, и теперь остаётся выбрать один для полномасштабной разработки."
contractGENERIC.1.a:0 "Выбираем Dart Corporation"
