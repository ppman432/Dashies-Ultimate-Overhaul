is_state_security:0 "Государственная Безопасность"
is_firearm_regulation:0 "Регулирование Оружия"

penal_slavery:0 "Каторга и Рабство"
penal_slavery_desc:0 "Государство использует более жестокую форму наказаний в виде рабского труда."
penal_labour:0 "Каторжный Труд"
penal_labour_desc:0 "Каторжный труд — термин для различных видов принудительного труда, которым обязаны заниматься заключённые, обычно физический труд."
penal_incarceration:0 "Заключение"
penal_incarceration_desc:0 "Заключённые лишаются свободы и отбывают наказание за совершённые преступления."
penal_rehabilitation:0 "Реабилитация"
penal_rehabilitation_desc:0 "Реабилитация — процесс перевоспитания и подготовки правонарушителей к возвращению в общество. Обычно цель заключается в устранении причин преступности, чтобы заключённые могли вести жизнь без преступлений после освобождения."

encourage_growth:0 "Стимулировать Рост"
encourage_growth_desc:0 "Государство поощряет рост населения через различные программы."
standard_growth:0 "Стандартный Рост"
standard_growth_desc:0 "Государство не вмешивается в рост населения."
controlled_birth_rates:0 "Контролируемая Рождаемость"
controlled_birth_rates_desc:0 "Государство контролирует и устанавливает нормы рождаемости."
national_purity:0 "Национальная Чистота"
national_purity_desc:0 "Государство применяет законы о чистоте крови."

trade_unions_allowed:0 "Разрешены Профсоюзы"
trade_unions_allowed_desc:0 "Профсоюзы и участие рабочих в таких организациях легальны."
state_controlled_unions_allowed:0 "Разрешены Государственные Профсоюзы"
state_controlled_unions_allowed_desc:0 "Легальны только профсоюзы, контролируемые государством."
trade_unions_banned:0 "Профсоюзы Запрещены"
trade_unions_banned_desc:0 "Все формы профсоюзных организаций запрещены."
worker_organs:0 "Организации Рабочих"
worker_organs_desc:0 "Рынок доминируют профсоюзы, синдикаты и/или кооперативы."

police_only:0 "Полиция"
police_only_desc:0 "Закон обеспечивается обычными полицейскими организациями."
counter_terrorism_operatives:0 "Антитеррористические Подразделения"
counter_terrorism_operatives_desc:0 "Созданы специальные подразделения для борьбы с терроризмом."
gendarmerie:0 "Жандармерия"
gendarmerie_desc:0 "Жандармерия — военная структура с функциями обеспечения правопорядка среди гражданского населения."
sassy_secret_police:0 "Секретная Полиция"
sassy_secret_police_desc:0 "Присутствует секретная полиция для борьбы с диссидентами и политическими противниками."
military_policing:0 "Военная Полиция"
military_policing_desc:0 "Обеспечение порядка полностью возложено на вооружённые силы."

firearms_ownership_banned:0 "Запрет на Владение Оружием"
firearms_ownership_banned_desc:0 "Частное владение оружием полностью запрещено."
firearms_harsh_licenses:0 "Жёсткие Лицензии"
firearms_harsh_licenses_desc:0 "Частное владение оружием разрешено, но только при строгом лицензировании."
firearms_licenses:0 "Лицензии"
firearms_licenses_desc:0 "Частное владение оружием разрешено только при наличии лицензии."
right_to_bear_arms:0 "Право на Оружие"
right_to_bear_arms_desc:0 "Частное владение оружием разрешено с минимальным законодательным регулированием."
