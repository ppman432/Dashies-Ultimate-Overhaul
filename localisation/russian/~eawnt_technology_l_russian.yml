l_russian:
#region INFANTRY TECH ##
# Заголовки #
INFANTRY_TITLE_SUPPORT:0 "ОБОРОННОЕ ВООРУЖЕНИЕ"
  INFANTRY_TITLE_SUPPORT_TT:0 "Тяжёлое или специализированное оружие пехоты, применяемое в ограниченном количестве."
INFANTRY_TITLE_GEAR:0 "СНАРЯЖЕНИЕ ПЕХОТЫ"
  INFANTRY_TITLE_GEAR_TT:0 "Стандартная форма пехоты и вспомогательное оборудование."

## ПРОТИВОТАНКОВОЕ / ПРОТИВОВОЗДУШНОЕ ##
infantry_anti_tank:0 "Пехотное противотанковое оружие"
infantry_anti_tank_0:0 "1009 Противотанковое ружьё"
  infantry_anti_tank_0_desc:0 "Появление бронетехники, такой как танки, привело к разработке нового класса пехотного оружия, способного выводить её из строя. Одним из первых проектов стало увеличенное ружьё, стреляющее крупнокалиберными патронами, способными пробивать бронеплиты."
  INFANTRY_AT_TOOLTIP:0 "\n£unit_infantry_icon_small Вся пехота будет требовать дополнительно §Y8§! §Y$infantry_anti_tank$.§!"
infantry_anti_tank_1:0 "1013 Ракетный гранатомёт"
  infantry_anti_tank_1_desc:0 "Противотанковые гранаты доказали свою эффективность в бою, однако были опасны из-за необходимости ближнего применения. Мы можем устранить этот недостаток, используя специальные реактивные гранаты, запускаемые из переносных гранатомётов. Это позволяет пехоте поражать бронетехнику на дистанциях, ранее доступных только для буксируемых пушек и танков."
infantry_anti_tank_2:0 "1019 Ракетный гранатомёт"
  infantry_anti_tank_2_desc:0 "Совершенствование конструкции ракет позволило разделить их на специализированные — бронебойные и фугасные. Это даёт нашим войскам гибкость: гранатомёт можно использовать против как бронированных, так и небронированных целей."
infantry_anti_tank_3:0 "1025 Ракетный гранатомёт"
  infantry_anti_tank_3_desc:0 "Новые модели гранатомётов применяются не только против танков, но и с особыми боеприпасами против бункеров и других укреплений."

infantry_anti_air:0 "Пехотное ПВО"
infantry_anti_air_0:0 "1026 Переносной зенитный комплекс (Mare-Portable)"
  ## Mare используется как намёк, что если даже простейшее существо может это нести, то и человек сможет. Звучит лучше, чем «существо-переносной» или «био-переносной».
  infantry_anti_air_0_short:0 "1026 MAREPADS"
  infantry_anti_air_0_desc:0 "Специализированный пусковой комплекс, способный захватывать воздушные цели и запускать тепловую ракету для их уничтожения. Сам пускатель использует экспериментальные компоненты и проводку, созданные магическими методами, что уменьшает их размеры и вес, делая систему такой же портативной, как современные гранатомёты."
  INFANTRY_AA_TOOLTIP:0 "\n£unit_infantry_icon_small Вся пехота будет требовать дополнительно §Y8§! §Y$infantry_anti_air$.§!"

infantry_at_upgrade:0 "Увеличенный калибр"
  infantry_at_upgrade_desc:0 "Мы можем повысить бронепробиваемость противотанковых ружей, увеличив калибр их боеприпасов."
infantry_at2_upgrade_1:0 "Улучшенная система пуска"
  infantry_at2_upgrade_1_desc:0 "Используя более надёжные батареи и проводку, мы гарантируем срабатывание ракет точно при нажатии спускового крючка. Также новые батареи увеличат срок службы гранатомётных систем."
infantry_at2_upgrade_2:0 "Экспериментальные боеприпасы"
  infantry_at2_upgrade_2_desc:0 "Введение специализированных вариантов боеприпасов для разных целей (противотанковых и противопехотных) повысит эффективность расчётов гранатомётов."
infantry_at_a_upgrade_1:0 "Задержанный запуск двигателя ракеты"
  infantry_at_a_upgrade_1_desc:0 "Чтобы уменьшить обратную реактивную струю, можно ввести систему задержки включения двигателя ракеты. Сначала снаряд выбрасывается малым зарядом, а двигатель включается уже на безопасном расстоянии. Это снижает уровень отдачи и позволяет стрелять в ограниченных пространствах."
infantry_at_a_upgrade_2:0 "Современные взрыватели"
  infantry_at_a_upgrade_2_desc:0 "Появление разнесённой брони резко снизило эффективность наших гранатомётов. Эту проблему можно решить созданием боеприпасов с «умными» взрывателями, способными различать тонкую разнесённую броню и основную защиту танка."
infantry_at_b_upgrade_1:0 "Одноразовые гранатомёты"
  infantry_at_b_upgrade_1_desc:0 "Новые модели гранатомётов жертвуют перезаряжаемостью ради простоты производства и переносимости. Такие одноразовые системы приравниваются к боеприпасам, подобным гранатам, и дополняют тяжёлые образцы, не заменяя их полностью."
infantry_at_b_upgrade_2:0 "Магические прицелы"
  infantry_at_b_upgrade_2_desc:0 "Особые прицелы, использующие магические кристаллы для запуска невидимого снаряда на заданное расстояние и возврата его назад. Толщина брони определяется по плотности возвращённого снаряда, что позволяет наводчикам атаковать самые уязвимые места танка."
infantry_aa_upgrade_1:0 "Новые системы наведения"
  infantry_aa_upgrade_1_desc:0 "Головки самонаведения с двумя датчиками (ИК и УФ) позволяют нашим ракетам отличать самолёты от их помех и повышают эффективность наведения, даже если выхлоп двигателя не виден."
infantry_aa_upgrade_2:0 "Интеграция системы «свой-чужой» (IFF)"
  infantry_aa_upgrade_2_desc:0 "Встроенные выдвижные антенны на MAREPADS позволяют отправлять сигналы для опознавания ближайших самолётов. Это снизит риск дружественного огня."
  
# Пехотная униформа #
infantry_uniform_89:0 "989 Пехотная униформа"
  infantry_uniform_89_desc:0 "\n\nПо мере индустриализации различных империй в X веке стандартные униформы заменили устаревшую систему нашивок и гербов на сюрко. Это облегчало опознавание войск и упрощало процесс производства.\n\n£infantry_uniform_1_overlay"
infantry_uniform_09:0 "1009 Пехотная униформа"
  infantry_uniform_09_desc:0 "\n\nРазвитие текстиля позволило создавать влагостойкую форму, лучше защищающую солдат от непогоды, а стальные каски предназначались для отражения осколков артиллерии. Ярко окрашенная форма постепенно вышла из употребления, так как линейные построения уступили место позиционным боям и окопной войне.\n\n£infantry_uniform_2_overlay"
infantry_uniform_14:0 "1014 Пехотная униформа"
  infantry_uniform_14_desc:0 "\n\nСо временем стало очевидным значение индивидуального камуфляжа. Видимость пехоты можно было снизить, создавая узоры, соответствующие предполагаемой местности боевых действий, что повышало шансы на выживание. Также новые конструкции касок уменьшали риск травм головы при сохранении защиты от осколков.\n£infantry_uniform_3_overlay"
infantry_uniform_20:0 "1020 Пехотная униформа"
  infantry_uniform_20_desc:0 "\n\nВнедрение синтетических волокон позволило создавать более прочные и «дышащие» ткани, уменьшая дискомфорт у солдат. Исследования в области баллистической защиты, альтернативной бронежилетам, привели к созданию лёгких жилетов, обеспечивающих защиту от стрелкового оружия.\n\n£infantry_uniform_4_overlay"
infantry_uniform_26:0 "1026 Пехотная униформа"
  infantry_uniform_26_desc:0 "\n\nФорма может адаптироваться под разные условия, включая камуфляжные схемы, температурный режим и прочие факторы. Новые разработки в области защиты усилили существующие модели касок и стимулировали создание более прочных баллистических жилетов.\n\n£infantry_uniform_5_overlay"

infantry_uniform_2:0 "1009 Пехотная униформа"
  infantry_uniform_2_desc:0 "Развитие текстиля позволило создавать влагостойкую форму, лучше защищающую солдат от непогоды, а стальные каски предназначались для отражения осколков артиллерии. Ярко окрашенная форма постепенно вышла из употребления, так как линейные построения уступили место позиционным боям и окопной войне."
infantry_uniform_3:0 "1014 Пехотная униформа"
  infantry_uniform_3_desc:0 "Со временем стало очевидным значение индивидуального камуфляжа. Видимость пехоты можно было снизить, создавая узоры, соответствующие предполагаемой местности боевых действий, что повышало шансы на выживание. Также новые конструкции касок уменьшали риск травм головы при сохранении защиты от осколков."
infantry_uniform_4:0 "1020 Пехотная униформа"
  infantry_uniform_4_desc:0 "Внедрение синтетических волокон позволило создавать более прочные и «дышащие» ткани, уменьшая дискомфорт у солдат. Исследования в области баллистической защиты, альтернативной бронежилетам, привели к созданию лёгких жилетов, обеспечивающих ограниченную защиту от стрелкового оружия."
infantry_uniform_5:0 "1026 Пехотная униформа"
  infantry_uniform_5_desc:0 "Форма может адаптироваться под разные условия, включая камуфляжные схемы, температурный режим и прочие факторы. Новые разработки в области защиты усилили существующие модели касок и стимулировали создание более прочных баллистических жилетов."

# Улучшения #
equipment_upgrade_0:0 "Базовое снаряжение пехоты"
  equipment_upgrade_0_desc:0 "Обеспечение солдат базовым снаряжением — котелками, сапёрными лопатами и медицинскими наборами — повысит их эффективность на поле боя."
equipment_upgrade_1:0 "Хранение боеприпасов и противогазы"
  equipment_upgrade_1_desc:0 "Специальные контейнеры для хранения боеприпасов предотвратят их порчу в полевых условиях. Разработка противогазов повысит выживаемость солдат при химических атаках противника."
equipment_upgrade_3:0 "Выживаемость пехоты"
  equipment_upgrade_3_desc:0 "Экспериментальные рационы с разнообразным меню повышают моральный дух и помогают быстрее восстанавливаться от усталости. Кроме того, новые достижения в медицине позволили создать компактные и эффективные средства оказания помощи на поле боя."
equipment_upgrade_4:0 "Модернизация рационов"
  equipment_upgrade_4_desc:0 "Ранее проведённые эксперименты с многообразием рационов оказались успешными. Дальнейшие разработки лёгких и долговечных пайков с расширенным меню улучшат восстановление бойцов."

# Ночное видение #
pre_night_vision_0:0 "Сигнальные пистолеты"
  pre_night_vision_0_desc:0 "Специализированное оружие, стреляющее осветительными зарядами, которые освещают большие площади ночью."
pre_night_vision_1:0 "Военные фонари"
  pre_night_vision_1_desc:0 "Альтернатива громоздким лампам — фонари ярче и удобнее для ношения, что повышает видимость в тёмное время."
night_vision3:0 "ПНВ 1-го поколения"
  night_vision3_desc:0 "Касочные очки ночного видения обеспечивают обзор в темноте, усиливая слабый свет и используя встроенный источник света, невидимый для обычных существ."

## ОРУЖИЕ ПЕХОТЫ ##
advanced_infantry_weapons_f:0 "Совершенствование боеприпасов II"
  advanced_infantry_weapons_f_desc:0 "Экспериментальные виды боеприпасов — безгильзовые, с неметаллической гильзой или микро-реактивные — расширяют наши знания и позволяют улучшать текущие образцы. Принятие и стандартизация одной из технологий, либо использование полученных данных для доработки текущих патронов, повысит эффективность оружия."
advanced_infantry_weapons_g:0 "Подствольное оружие"
  advanced_infantry_weapons_g_desc:0 "Можно создать укороченные версии дробовиков и гранатомётов для крепления под ствол винтовок или на интегрированные планки. Хотя они и менее эффективны, чем полноразмерные аналоги, подствольное оружие удобно для оперативного выстрела гранатой или для пролома дверей."

magic_tank_weapon_nsb0:0 "Тяжёлое магическое оружие I"
  magic_tank_weapon_nsb0_desc:0 "Хотя по принципу действия оно похоже на магическое стрелковое оружие, тяжёлые системы требуют куда больше энергии, что создаёт массу проблем. Первые прототипы использовали модифицированные танковые и артиллерийские снаряды для зарядки магической пушки, однако интерфейс пушка–снаряд быстро деградировал из-за огромного потока энергии."
magic_tank_weapon_nsb1:0 "Тяжёлое магическое оружие II"
  magic_tank_weapon_nsb1_desc:0 "Использование кристалло-содержащих сплавов снижает износ интерфейса магической пушки. Это повышает стоимость, но необходимо для увеличения срока службы. Также эффективность можно повысить за счёт доработки самих заклинаний, например, уменьшая диаметр луча и концентрируя удар."
magic_tank_weapon_nsb2:0 "Тяжёлое магическое оружие III"
  magic_tank_weapon_nsb2_desc:0 "Новый метод зарядки использует большой резервуар с жидким кристаллом, в котором хранится энергия. При стрельбе кристалл перекачивается в интерфейс пушки и заряжается. Такой способ позволяет экипажу регулировать мощность выстрела. Однако наличие ёмкости с жидким кристаллом делает танк уязвимым, если его броня будет пробита."
magic_tank_weapon_nsb3:0 "Тяжёлое магическое оружие IV"
  magic_tank_weapon_nsb3_desc:0 "Дальнейшее совершенствование метода зарядки жидкими кристаллами позволило уменьшить объём за счёт применения заменителей, увеличивающих плотность. Это сократило размеры резервуара и снизило общую уязвимость. Эти заменители также ускоряют зарядку, позволяя кристаллам быстрее разряжаться в интерфейсе магической пушки."

magic_tank_weapon0:0 "Тяжёлое магическое оружие I"
  magic_tank_weapon0_desc:0 "Хотя по принципу действия оно похоже на магическое стрелковое оружие, тяжёлые системы требуют куда больше энергии, что создаёт массу проблем. Первые прототипы использовали модифицированные танковые и артиллерийские снаряды для зарядки магической пушки, однако интерфейс пушка–снаряд быстро деградировал из-за огромного потока энергии."
magic_tank_weapon1:0 "Тяжёлое магическое оружие II"
  magic_tank_weapon1_desc:0 "Использование кристалло-содержащих сплавов снижает износ интерфейса магической пушки. Это повышает стоимость, но необходимо для увеличения срока службы. Также эффективность можно повысить за счёт доработки самих заклинаний, например, уменьшая диаметр луча и концентрируя удар."
magic_tank_weapon2:0 "Тяжёлое магическое оружие III"
  magic_tank_weapon2_desc:0 "Новый метод зарядки использует большой резервуар с жидким кристаллом, в котором хранится энергия. При стрельбе кристалл перекачивается в интерфейс пушки и заряжается. Такой способ позволяет экипажу регулировать мощность выстрела. Однако наличие ёмкости с жидким кристаллом делает танк уязвимым, если его броня будет пробита."
magic_tank_weapon3:0 "Тяжёлое магическое оружие IV"
  magic_tank_weapon3_desc:0 "Дальнейшее совершенствование метода зарядки жидкими кристаллами позволило уменьшить объём за счёт применения заменителей, увеличивающих плотность. Это сократило размеры резервуара и снизило общую уязвимость. Эти заменители также ускоряют зарядку, позволяя кристаллам быстрее разряжаться в интерфейсе магической пушки."

## ТРАНСПОРТ ПЕХОТЫ ##
# Моторизация #
motorized_equipment_4:0 "1028 Грузовик"
  motorized_equipment_4_desc:0 "Развитие материаловедения и автомобилестроения позволило создать новые модели грузовиков, частично защищённые от стрелкового оружия и способные перевозить тяжёлые артиллерийские системы."
motorised_upgrade_1:0 "Улучшенная конструкция шасси"
  motorised_upgrade_1_desc:0 "Внедрение стандартизированных деталей в шасси повысит надёжность грузовиков и облегчит их ремонт в полевых условиях."
motorised_upgrade_2:0 "Встроенные радиосистемы"
  motorised_upgrade_2_desc:0 "Интеграция простых радиостанций в грузовики позволит им координироваться друг с другом и с пунктами снабжения, уменьшая вероятность заблудиться по пути."
motorised_upgrade_3:0 "Пулестойкое шасси"
  motorised_upgrade_3_desc:0 "Новые металлические композиты позволяют создавать грузовики из пулестойких материалов, что повышает выживаемость моторизованных подразделений и снижает потери снабжения."

# Боевая машина пехоты #
ifv_equipment:0 "БМП"
EQUIPMENT_IFV:0 "БМП"
ifv_equipment_0:0 "1030 Боевая машина пехоты"
  ifv_equipment_0_short:0 "1030 БМП"
  ifv_equipment_0_desc:0 "Хотя бронетранспортёры были универсальны, установка тяжёлого вооружения на них приводила к потере места для десанта. Новые проекты — боевые машины пехоты — перевозят меньше солдат, но оснащены более мощным вооружением. БМП не заменяют БТР полностью, а предназначены для их поддержки и помощи высаженной пехоте."
  APC_IFV_TOOLTIP:0 "\n£unit_mechanized_icon_small Механизированные бригады будут требовать дополнительно §Y20§! §Y$ifv_equipment$.§!"

