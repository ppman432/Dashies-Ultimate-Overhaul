## Улучшения ##
nsb_upgrade_crew_heater:0 "Обогреватели для экипажа"
  nsb_upgrade_crew_heater_desc:0 "Воздух, нагретый радиаторами двигателя, можно направлять внутрь боевого отделения с помощью вентилятора и воздуховодов, обогревая экипаж."
nsb_upgrade_fire_suppressor:0 "Автоматические системы пожаротушения"
  nsb_upgrade_fire_suppressor_desc:0 "Датчики в моторном отсеке обнаруживают возгорания и мгновенно активируют огнетушители без участия экипажа."
nsb_upgrade_boiling_vessel:0 "Кипятильники"
  nsb_upgrade_boiling_vessel_desc:0 "Встроенные нагреватели воды позволяют экипажу готовить пищу и кипятить воду, не покидая танк и не подвергаясь опасности."
nsb_upgrade_spall_liner:0 "Противоосколочные подбойки"
  nsb_upgrade_spall_liner_desc:0 "Тонкие дополнительные слои брони внутри корпуса снижают количество осколков, образующихся при пробитии."
nsb_upgrade_era:0 "Динамическая защита"
  nsb_upgrade_era_desc:0 "Блоки ДЗ подрываются при попадании снаряда, нарушая его траекторию и снижая вероятность пробития основной брони."
nsb_upgrade_nbc_protection:0 "Защита от ОМП"
  nsb_upgrade_nbc_protection_desc:0 "Системы наддува увеличивают давление воздуха внутри танка, предотвращая проникновение внутрь отравленных или заражённых веществ."
nsb_upgrade_rcws:0 "Дистанционно управляемые боевые модули"
## Я бы хотел поговорить с каждым подрядчиком, решившим, что у одного типа вооружений должно быть больше одного названия. 
