    TITLE_FORT_SUBTITLE_TT:0 "Стационарные фортификационные сооружения, повышающие эффективность оборонительных операций."

  iff_detection:0 "Система опознавания «свой–чужой» (IFF)"
    iff_detection_desc:0 "Опознавание «свой–чужой» (IFF) — система боевой идентификации, которая работает путём ответа на специальные запросные сигналы откликом, определяющим принадлежность. Эта система способна уверенно идентифицировать только самолёты, имеющие известный сигнал (дружественные или союзные), а все прочие помечаются как неопознанные."
