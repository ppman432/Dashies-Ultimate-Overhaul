  INDUSTRY_TITLE_RAILWAYS:0 "ЖЕЛЕЗНЫЕ ДОРОГИ"
    INDUSTRY_TITLE_RAILWAYS_TT:0 "Инфраструктура для поездов, связывающая между собой различные отрасли нашей промышленности."

  ## ЖЕЛЕЗНЫЕ ДОРОГИ ##
  railway_upgrade_0:0 "Стальные рельсы"
    railway_upgrade_0_desc:0 "Стальные рельсы оказались гораздо более прочными и удобными для укладки, чем традиционные чугунные. Это позволит запускать по сети более тяжёлые и быстрые поезда."
  railway_upgrade_1:0 "Системы железнодорожной сигнализации"
    railway_upgrade_1_desc:0 "Новые системы сигнализации, такие как автоматическая блокировка (ABS), позволяют нашим поездам двигаться быстрее без опасности столкновения и уменьшают влияние ошибок операторов в устаревших системах ручной блокировки."
  railway_upgrade_2:0 "Бесстыковой путь"
    railway_upgrade_2_desc:0 "Мы можем заменить требующие постоянного обслуживания рельсовые стыки сварными соединениями. Это не только уменьшает затраты на обслуживание, но и обеспечивает поездам более плавный ход."
  railway_upgrade_3:0 "Дизель и электрификация"
    railway_upgrade_3_desc:0 "Переход от дорогой паровой тяги к более эффективным дизельным локомотивам и электрифицированным железным дорогам позволит улучшить перевозку ресурсов, материалов и людей."
