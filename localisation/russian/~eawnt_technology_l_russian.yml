## ВЕРТОЛЁТЫ ##
scout_helicopter_upgrade_1:0 "Лёгкое вооружение вертолётов"
  scout_helicopter_upgrade_1_desc:0 "Разведывательные вертолёты могут быть оснащены средствами ближней авиационной поддержки и использоваться как лёгкие ударные вертолёты. Хотя они и уступают полноценным ударным машинам, их манёвренность позволяет выполнять быстрые атаки и дезорганизовывать противника."
scout_helicopter_upgrade_2:0 "Встроенные РЛС"
  scout_helicopter_upgrade_2_desc:0 "Проектирование новых разведывательных вертолётов с интегрированной РЛС повышает их разведывательные возможности и устраняет недостатки устаревших систем, устанавливаемых позже."
transport_helicopter_upgrade_1:0 "Усиление конструкции"
  transport_helicopter_upgrade_1_desc:0 "Усовершенствованные методы строительства вертолётов делают их более надёжными и безопасными, а также позволяют модифицировать для разных транспортных задач."
air_assault_company_tech:0 "Аэромобильные роты"
  air_assault_company_tech_desc:0 "Комбинируя транспортные и ударные вертолёты, мы можем сформировать элитные подразделения для наступательных операций. Аэромобильные роты будут обучены высаживаться в тылу противника и захватывать ключевые позиции для поддержки главного удара."

attack_helicopter_equipment_2:0 "1025 Ударный вертолёт"
  attack_helicopter_equipment_2_short:0 "1025 Ударн. верт."
  attack_helicopter_equipment_2_desc:0 "Летающая оружейная платформа с современными турбовентиляторными двигателями, способная нести значительный боекомплект — от блоков НУРСов до управляемых ракет. Также оснащается дистанционно управляемой скорострельной пушкой."

