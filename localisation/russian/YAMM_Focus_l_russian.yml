generic_monarchist_1:0 "Помнить Традиции"
generic_monarchist_1_desc:0 "Старые способы делают нас сильнее"

generic_monarchist_2:0 "Реформа Имперских Сил"
generic_monarchist_2_desc:0 "Реформа наших вооружённых сил необходима для защиты Королевства и служения Королю"

generic_monarchist_3:0 "Монархическая Политика"
generic_monarchist_3_desc:0 "Дворцовые интриги вредят нашему Королевству, мы должны привлечь дворян на нашу сторону"

generic_monarchist_4:0 "Имперская Гвардия"
generic_monarchist_4_desc:0 "Мы должны обучать наших солдат не только современному ведению войны, но и абсолютной преданности Королю и Родине; они будут сражаться и умирать без вопросов"
